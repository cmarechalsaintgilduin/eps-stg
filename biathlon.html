<style>
:root{--bg:#f3f5f8;--carte:#fff;--encre:#14213d;--muted:#5b6b80;--accent:#c0362c;--accent2:#1f6f8b;--ok:#2e8b57;--bord:#d9dee4;--tint:#eef1f4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--encre)}
button,input,select,textarea{font:inherit;color:inherit}
header#top{position:sticky;top:0;z-index:20;background:var(--encre);color:#fff;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 16px}
.titre-zone{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font:700 22px/1.2 Cambria,Georgia,serif;margin:0}
#selPoule{font-size:17px;padding:8px 10px;border-radius:8px;border:0;background:#fff;color:var(--encre);min-height:42px}
.droite-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#sync{font:inherit;font-size:13px;padding:4px 12px;min-height:34px;border:0;color:#fff;cursor:pointer;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
#sync.ok::before{content:"● ";color:#6ee7a0}#sync.ko::before{content:"● ";color:#ff8a80}#sync.loc::before{content:"● ";color:#ffd27a}
nav button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;min-height:42px}
nav button.on{background:#fff;color:var(--encre);border-color:#fff;font-weight:600}
#bandeau{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:#e6ebf1;border-bottom:1px solid var(--bord)}
#bandeau:empty{display:none}
.chip-p{border:1px solid var(--bord);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip-p.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.chip-p b{font-size:15px}
.badge-util{display:inline-block;background:#e3f5ea;color:#1b6e3b;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;margin:0 0 8px}
.bilan3{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start;margin-top:16px}
.mvt.up{color:#1b8a4b;font-weight:700}.mvt.down{color:#c0362c;font-weight:700}
.podgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pod{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:12px 14px;border-top:5px solid var(--accent2)}
.pod:nth-child(3n+2){border-top-color:var(--accent)}.pod:nth-child(3n){border-top-color:#e0a21e}
.podt{display:flex;gap:10px;align-items:center}.podi{font-size:34px}
.podt h3{margin:0;font:700 19px Cambria,Georgia,serif}.podt small{color:var(--muted);display:block;line-height:1.25}
.podl{list-style:none;margin:10px 0 0;padding:0}.podl li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--tint);margin-bottom:5px}
.podl li.r0{background:linear-gradient(90deg,#fff3c4,#ffe9a0);color:#4a3600}.podl li .m{font-size:22px}.podl li .v{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.podl li.r0 .v{color:#6b5200}
.hero .chip-p{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.5)}.hero .chip-p.on{background:#fff;color:var(--accent2);border-color:#fff;font-weight:700}
.chip-p.plus{background:var(--accent2);color:#fff;border-color:var(--accent2);font-weight:700;padding:6px 12px}
.phases{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.modal.grand{max-width:760px}
.eqzone{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
@media(max-width:640px){.eqzone{grid-template-columns:1fr}}
.eqzone h4{margin:0 0 6px;font-size:14px;color:var(--muted)}
.eqdispo,.eqcarte{border:2px dashed var(--bord);border-radius:12px;padding:8px;min-height:64px;margin-bottom:8px}
.eqdispo.sur,.eqcarte.sur{border-color:var(--accent2);background:#eef7fa}
.eqtit{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.eqj{display:inline-block;background:#fff;border:1px solid var(--bord);border-radius:99px;padding:8px 14px;margin:3px;font-weight:600;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.eqj.sel{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.eqghost{position:fixed;z-index:400;pointer-events:none;opacity:.92;box-shadow:0 6px 16px rgba(0,0,0,.3);margin:0}
.total{margin-left:auto;font-weight:600;background:var(--encre);color:#fff;padding:6px 14px;border-radius:99px;font-size:14px}
main{padding:16px;max-width:1400px;margin:0 auto}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media(max-width:820px){.duo{grid-template-columns:1fr}}
@media(max-width:820px) and (orientation:portrait){
  .duo>section:nth-child(2){order:-1;max-height:46vh;overflow:auto;padding-top:0}
  .duo>section:nth-child(2) .ent{position:sticky;top:0;background:var(--carte,#fff);z-index:2;padding-top:12px}
  .duo>section:nth-child(2) .clt thead th{position:sticky;top:46px;background:#fff;z-index:1}
  .duo>section:nth-child(2) .note{display:none}
}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.carte h2{margin:0 0 4px;font:700 19px/1.2 Cambria,Georgia,serif}
.carte h3{margin:14px 0 6px;font-size:16px}
.carte small,.muted{color:var(--muted)}
.ent{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.outils{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;margin-bottom:8px}
.outils input[type=search]{padding:8px 10px;border:1px solid var(--bord);border-radius:8px;min-width:160px}
.liste{max-height:calc(100vh - 270px);min-height:260px;overflow:auto;padding-right:4px}
.ronde{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent2);margin:12px 0 4px}
.match{display:flex;align-items:center;gap:10px;padding:10px 10px;border:1px solid var(--bord);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff;min-height:48px}
.match:active{background:var(--tint)}
.match .num{width:30px;text-align:right;color:var(--muted);font-size:13px;flex:none}
.match .vs{flex:1;min-width:0}
.match .vs i{color:var(--muted);font-style:normal;margin:0 6px;font-size:13px}
.match .gagne{color:var(--accent)}
.match .res{flex:none;font-size:14px;text-align:right;color:var(--muted)}
.match .res b{display:block;color:var(--encre);font-size:16px}
.match:not(.fini) .res{color:#fff;background:var(--accent2);padding:6px 12px;border-radius:8px;font-weight:600}
.match.fini{background:#f7f8fa}
.clt{width:100%;border-collapse:collapse;font-size:15px}
.clt th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:center;padding:6px 4px;border-bottom:2px solid var(--bord);vertical-align:bottom}
.clt td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--tint)}
.clt .nom{text-align:left;font-weight:600}
.clt td.rang{color:var(--muted);width:30px}
.clt td.pts{font-size:18px;font-weight:700;color:var(--accent)}
.clt small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.clt tr.retire td{color:#98a3b3;font-style:italic}
.clt tr:nth-child(1) td.rang{color:#b8860b;font-weight:700}
.diffp{color:var(--ok)}.diffn{color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.attente{text-align:center;padding:40px 20px}
.btn{border:1px solid var(--bord);background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:42px}
.btn:hover{background:var(--tint)}
.btn.primaire{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
.btn.danger{background:#fff;border-color:var(--accent);color:var(--accent)}
.btn.danger.plein{background:var(--accent);color:#fff}
.btn.petit{padding:5px 10px;min-height:34px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sous{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.sous button{padding:10px 16px;border-radius:99px;border:1px solid var(--bord);background:#fff;cursor:pointer;min-height:42px}
.sous button.on{background:var(--encre);color:#fff;border-color:var(--encre)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.champ label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.champ input,.champ select,textarea,.tj input,.tj select,.add input{padding:9px 10px;border:1px solid var(--bord);border-radius:8px;width:100%;background:#fff;min-height:42px}
.champ .aide{font-size:12px;color:var(--muted);margin-top:3px}

/* ---- Podiums & courbes ---- */
.pods{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:6px}
.pod-card{border:2px solid var(--bord);border-radius:16px;padding:10px 10px 0;background:linear-gradient(#fffdf6,#fff);overflow:hidden}
.pod-t{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}

.pod-ico{font-size:34px;display:inline-block;animation:pod-bob 2.4s ease-in-out infinite}
.pod{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:6px;margin-top:8px;min-height:190px}
.pod-col{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding-top:4px;min-width:0}
.pod-col.vide{cursor:default}
.pod-badge{position:relative;display:block;line-height:1}
.pod-med{font-size:34px;display:inline-block}
.pod-col.or .pod-med{font-size:44px;animation:pod-bob 1.8s ease-in-out infinite,pod-glow 2.2s ease-in-out infinite}
.pod-col.arg .pod-med,.pod-col.bro .pod-med{animation:pod-bob 2.6s ease-in-out infinite}
.couronne{position:absolute;left:50%;top:-22px;transform:translateX(-50%) rotate(-8deg);font-style:normal;font-size:24px;animation:pod-wig 2s ease-in-out infinite}
.pod-nom{font-weight:700;font-size:13px;line-height:1.15;margin-top:4px;word-break:break-word;max-width:100%}
.pod-val{font:700 15px/1.2 Cambria,Georgia,serif;font-variant-numeric:tabular-nums}
.pod-n{font-size:10px;color:var(--muted)}
.pod-bloc{display:block;width:100%;margin-top:4px;border-radius:8px 8px 0 0;color:#fff;font:700 22px/1 Cambria,Georgia,serif;padding-top:6px;text-align:center;transform-origin:bottom}
.pod-col.or .pod-bloc{height:74px;background:linear-gradient(#f2c230,#c9971a)}
.pod-col.arg .pod-bloc{height:52px;background:linear-gradient(#cfd5dc,#9aa3ad)}
.pod-col.bro .pod-bloc{height:38px;background:linear-gradient(#d99a63,#a9693a)}
.pod-col:hover .pod-nom{text-decoration:underline}
.pod.anim .pod-bloc{animation:pod-rise .9s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d)}
.pod.anim .pod-badge,.pod.anim .pod-nom,.pod.anim .pod-val,.pod.anim .pod-n{animation:pod-pop .6s ease both;animation-delay:calc(var(--d) + .5s)}

/* ----- Temps ----- */
function parseTemps(s){ /* "min,sec" comme dans le tableur : 3,25 = 3 min 25 ; 3,5 = 3 min 50 ; 4 = 4 min ; 3:25 accepté */

/* ----- Configuration d'une séance ----- */
function validerConf(c){

  var sum=0;

    var f=c.fractions[i];
    if(!(f.d>0))return 'La fraction '+(i+1)+' doit avoir une distance.';
    if(c.tour>0&&f.d%c.tour!==0)return 'La fraction '+(i+1)+' ('+f.d+' m) doit être un multiple de la longueur de piste ('+c.tour+' m).';
    sum+=f.d;
  }
  if(sum!==c.total)return 'Total des fractions : '+sum+' m. Il doit faire exactement '+c.total+' m ('+(sum<c.total?'il manque ':'il y a ')+Math.abs(c.total-sum)+' m'+(sum>c.total?' en trop':'')+').';
  return null;

function fracLbl(c,f,i){return c.nodist?'Fraction '+(i+1):(i+1)+' · '+f.d+' m';}
function seanceLibre(sea){return !!(sea.libFr||sea.libTir||sea.libCib);}
/* Applique les verrous du prof : ce qui est « imposé » vient du modèle de la séance, ce qui est « libre » vient de l'élève */
function verrouiller(sea,fr){

  return F.map(function(f,i){var t=tpl[Math.min(i,tpl.length-1)],m=sea.libTir?f.tir.m:t.tir.m,cb;
    if(m==='aucun')cb='C';else if(sea.libCib)cb='C';else cb=t.tir.c;
    return {d:f.d,tir:{m:m,c:cb}};});
}
function confDe(sea,fr){return {total:sea.total,tour:sea.tour,pen:sea.penalite,req:normReq(sea.req),fractions:(fr||sea.fractions).map(normFrac)};}
function nbTirs(c){return c.fractions.filter(function(f){return f.tir.m!=='aucun';}).length;}

/* ----- Évaluation d'un passage (indicateurs du tableur) ----- */
/* Barèmes réglables (valeurs par défaut = celles du tableur) : 3 seuils séparent les 4 niveaux Insuffisant / Fragile / Satisfaisant / Très bonne maîtrise */

  return o;}

var COH=['Écart important','Écart notable','Cohérent','Très cohérent'];

/* ----- Passages ----- */
function passagesDe(Sx,jid,sid){return Sx.passages.filter(function(p){return p.j===jid&&(!sid||p.sid===sid);}).sort(function(a,b){return a.t0-b.t0;});}

function recupReste(Sx,jid,now){ /* secondes restantes de récupération obligatoire (0 = libre) */
  var p=dernierFin(Sx,jid);if(!p)return 0;
  var r=Math.ceil((p.fin+(p.recup||0)*1000-now)/1000);return r>0?r:0;
}
function observeDe(Sx,jid){return Sx.passages.find(function(p){return p.obs===jid&&p.statut==='course';})||null;}
function departPassage(Sx,b,now,prof){
  var j=joueurDe(Sx,b.j);if(!j)return 'Élève inconnu.';

  if(observeDe(Sx,b.j))return 'Tu es observateur d\'une course en cours : termine-la d\'abord.';
  if(aSaisir(Sx,b.j)&&!prof)return 'Enregistre d\'abord les résultats de ta dernière course.';
  var r=recupReste(Sx,b.j,now);
  if(r>0&&!prof)return 'Récupération obligatoire : encore '+fmt(r)+'.';
  var sea=Sx.seance,conf;
  if(sea.type==='relais')return 'Séance en relais : le chrono se lance pour toute l\'équipe depuis « Chrono classe ».';
  if(seanceLibre(sea)){
    conf=confDe(sea,verrouiller(sea,b.fractions));
    var e=validerConf(conf);if(e)return e;
  }else{conf=confDe(sea);var e2=validerConf(conf);if(e2)return 'Séance mal configurée par le professeur : '+e2;}
  var obs=null;
  if(sea.obs){
    obs=String(b.obs||'');
    if(!obs)return 'Choisis ton observateur avant de partir.';
    if(obs===b.j)return 'Tu ne peux pas être ton propre observateur.';
    if(!joueurDe(Sx,obs))return 'Observateur inconnu.';
    if(actifDe(Sx,obs))return 'Cet observateur est lui-même en course.';
    if(observeDe(Sx,obs))return 'Cet observateur suit déjà un autre élève.';
  }
  var cibles=conf.fractions.map(function(f,i){
    if(f.tir.m==='aucun')return null;
    if(f.tir.c!=='C')return f.tir.c;
    var c=b.cibles&&b.cibles[i];return CIBLES[c]?c:null;});
  for(var k=0;k<cibles.length;k++)if(conf.fractions[k].tir.m!=='aucun'&&!cibles[k])return 'Choisis la cible du tir '+(k+1)+' (petite, moyenne ou grande).';

  if(sea.annonce==='pct'){

    if(!j.vmaOk)return 'Ta VMA doit d\'abord être confirmée par ton professeur.';
    if(!Array.isArray(b.pct)||b.pct.length!==nf)return 'Annonce ton % de VMA pour chaque fraction.';
    proj=[];projPct=[];
    for(var q=0;q<nf;q++){var v=Number(b.pct[q]);if(!(v>=30&&v<=130))return 'Annonce ton % de VMA pour la fraction '+(q+1)+' (entre 30 et 130).';

    proj=[];projPct=[];

      proj.push(Math.round(t));projPct.push(j.vma>0?(conf.fractions[q2].d/1000)/(t/3600)/j.vma:null);}

  var p={id:uid('p'),j:b.j,sid:sea.id,sn:sea.nom,sd:sea.date||now,m:sea.manche||1,n:n,conf:conf,proj:proj,projPct:projPct,cibles:cibles,obs:obs,t0:now,fin:null,recup:sea.recup,statut:'course'};
  p.cur={i:0,ph:'p',ts:null,hits:0,miss:0};p.courses=[];p.tirs=[];p.und=[];

function avancerLive(p,now){

}
function liveAction(Sx,b,now){ /* l'observateur note la course en direct : l'horloge de référence est celle du maître */

  if(!p||p.statut!=='course'||!p.cur)return 'Course introuvable ou non suivie en direct.';
  var c=p.conf,cur=p.cur,f=c.fractions[cur.i];

  }
  if(b.a==='go')return 'La course est déjà lancée.';

function lignesVersEleves(rows){

  if(!rows.length)return [];
  var low=function(x){return String(x==null?'':x).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');};
  var h=rows[0].map(low),iN=-1,iP=-1,iV=-1,iG=-1,head=false;
  h.forEach(function(c,i){
    if(/^(nom|eleves?|prenom nom|nom prenom|identite)/.test(c)&&iN<0){iN=i;head=true;}
    else if(/^prenom/.test(c)){iP=i;head=true;}

    else if(/^(genre|sexe)/.test(c)){iG=i;head=true;}

  if(!head){iN=0;iV=1;}

  rows.slice(head?1:0).forEach(function(r){
    var nom=String(r[iN]==null?'':r[iN]).trim();if(iP>=0&&r[iP])nom=(String(r[iP]).trim()+' '+nom).trim();

/* ---------- Équipes de relais : équilibrées entre elles, variées à l'intérieur, mixtes ---------- */
function faireEquipes(J,o){
  o=o||{};var N=J.length;if(!N)return {equipes:[],ecart:0,sansVma:0};
  var k=o.mode==='taille'?Math.ceil(N/Math.max(1,o.valeur|0||1)):Math.max(1,o.valeur|0||1);k=Math.max(1,Math.min(k,N));
  var conn=J.filter(function(j){return j.vma>0;}),moyG=conn.length?conn.reduce(function(s,j){return s+j.vma;},0)/conn.length:1;
  var L=J.map(function(j){return {j:j,v:j.vma>0?j.vma:moyG,r:Math.random()};});
  L.sort(function(a,b){var d=(b.v+(b.r-.5)*.3)-(a.v+(a.r-.5)*.3);return d;});
  var base=Math.floor(N/k),extra=N%k,cap=[],T=[],i;
  for(i=0;i<k;i++){cap.push(base+(i<extra?1:0));T.push({m:[],s:0});}
  for(i=cap.length-1;i>0;i--){var q=Math.floor(Math.random()*(i+1)),t=cap[i];cap[i]=cap[q];cap[q]=t;}
  if(o.type==='niveau'){var p=0;T.forEach(function(t,ti){for(var n=0;n<cap[ti];n++){t.m.push(L[p]);t.s+=L[p].v;p++;}});}
  else{
    L.forEach(function(e){
      var best=null,bs=null;
      T.forEach(function(t,ti){if(t.m.length>=cap[ti])return;
        var same=o.genre&&e.j.genre?t.m.filter(function(x){return x.j.genre===e.j.genre;}).length:0;
        var sc=[same,t.s/(cap[ti]||1)];
        if(!bs||sc[0]<bs[0]||(sc[0]===bs[0]&&sc[1]<bs[1])){bs=sc;best=t;}});
      best.m.push(e);best.s+=e.v;});
    /* amélioration par échanges */
    function cout(){
      var mo=T.map(function(t){return t.s/t.m.length;}),mu=mo.reduce(function(a,b){return a+b;},0)/k,vr=mo.reduce(function(a,b){return a+(b-mu)*(b-mu);},0);
      var g=0;if(o.genre){var F=J.filter(function(j){return j.genre==='F';}).length;T.forEach(function(t){var f=t.m.filter(function(x){return x.j.genre==='F';}).length,id=F*t.m.length/N;g+=(f-id)*(f-id);});}
      return vr*100+g*3;}
    var cc=cout(),it;
    if(k>1)for(it=0;it<1500;it++){
      var a=Math.floor(Math.random()*k),b=Math.floor(Math.random()*k);if(a===b)continue;
      var ia=Math.floor(Math.random()*T[a].m.length),ib=Math.floor(Math.random()*T[b].m.length),ea=T[a].m[ia],eb=T[b].m[ib];
      T[a].m[ia]=eb;T[b].m[ib]=ea;T[a].s+=eb.v-ea.v;T[b].s+=ea.v-eb.v;
      var nc=cout();if(nc<=cc)cc=nc;else{T[a].m[ia]=ea;T[b].m[ib]=eb;T[a].s+=ea.v-eb.v;T[b].s+=eb.v-ea.v;}
    }
  }
  var eq=T.map(function(t){var ms=t.m.map(function(x){return x.j;}).sort(function(a,b){return (b.vma||0)-(a.vma||0);});
    var cn=ms.filter(function(j){return j.vma>0;});
    return {membres:ms,n:ms.length,nF:ms.filter(function(j){return j.genre==='F';}).length,nG:ms.filter(function(j){return j.genre==='G';}).length,
      moy:cn.length?cn.reduce(function(s,j){return s+j.vma;},0)/cn.length:null,
      mini:cn.length?Math.min.apply(null,cn.map(function(j){return j.vma;})):null,maxi:cn.length?Math.max.apply(null,cn.map(function(j){return j.vma;})):null};});
  if(o.type==='niveau')eq.sort(function(a,b){return (b.moy||0)-(a.moy||0);});
  var ms=eq.map(function(e){return e.moy;}).filter(function(x){return x!=null;});
  return {equipes:eq,ecart:ms.length?Math.max.apply(null,ms)-Math.min.apply(null,ms):0,sansVma:J.length-conn.length};
}

/* Lecture d'un .xlsx sans bibliothèque (zip + XML) */
async function lireXlsx(buf){
  var dv=new DataView(buf),u8=new Uint8Array(buf),e=buf.byteLength-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;

  var n=dv.getUint16(e+10,true),p=dv.getUint32(e+16,true),files={};
  for(var i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    files[name]={method:method,csize:csize,lho:lho};p+=46+nl+el+cl;
  }
  async function get(name){
    var f=files[name];if(!f)return null;
    var lnl=dv.getUint16(f.lho+26,true),lel=dv.getUint16(f.lho+28,true),start=f.lho+30+lnl+lel;
    var data=u8.subarray(start,start+f.csize);

    if(typeof DecompressionStream==='undefined')throw new Error('Ce navigateur ne sait pas ouvrir .xlsx : enregistrez en .csv ou collez le texte.');
    var s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new TextDecoder().decode(await new Response(s).arrayBuffer());
  }
  var xml=function(t){return new DOMParser().parseFromString(t,'application/xml');};
  var shared=[];var ss=await get('xl/sharedStrings.xml');
  if(ss){xml(ss).querySelectorAll('si').forEach(function(si){var t='';si.querySelectorAll('t').forEach(function(x){t+=x.textContent;});shared.push(t);});}
  var sheets=Object.keys(files).filter(function(k){return /^xl\/worksheets\/sheet\d+\.xml$/.test(k);}).sort(function(a,b){return parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]);});
  if(!sheets.length)throw new Error('Aucune feuille trouvée dans le fichier');
  async function lireFeuille(path){var doc=xml(await get(path)),rows=[];
  doc.querySelectorAll('row').forEach(function(rw){
    var r=[];
    rw.querySelectorAll('c').forEach(function(c){
      var ref=c.getAttribute('r')||'',m=ref.match(/^([A-Z]+)/),col=0;
      if(m){for(var k=0;k<m[1].length;k++)col=col*26+(m[1].charCodeAt(k)-64);col--;}else col=r.length;
      var t=c.getAttribute('t'),v=c.querySelector('v'),val='';

      else if(v)val=v.textContent;

    });
    for(var q=0;q<r.length;q++)if(r[q]===undefined)r[q]='';
    rows.push(r);
  });
  return rows;}
  var best=null;
  for(var si=0;si<sheets.length;si++){
    var rr=await lireFeuille(sheets[si]);if(!best)best=rr;
    if(rr.slice(0,3).some(function(r){return r.some(function(c){return /^(nom|[eé]l[eè]ves?|pr[eé]nom)/i.test(String(c).trim());});}))return rr;
  }
  return best||[];
}

function maitreTraiter(p,b,c,qui){

/* --- Tablette élève --- */
function demarrerEleve(code){
  arreter();MODE='slave';ver=0;accepterProchain=true;setSync(false);
  var p=nouvellePeer('bia-el-'+uid('').replace(/[^a-zA-Z0-9]/g,''));if(!p)return;

    if(e&&e.type==='peer-unavailable'){if(lien){var l=lien;lien=null;try{l.close();}catch(x){}}setSync(false);}
    else if(p.destroyed){peer=null;}
  });

    if(MODE!=='slave')return;
    if(!peer||peer.destroyed){demarrerEleve(code);return;}
    if(lien&&lien.open){
      if(Date.now()-lastPong>14000){var l=lien;lien=null;try{l.close();}catch(x){}setSync(false);rejeterTout();return;}
      try{lien.send({t:'ping'});}catch(x){}
    }else if(!lien){
      if(peer.disconnected){try{peer.reconnect();}catch(x){}}else ouvrirLien(code);
    }
  },4000);
  garderEveille();
}
function ouvrirLien(code){
  if(MODE!=='slave'||!peer||peer.destroyed||peer.disconnected)return;
  if(lien){var old=lien;lien=null;try{old.close();}catch(x){}}
  var c;
  try{c=peer.connect(ID_PREFIX+code,{reliable:true});}catch(e){return;}

  var to=setTimeout(function(){if(!ouvert&&lien===c){lien=null;try{c.close();}catch(x){}}},9000);

    if(lien!==c)return;
    ouvert=true;clearTimeout(to);lastPong=Date.now();accepterProchain=true;setSync(true);
    try{c.send({t:'get'});}catch(x){}
    envoyerEnAttente();
  });
  c.on('data',function(d){if(lien!==c)return;lastPong=Date.now();eleveRecevoir(d);});
  var perdu=function(){if(lien!==c)return;lien=null;clearTimeout(to);setSync(false);rejeterTout();};
  c.on('close',perdu);c.on('error',perdu);
}
function eleveRecevoir(d){
  if(!d||typeof d!=='object')return;
  if(d.t==='state'){if(accepterProchain||d.ver>=ver){accepterProchain=false;appliquerServeur(d.state,d.ver);}return;}
  if(d.t==='rep'){

    if(d.ok)q.res(d.d);else{var e=new Error(d.erreur||'Erreur');e.status=d.status;q.rej(e);}

}
function appelEleve(p,b,c){
  return new Promise(function(res,rej){

    var id=uid('r');

    pending[id]={res:res,rej:rej,timer:timer};
    try{lien.send({t:'req',id:id,p:p,b:b,c:c});}catch(e){clearTimeout(timer);delete pending[id];rej(e);}
  });
}

/* ---------- Boîtes de dialogue ---------- */
function dialogue(titre,corps,boutons){
  return new Promise(function(res){
    var v=document.createElement('div');v.className='voile';
    v.innerHTML='<div class="modal" role="dialog"><h3>'+titre+'</h3><div>'+corps+'</div><div class="boutons">'+boutons.map(function(b,i){return '<button class="btn '+(b.cls||'')+'" data-i="'+i+'">'+b.label+'</button>';}).join('')+'</div></div>';
    document.body.appendChild(v);
    /* le clavier tactile ne doit pas masquer la boîte : on la cale sur la zone réellement visible */
    var vvp=window.visualViewport;
    function caler(){if(!document.body.contains(v)){if(vvp){vvp.removeEventListener('resize',caler);vvp.removeEventListener('scroll',caler);}return;}
      if(!vvp)return;v.style.inset='auto';v.style.left='0';v.style.right='0';v.style.top=vvp.offsetTop+'px';v.style.height=vvp.height+'px';
      var fa=document.activeElement;if(fa&&v.contains(fa)&&fa.scrollIntoView){try{fa.scrollIntoView({block:'center'});}catch(e){}}}
    if(vvp){vvp.addEventListener('resize',caler);vvp.addEventListener('scroll',caler);}
    v.addEventListener('focusin',function(){setTimeout(caler,250);});
    var occupe=false;
    function clic(i){
      var b=boutons[i];if(occupe)return;occupe=true;
      Promise.resolve(b.check?b.check(v):true).then(function(ok){occupe=false;if(ok){v.remove();res({val:b.val,root:v});}});
    }
    v.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)clic(+b.dataset.i);else if(e.target===v&&boutons[0].val===false){v.remove();res({val:false,root:v});}});
    v.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT'){var i=boutons.findIndex(function(b){return /primaire/.test(b.cls||'');});if(i>=0){e.preventDefault();clic(i);}}});
    var f=v.querySelector('input:not([type=radio]):not([type=checkbox])');if(f)setTimeout(function(){f.focus();},50);
  });
}

  var h='<h3>📣 Annoncé ou réalisé ?</h3><div style="overflow:auto"><table class="mini"><thead><tr><th>Fraction</th><th>Annoncé</th><th>Réalisé</th><th>Écart de temps</th><th>Écart d\'intensité</th><th>Intensité</th><th>Cohérence</th></tr></thead><tbody>';
  function ligne(lab,pjT,pjP,t,pc,dT,dP,coh,gras,niv){
    return '<tr'+(gras?' class="top"':'')+'><td><b>'+lab+'</b></td><td>'+fmt(pjT)+(pjP!=null?' · '+Math.round(pjP*100)+' %':'')+'</td><td>'+fmt(t)+(pc!=null?' · '+Math.round(pc*100)+' %':'')+'</td><td><b style="color:'+(dT>0?'var(--accent)':'var(--ok)')+'">'+(dT>0?'+':dT<0?'−':'±')+fmt(Math.abs(dT))+'</b> <small>'+(dT>0?'plus lent':dT<0?'plus rapide':'pile')+'</small></td><td>'+(dP!=null?'<b>'+(dP>0?'+':dP<0?'−':'±')+Math.abs(Math.round(dP*100))+' pts</b> <small>de VMA</small>':'—')+'</td><td>'+nivSp(niv)+'</td><td><span class="niv n'+coh+'">'+smi(coh)+' '+COH[coh]+'</span></td></tr>';
  }
  p.conf.fractions.forEach(function(f,i){var q=e.fr[i];h+=ligne(fracLbl(p.conf,f,i),q.pj,q.pjPct,q.t,q.pct,q.dT,q.dPct,q.coh,false,q.n);});
  h+=ligne('Total course',e.proj,e.pjPct,e.course,e.pct,e.dT,e.dPct,e.coh,true,e.nVMA)+'</tbody></table></div>';
  var best=null,worst=null;e.fr.forEach(function(q,i){if(!best||Math.abs(q.dT/q.pj)<Math.abs(best.q.dT/best.q.pj))best={q:q,i:i};if(!worst||Math.abs(q.dT/q.pj)>Math.abs(worst.q.dT/worst.q.pj))worst={q:q,i:i};});
  if(best&&worst&&best.i!==worst.i)h+='<p style="margin:8px 0 0">🎯 Fraction la plus <b>cohérente</b> : n°'+(best.i+1)+' ('+(best.q.dT>0?'+':'−')+fmt(Math.abs(best.q.dT))+'). Fraction la moins cohérente : <b>n°'+(worst.i+1)+'</b> ('+(worst.q.dT>0?'plus lent':'plus rapide')+' de '+fmt(Math.abs(worst.q.dT))+' que prévu'+(worst.q.dPct!=null?', '+Math.abs(Math.round(worst.q.dPct*100))+' pts de VMA d\'écart':'')+').</p>';
  return h;
}

function etatCell(j,now){
  var p=actifDe(S,j.id);

  if(p){
    var cur=p.cur,c=p.conf,n=c.fractions.length;
    if(!cur)return {k:'saisie',l:'(ancienne saisie)'};
    if(cur.ph==='p')return {k:'prete',l:'🚦 Prêt·e',s:''};
    var f=c.fractions[cur.i];
    if(cur.ph==='c')return {k:'course',l:'🏃 F'+(cur.i+1)+'/'+n+' · '+f.d+' m',s:'<i data-t0="'+cur.ts+'">'+fmt((now-cur.ts)/1000)+'</i>'};
    return {k:'tir',l:'🎯 Tir · cible '+CIBLES[p.cibles[cur.i]].nom.toLowerCase(),s:'<i data-t0="'+cur.ts+'">'+fmt((now-cur.ts)/1000)+'</i>'};
  }
  var pf=finiDe(j.id);
  if(pf){var e=evalPassage(pf,S),r0=recupReste(S,j.id,now),d0=dernierFin(S,j.id),ex=[];
    ex.push(fmt(e.course)+' course'+(e.hasShots?' · '+fmt(e.tirs)+' tirs':''));

    if(e.balls)ex.push(e.hits+'/'+e.balls+' tirs réussis ('+Math.round(e.tirPct*100)+' %)');
    return {k:'fini',l:'🏁 🔒'+(r0>0&&d0?' · 😮‍💨 <i data-fin="'+(d0.fin+(d0.recup||0)*1000)+'">'+fmt(r0)+'</i>':' Terminé'),s:fmt(e.total),x:ex,p:pf};}
  var r=recupReste(S,j.id,now);

    for(var i=0;i<D.length;i++){tr.push(tempsCellule(r.tr[i]));tp.push(tempsCellule(r.tp[i]));}
    if(tr.some(function(x){return !x;})){ign++;err=err||j.nom;return;}
    var v=parseFloat(String(r.vma!=null?r.vma:'').replace(',','.')),ts=tempsCellule(r.tir),dd=String(r.d||'').split(/[\s,;+]+/).map(Number).filter(function(x){return x>0;});
    rows.push({j:j.id,vma:(isFinite(v)&&v>0)?v:0,tp:tp,tr:tr,tot:tempsCellule(r.tot),tir:ts?{s:ts,h:parseInt(r.h,10)||0,r:parseInt(r.r,10)||0}:null,s:socSel(r),d:dd.length===D.length?dd:null});
    used[j.id]=1;
  });
  if(!rows.length&&!Object.keys(stJ).some(function(k){return stJ[k]!=='present';})){toast('Aucune ligne complète : il faut tous les temps réalisés (TR1…TR'+D.length+').'+(err?' Ex. : '+err+'.':''));return;}
  var ex=S.passages.filter(function(p){return p.papier&&p.sn===PAP.nom;})[0],sid=PAP.sid||(ex?ex.sid:uid('s'));
  apiEleve('/api/papier',{sid:sid,sn:PAP.nom,fractions:D,nodist:!PAP.distOk,rows:rows,st:stJ,date:PAP.date||Date.now(),newJ:PAP.newJ.filter(function(j){return used[j.id];}).map(function(j){return {id:j.id,nom:j.nom,vma:j.vma};})},function(){
    bilanSid=sid;sous='bilan';PAP.rows={};PAP.newJ=[];PAP.sid=null;PAP.date='';render();
    toast(rows.length+' évaluation'+(rows.length>1?'s':'')+' enregistrée'+(rows.length>1?'s':'')+(ign?' · '+ign+' ligne'+(ign>1?'s':'')+' incomplète'+(ign>1?'s':'')+' ignorée'+(ign>1?'s':''):'')+'. Vous pouvez imprimer les coupons.');
  });
}
document.addEventListener('input',function(e){
  var el=e.target;if(!el.dataset||el.dataset.pap===undefined)return;
  var r=papRow(el.dataset.pap),f=el.dataset.f;
  if(f==='tp'||f==='tr')r[f][+el.dataset.i]=el.value;else if(f==='s')r.s[el.dataset.c]=el.value;else r[f]=el.value;
  if(f==='tr'||f==='tot')papTirAuto(el.dataset.pap);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.pap!==undefined&&el.dataset.f==='st'){papRow(el.dataset.pap).st=el.value;render();return;}
  if(el.id==='papDate'){var dd=new Date(el.value);PAP.date=isNaN(dd)?'':dd.getTime();return;}
  if(el.id==='papNom'){PAP.nom=el.value.trim()||'Évaluation papier';render();return;}
  if(el.id==='papDist'){PAP.dist=el.value;render();return;}
  if(el.id==='papDistOk'){PAP.distOk=el.value==='1';render();return;}
  if(el.id==='fichierPap'){
    var fl=el.files[0];if(!fl)return;var nom=fl.name.toLowerCase(),p;
    if(/\.(xlsx|xlsm)$/.test(nom))p=fl.arrayBuffer().then(lireXlsx);
    else if(/\.xls$/.test(nom))p=Promise.reject(new Error('Ancien format .xls non pris en charge : enregistrez en .xlsx ou .csv.'));
    else p=fl.text().then(parseCSV);
    p.then(importerPapier).catch(function(err){toast(err.message||'Lecture impossible.');});
    el.value='';
  }
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='importerPap'){var t=$('#collagePap').value;if(!t.trim()){toast('Collez d\'abord le texte.');return;}importerPapier(parseCSV(t));}
  else if(a==='enregPap')enregistrerPapier();
  else if(a==='papRaz'){PAP.rows={};PAP.newJ=[];PAP.sid=null;render();}
  else if(a==='papEdit'){chargerPapier(b.dataset.sid||($('#papSel')&&$('#papSel').value));}
});

/* ---------- Démarrage ---------- */
PARAM.rerender=render;
chargerCache();
setSync();
var saved=null;try{saved=localStorage.getItem('bia_mode');}catch(e){}
if((saved==='master'||saved==='slave')&&pcode)demarrerMode(saved);
else if(saved==='local')demarrerMode('local');
else MODE=null;
setSync();render();
})();

</script>
