<body>
<header id="top">
  <div class="titre-zone"><h1 id="titre">Natation</h1></div>
  <nav><button data-v="classes">🏠 Classes</button><button data-v="saisie">📝 Saisie évaluation papier</button><button data-v="bilan">🧾 Bilan et coupons</button><button data-v="attest">🏊 Attestations savoir-nager</button><button data-v="bareme">📏 Barèmes et textes</button><button data-v="sauv">💾 Sauvegardes</button><button data-v="param">🎨 Paramètres application</button></nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<script id="core">
/* ----- Noyau : calculs purs (testables) ----- */
var NIV_NOMS=['Insuffisant','Fragile','Satisfaisant','Très bonne maîtrise'];
function uid(p){return (p||'i')+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);}
var SN_ACTIONS=[
 ['Entrée dans l\'eau','Entrée dans l\'eau'],
 ['Passage sous tapis 1','Passage sous tapis 1'],
 ['Nager sur le ventre','Nager sur le ventre'],
 ['Surplace 15 s','Surplace 15 secondes'],
 ['Nager sur le dos','Nager sur le dos'],
 ['Étoile dorsale 15 s','Étoile dorsale 15 secondes'],
 ['Passage sous tapis 2','Passage sous tapis 2']];
var SN_N=SN_ACTIONS.length;
function cfgDefaut(){
  return {titre:'NATATION',sm:['☹️','😐','🙂','😄'],niv:NIV_NOMS.slice(),
    endu:[5,8,10],      /* longueurs minimum pour Fragile, Satisfaisant, Très bonne maîtrise */
    ecart:[0,1,2],      /* écart max (en longueurs) pour Très bonne maîtrise, Satisfaisant, Fragile */
    snVis:true,prof:'C. MARECHAL',etab:'Collège Saint-Gilduin',logo:'',
    comp:[
     {id:'tech',titre:'Nager équilibré',vis:true,dom:'D1.d : Acquérir des techniques spécifiques',en:'Je suis capable de nager sur le ventre et sur le dos en étant équilibré à l’horizontal, en maîtrisant ma respiration et ma propulsion.',niv:[
       ['Le terrien','Il est le plus souvent à la verticale sur le ventre ou sur le dos pour chercher de l\'appui. Il respire devant lui et s\'arrête pour reprendre son souffle.'],
       ['L\'aléatoire','Il est plus à l\'horizontal mais respire la tête hors de l\'eau la plupart du temps. Ses appuis sont encore peu efficaces (manque d\'amplitude et doigts ouverts).'],
       ['Le nageur spécifique','Il est surtout plus efficace dans une nage. Son amplitude est meilleure et il parvient à souffler dans l\'eau de manière plus régulière en crawl.'],
       ['Le nageur polyvalent','Il est à l\'aise aussi bien sur le dos que sur le ventre. Sa respiration est aquatique et régulière en crawl. Il est plus efficace (bonne amplitude, bons appuis).']]},
     {id:'endu',titre:'Nager 6 minutes',vis:true,auto:true,dom:'D1.d : Mobiliser différentes ressources',en:'Je suis capable de nager 6’ sans m’arrêter sans avoir pied.',niv:[
       ['Le nageur intermittent','Il a besoin de s\'accrocher de temps en temps pour se rassurer et/ou retrouver son souffle car sa nage n\'est pas économique (entre 1 et 4 longueurs).'],
       ['Le nageur pressé','Il réalise encore des reprises d\'appui à la verticale. Il a tendance à nager trop en fréquence ce qui le rend vite essoufflé (entre 5 et 7 longueurs).'],
       ['Le nageur économique','Il maîtrise mieux sa nage et prend son temps pour ne pas se fatiguer. À défaut d\'être très efficace, sa nage économique lui permet de nager 6’ sans s\'arrêter (entre 8 et 9 longueurs).'],
       ['Le nageur endurant','Il est plus efficace. Sa bonne maîtrise de la respiration et des appuis lui permet de ne pas se fatiguer tout en nageant efficacement (plus de 10 longueurs).']]},
     {id:'proj',titre:'Projet de nage',vis:true,auto:true,dom:'D2 : Élaborer un projet individuel',en:'Je suis capable d’élaborer un projet de nage sur 6’ à 25 m près.',niv:[
       ['Projet incohérent','Trop dur ou trop facile, 3 longueurs d\'écart.'],
       ['Projet inadapté','2 longueurs d\'écart.'],
       ['Projet cohérent','1 longueur d\'écart.'],
       ['Projet précis','Le projet et le nombre de longueurs réalisées sont identiques.']]},
     {id:'regles',titre:'Règles, hygiène et sécurité',vis:true,dom:'D4 : S’approprier des principes de santé et d’hygiène',en:'Je viens avec une tenue adaptée, je respecte les horaires, les règles d’hygiène et de sécurité à la piscine.',niv:[
       ['L\'élève non concerné','Il respecte très peu les règles de fonctionnement, de sécurité et/ou d\'hygiène propre à l\'activité (comportement dans le car, aux vestiaires et sur le bassin, tenue complète, écoute des consignes).'],
       ['L\'élève inconstant','Il respecte peu les règles de fonctionnement, de sécurité et/ou d\'hygiène propre à l\'activité (comportement dans le car, aux vestiaires et sur le bassin, tenue complète, écoute des consignes).'],
       ['L\'élève concerné','Il respecte souvent les règles de fonctionnement, de sécurité et/ou d\'hygiène propre à l\'activité (comportement dans le car, aux vestiaires et sur le bassin, tenue complète, écoute des consignes).'],
       ['L\'élève respectueux','Il respecte toujours les règles de fonctionnement, de sécurité et/ou d\'hygiène propre à l\'activité (comportement dans le car, aux vestiaires et sur le bassin, tenue complète, écoute des consignes).']]}
    ]};
}
function etatInitial(){return {v:1,classes:[],cur:null,cfg:cfgDefaut()};}
function numD(v){if(v==null)return null;var s=String(v).trim().replace(',','.');if(s==='')return null;var n=Number(s);return isFinite(n)?n:null;}
function codeNiv(v){
  var s=String(v==null?'':v).trim().toLowerCase();
  if(s==='')return null;
  if(s==='i'||/^insuff/.test(s)||s==='☹️'||s==='☹')return 0;
  if(s==='f'||/^fragile/.test(s)||s==='😐')return 1;
  if(s==='s'||/^satisf/.test(s)||s==='🙂')return 2;
  if(s==='ts'||/^tr[eè]s/.test(s)||s==='😄')return 3;
  if(/^(ne|non [eé]valu)/.test(s))return -1;
  return null;
}
/* 6 min : nombre de longueurs réalisées → niveau 0..3 */
function nivEndu(real,cfg){
  if(real==null)return null;var t=(cfg&&cfg.endu)||cfgDefaut().endu;
  return real>=t[2]?3:real>=t[1]?2:real>=t[0]?1:0;
}
/* projet : écart absolu (en longueurs) → niveau 0..3 */
function nivProjet(ecart,cfg){
  if(ecart==null)return null;var t=(cfg&&cfg.ecart)||cfgDefaut().ecart,a=Math.abs(ecart);
  return a<=t[0]?3:a<=t[1]?2:a<=t[2]?1:0;
}

/* ---------- Lecture .xlsx multi-feuilles (zip + XML, sans bibliothèque) ---------- */
async function lireXlsx(buf){
  var dv=new DataView(buf),u8=new Uint8Array(buf),e=buf.byteLength-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('Fichier .xlsx illisible');
  var n=dv.getUint16(e+10,true),p=dv.getUint32(e+16,true),files={};
  for(var i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    files[name]={method:method,csize:csize,lho:lho};p+=46+nl+el+cl;
  }
  async function get(name){
    var f=files[name];if(!f)return null;
    var lnl=dv.getUint16(f.lho+26,true),lel=dv.getUint16(f.lho+28,true),start=f.lho+30+lnl+lel;
    var data=u8.subarray(start,start+f.csize);
    if(f.method===0)return new TextDecoder().decode(data);
    if(typeof DecompressionStream==='undefined')throw new Error('Ce navigateur ne sait pas ouvrir .xlsx : enregistrez en .csv ou collez le texte.');
    var s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new TextDecoder().decode(await new Response(s).arrayBuffer());
  }
  var xml=function(t){return new DOMParser().parseFromString(t,'application/xml');};
  var shared=[];var ss=await get('xl/sharedStrings.xml');
  if(ss){xml(ss).querySelectorAll('si').forEach(function(si){var t='';si.querySelectorAll('t').forEach(function(x){t+=x.textContent;});shared.push(t);});}
  var sheets=Object.keys(files).filter(function(k){return /^xl\/worksheets\/sheet\d+\.xml$/.test(k);}).sort(function(a,b){return parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]);});
  if(!sheets.length)throw new Error('Aucune feuille trouvée dans le fichier');
  var wbx=await get('xl/workbook.xml'),rel=await get('xl/_rels/workbook.xml.rels'),noms=[];
  if(wbx){var rmap={};if(rel)xml(rel).querySelectorAll('Relationship').forEach(function(r){rmap[r.getAttribute('Id')]='xl/'+String(r.getAttribute('Target')).replace(/^\/?(xl\/)?/,'');});
    xml(wbx).querySelectorAll('sheet').forEach(function(s){var rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');noms.push({nom:s.getAttribute('name'),path:rmap[rid]});});}
  async function lireFeuille(path){var doc=xml(await get(path)),rows=[];
  doc.querySelectorAll('row').forEach(function(rw){
    var r=[];
    rw.querySelectorAll('c').forEach(function(c){
      var ref=c.getAttribute('r')||'',m=ref.match(/^([A-Z]+)/),col=0;
      if(m){for(var k=0;k<m[1].length;k++)col=col*26+(m[1].charCodeAt(k)-64);col--;}else col=r.length;
      var t=c.getAttribute('t'),v=c.querySelector('v'),val='';
      if(t==='s'&&v)val=shared[parseInt(v.textContent)]||'';
      else if(t==='inlineStr'){var is=c.querySelector('is');val=is?is.textContent:'';}
      else if(v)val=v.textContent;
      r[col]=val;
    });
    for(var q=0;q<r.length;q++)if(r[q]===undefined)r[q]='';
    rows.push(r);
  });
  return rows;}
  var out=[];
  if(noms.length&&noms.every(function(n){return n.path&&files[n.path];})){for(var i=0;i<noms.length;i++)out.push({nom:noms[i].nom,rows:await lireFeuille(noms[i].path)});}
  else for(var j=0;j<sheets.length;j++)out.push({nom:'Feuille '+(j+1),rows:await lireFeuille(sheets[j])});
  return out;
}

function dtJour(t){var d=new Date(t),z=function(n){return (n<10?'0':'')+n;};return 'Natation · '+['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][d.getDay()]+' '+z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' à '+z(d.getHours())+'h'+z(d.getMinutes());}
function jourFic(d){var z=function(n){return (n<10?'0':'')+n;};return ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][d.getDay()]+'_'+z(d.getDate())+'-'+z(d.getMonth()+1)+'-'+d.getFullYear();}
function sauvLire(){try{var a=JSON.parse(localStorage.getItem('nat_sauv')||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function sauvFichierOn(){try{return localStorage.getItem('nat_sauv_fichier')!=='0';}catch(e){return true;}}
function sauvTelecharger(o){
  try{var z=function(n){return (n<10?'0':'')+n;},d=new Date(o.t),nm='Natation_sauvegarde_'+jourFic(d)+'_'+z(d.getHours())+'h'+z(d.getMinutes())+'.json';
    var bl=new Blob([JSON.stringify({natation:1,t:o.t,motif:o.motif,etat:o.etat})],{type:'application/json'}),u=URL.createObjectURL(bl),a=document.createElement('a');
    a.href=u;a.download=nm;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u);},1500);}catch(e){}
}
function sauvPartager(o){
  var z=function(n){return (n<10?'0':'')+n;},d=new Date(o.t),nm='Natation_sauvegarde_'+jourFic(d)+'_'+z(d.getHours())+'h'+z(d.getMinutes())+'.json',
    bl=new Blob([JSON.stringify({natation:1,t:o.t,motif:o.motif,etat:o.etat})],{type:'application/json'});
  try{var f=new File([bl],nm,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:nm}).catch(function(err){if(err&&err.name==='AbortError')return;toast('Le partage a été refusé par ce navigateur : le fichier est téléchargé à la place.');sauvTelecharger(o);});return;}}catch(e){}
  sauvTelecharger(o);toast('Partage indisponible sur ce navigateur : le fichier a été téléchargé.');
}
function sauvPartagerMaintenant(i){
  var a=sauvLire(),o=(i==null||i==='')?null:a[+i];
  if(!o){if(!sauvegarderAuto('Partage de la sauvegarde',true)&&false)return;a=sauvLire();o=a[a.length-1];}
  if(o)sauvPartager(o);
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
function sauvegarderAuto(motif,sansFichier){
  var o={t:Date.now(),motif:motif,etat:JSON.parse(JSON.stringify(S))},a=sauvLire();a.push(o);a=a.slice(-6);
  var ok=false;while(a.length){try{localStorage.setItem('nat_sauv',JSON.stringify(a));ok=true;break;}catch(e){a.shift();}}
  if(!sansFichier&&sauvFichierOn())sauvTelecharger(o);
  if(!ok)toast('Sauvegarde interne impossible (mémoire pleine) : utilisez le fichier téléchargé.');
}

function importerRows(F,versClasse){
  F=F.filter(function(f){return f.data.length;});
  if(!F.length){toast('Aucune colonne reconnue (Nom, Projet, Longueurs…).');return;}
  var corps='<p>Feuilles trouvées :</p>'+F.map(function(f,i){return '<label style="display:block;margin:4px 0"><input type="'+(versClasse?'radio':'checkbox')+'" name="fs" value="'+i+'"'+(versClasse?(i===0?' checked':''):' checked')+'> <b>'+esc(f.nom)+'</b> <small>('+f.data.length+' élèves)</small></label>';}).join('')
    +(versClasse?'<p class="note">Appliqué à la classe ouverte (élèves reconnus par leur nom, les autres sont ajoutés).</p>':'<p class="note">Une classe est créée par feuille cochée.</p>');
  dialogue('Importer',corps,[{label:'Annuler',val:false},{label:'Importer',val:true,cls:'primaire'}]).then(function(r){
    if(r.val!==true)return;
    var ch=[].slice.call(r.root.querySelectorAll('input[name=fs]:checked')).map(function(x){return F[+x.value];});
    if(!ch.length)return;
    if(versClasse){var a=appliquerFeuille(cl(),ch[0].data);sauver();render();toast(a.n+' élèves mis à jour'+(a.nv?' dont '+a.nv+' ajouté'+(a.nv>1?'s':''):'')+'.');return;}
    ch.forEach(function(f){var c={id:uid('c'),nom:f.nom,date:Date.now(),evalDate:Date.now(),eleves:[],notes:{}};appliquerFeuille(c,f.data);S.classes.push(c);S.cur=c.id;});
    sauver();vue='saisie';render();toast(ch.length+' classe'+(ch.length>1?'s':'')+' importée'+(ch.length>1?'s':'')+'.');
  });
}
function collage(versClasse){
  dialogue('Coller depuis Excel','<p class="muted">Collez un tableau avec une ligne d\'en-têtes (Nom, Prénom, et si vous les avez Projet, Longueurs, Technique, Règles) puis les élèves.</p>'+(versClasse?'':'<div class="champ"><label>Nom de la classe</label><input type="text" id="colNom" placeholder="6B 2026"></div>')+'<textarea id="colTx" style="width:100%;height:200px"></textarea>',[{label:'Annuler',val:false},{label:'Lire',val:true,cls:'primaire'}]).then(function(r){
    if(r.val!==true)return;var rows=lireTexte($('#colTx',r.root).value),d=lireFeuilleEval(rows);
    if(!d.length&&rows.length){var hd=/^(nom|eleve|élève|identit)/i.test(rows[0][0]||'');d=rows.slice(hd?1:0).filter(function(x){return (x[0]||'').trim();}).map(function(x){return {nom:(x[0]+(x[1]&&!/^\d/.test(x[1])?' '+x[1]:'')).trim(),note:{}};});}
    var nm=!versClasse&&$('#colNom',r.root)?$('#colNom',r.root).value.trim():'';
    importerRows([{nom:nm||(versClasse?'Collage':'Classe collée'),data:d}],versClasse);});
}
function importerXlsx(file,versClasse){
  file.arrayBuffer().then(lireXlsx).then(function(feuilles){
    importerRows(feuilles.map(function(f){return {nom:f.nom,data:lireFeuilleEval(f.rows)};}),versClasse);
  }).catch(function(e){toast(e&&e.message?e.message:'Fichier illisible.');});
}
/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,c=cl();
  if(a==='vue'){vue=b.dataset.v;render();}
  else if(a==='ouvrir'){S.cur=b.dataset.id;sauver();vue='saisie';render();}
  else if(a==='collage')collage(false);
  else if(a==='collageCl')collage(true);
  else if(a==='sn'&&c){var tr=b.closest('tr[data-id]'),pe=c.eleves.find(function(x){return x.id===tr.dataset.id;}),nt=c.notes[pe.id]=c.notes[pe.id]||{},i=+b.dataset.i;if(nt.snLock){toast('Test verrouillé : touchez 🔓 pour le modifier.');return;}nt.sn=Array.isArray(nt.sn)?nt.sn.slice():new Array(SN_N).fill(null);var v=nt.sn[i];nt.sn[i]=v==null?1:v===1?0:null;var nb=document.createElement('div');nb.innerHTML=snBtn(nt.sn[i],i,false);b.replaceWith(nb.firstChild);sauver();majLigne(tr,c,pe);}
  else if(a==='snLock'&&c){var tr2=b.closest('tr[data-id]'),pe2=c.eleves.find(function(x){return x.id===tr2.dataset.id;}),n2=c.notes[pe2.id]=c.notes[pe2.id]||{};
    if(n2.snLock){confirmer('Déverrouiller le test ?','Le test de '+esc(pe2.nom)+' redevient modifiable ; il sera horodaté de nouveau au prochain verrouillage.','Déverrouiller',true).then(function(ok){if(ok){delete n2.snLock;sauver();rafLigne(tr2,c,pe2);}});return;}
    if(!n2.snVal){toast('Choisissez d\'abord Validé ou Non validé.');return;}
    n2.snLock=Date.now();sauver();rafLigne(tr2,c,pe2);toast('Test verrouillé le '+dtCourt(n2.snLock)+'.');}
  else if(a==='snLockAll'&&c){var nl=0,t0=Date.now();c.eleves.forEach(function(x){var n3=c.notes[x.id];if(n3&&!n3.st&&n3.snVal&&!n3.snLock){n3.snLock=t0;nl++;}});sauver();render();toast(nl?nl+' test'+(nl>1?'s':'')+' verrouillé'+(nl>1?'s':'')+' (horodatage '+dtCourt(t0)+').':'Aucun test à verrouiller (choisissez Validé / Non validé).');}
  else if(a==='snUnlockAll'&&c){dialogue('Tout déverrouiller','<p>Saisissez le code professeur pour rendre tous les tests de cette classe modifiables.</p><div class="champ"><input type="password" id="codeU" inputmode="numeric" autocomplete="off" placeholder="Code"></div>',[{label:'Annuler',val:false},{label:'Déverrouiller',val:true,cls:'primaire'}]).then(function(r){if(r.val!==true)return;if($('#codeU',r.root).value.trim()!=='3535'){toast('Code incorrect.');return;}var nu=0;c.eleves.forEach(function(x){var n=c.notes[x.id];if(n&&n.snLock){delete n.snLock;nu++;}});sauver();render();toast(nu?nu+' test'+(nu>1?'s':'')+' déverrouillé'+(nu>1?'s':'')+'.':'Aucun test verrouillé.');});}
  else if(a==='imprCartes'&&c)imprimerCartes(c,null,b.dataset.v==='1');
  else if(a==='imprCarte'&&c)imprimerCartes(c,[b.dataset.id],false);
  else if(a==='logoDel'){S.cfg.logo='';sauver();render();}
  else if(a==='nouvelleClasse'){dialogue('Nouvelle classe','<div class="champ"><label>Nom de la classe</label><input type="text" id="nc" placeholder="6B 2026"></div>',[{label:'Annuler',val:false},{label:'Créer',val:true,cls:'primaire'}]).then(function(r){if(r.val!==true)return;var nm=($('#nc',r.root).value||'').trim()||'Nouvelle classe';var k={id:uid('c'),nom:nm,date:Date.now(),evalDate:Date.now(),eleves:[],notes:{}};S.classes.push(k);S.cur=k.id;sauver();render();});}
  else if(a==='renomme'){var k=S.classes.find(function(x){return x.id===b.dataset.id;});if(!k)return;dialogue('Renommer la classe','<div class="champ"><input type="text" id="nc" value="'+esc(k.nom)+'"></div>',[{label:'Annuler',val:false},{label:'Enregistrer',val:true,cls:'primaire'}]).then(function(r){if(r.val===true){k.nom=($('#nc',r.root).value||'').trim()||k.nom;sauver();render();}});}
  else if(a==='suppr'){var k2=S.classes.find(function(x){return x.id===b.dataset.id;});if(k2)confirmer('Supprimer « '+esc(k2.nom)+' » ?','La classe et toutes ses évaluations seront supprimées.','Supprimer',true).then(function(ok){if(ok){S.classes=S.classes.filter(function(x){return x!==k2;});if(S.cur===k2.id)S.cur=S.classes.length?S.classes[0].id:null;sauver();render();}});}
  else if(a==='ajoutDlg'&&c)ajouterEleve(c);
  else if(a==='ajoutEleve'&&c){var nm=($('#addNom').value||'').trim();if(!nm){toast('Saisissez un nom.');return;}c.eleves.push({id:uid('e'),nom:nm});sauver();render();toast('Élève ajouté.');}
  else if(a==='imprTous'&&c)imprimer(c,null);
  else if(a==='imprUn'&&c)imprimer(c,[b.dataset.id]);
  else if(a==='copierTsv'&&c){var tx=tsvBilan(c,S.cfg);(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(tx):Promise.reject()).then(function(){toast('Bilan copié : collez-le dans un tableur.');}).catch(function(){dialogue('Bilan à copier','<textarea style="width:100%;height:240px" readonly>'+esc(tx)+'</textarea>',[{label:'Fermer',val:true,cls:'primaire'}]);});}
  else if(a==='razTextes'){confirmer('Remettre les textes et barèmes d\'origine ?','Vos modifications de textes, smileys et seuils seront perdues.','Remettre',true).then(function(ok){if(ok){var ks={prof:S.cfg.prof,etab:S.cfg.etab,logo:S.cfg.logo};S.cfg=Object.assign(cfgDefaut(),ks);sauver();render();}});}
  else if(a==='sauvCoupons'){sauvegarderAuto('Sauvegarde des coupons · '+(c?c.nom:''));if(!sauvFichierOn()){var l=sauvLire();if(l.length)sauvTelecharger(l[l.length-1]);}toast('Sauvegarde faite (copie dans la tablette + fichier téléchargé).');}
  else if(a==='sauvMaint'){sauvegarderAuto('Sauvegarde manuelle');toast('Sauvegarde faite.');render();}
  else if(a==='sauvShare'){sauvPartagerMaintenant(b.dataset.i);}
  else if(a==='sauvDl'){var so=sauvLire()[+b.dataset.i];if(so)sauvTelecharger(so);}
  else if(a==='sauvRest'){var sr=sauvLire()[+b.dataset.i];if(sr)restaurer(sr.etat,dtJour(sr.t)+' · '+(sr.motif||''));}
});
function restaurer(etat,lib){
  confirmer('Restaurer cette sauvegarde ?','Tout l\'état actuel sera <b>remplacé</b> par « '+esc(lib)+' ». Une sauvegarde de l\'état actuel est faite avant.','Restaurer',true).then(function(ok){
    if(!ok)return;sauvegarderAuto('Avant restauration');
    if(!etat||!Array.isArray(etat.classes)){toast('Sauvegarde invalide.');return;}
    S=etat;S.cfg=Object.assign(cfgDefaut(),S.cfg||{});sauver();render();toast('Sauvegarde restaurée.');});
}
document.addEventListener('change',function(e){
  var el=e.target,c=cl();
  if(el.id==='fxlsx'){if(el.files[0])importerXlsx(el.files[0],false);el.value='';return;}
  if(el.id==='fxlsxCl'){if(el.files[0])importerXlsx(el.files[0],true);el.value='';return;}
  if(el.id==='triSel'){S.tri=el.value;sauver();render();return;}
  if(el.id==='fmtImpr'){fmtImpr=el.value;return;}
  if(el.id==='sauvFic'){var fs=el.files&&el.files[0];if(!fs)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);restaurer(d.etat||d,fs.name);}catch(x){toast('Fichier de sauvegarde illisible.');}};rd.readAsText(fs);el.value='';return;}
  if(el.dataset.sauvopt){try{localStorage.setItem('nat_sauv_fichier',el.checked?'1':'0');}catch(x){}return;}
  if(el.dataset.f==='evalDate'&&c){var t=new Date(el.value+'T12:00:00').getTime();if(t>0){c.evalDate=t;sauver();}return;}
  var tr=el.closest&&el.closest('tr[data-id]');
  if(tr&&c&&el.dataset.f){
    var pe=c.eleves.find(function(x){return x.id===tr.dataset.id;});if(!pe)return;var nt=c.notes[pe.id]=c.notes[pe.id]||{},f=el.dataset.f,v=el.value;
    if(f==='snval'){if(nt.snLock)return;if(v)nt.snVal=v;else delete nt.snVal;if(v==='oui')nt.sn=new Array(SN_N).fill(1);sauver();var te=document.createElement('tbody');te.innerHTML=ligneSaisie(c,pe);tr.replaceWith(te.firstChild);return;}
    if(f==='groupe'){var gq=numD(v);pe.groupe=gq>0?Math.round(gq):null;el.value=pe.groupe||'';sauver();return;}
    if(f==='naiss'){pe.naiss=normDate(v);el.value=pe.naiss;sauver();return;}
    if(f==='st'){if(v)nt.st=v;else delete nt.st;}
    else if(f==='com'){nt.com=v;}
    else if(f==='proj'||f==='real'){var q=numD(v);nt[f]=q;}
    else{nt[f]=v===''?null:Number(v);el.className='sn'+(v===''?'':v);}
    sauver();majLigne(tr,c,pe);return;
  }
  if(el.dataset.imprcom){S.cfg.imprCom=el.checked;sauver();return;}
  if(el.dataset.vis){var k=S.cfg.comp.find(function(x){return x.id===el.dataset.vis;});if(k){k.vis=el.checked;sauver();}return;}
  if(el.dataset.endu!==undefined){var n1=numD(el.value);if(n1!=null){S.cfg.endu[+el.dataset.endu]=Math.max(0,Math.round(n1));S.cfg.endu.sort(function(x,y){return x-y;});sauver();render();}return;}
  if(el.dataset.ecart!==undefined){var n2=numD(el.value);if(n2!=null){S.cfg.ecart[+el.dataset.ecart]=Math.max(0,Math.round(n2));S.cfg.ecart.sort(function(x,y){return x-y;});sauver();render();}return;}
  if(el.dataset.cfgt){S.cfg[el.dataset.cfgt]=el.value.trim();sauver();return;}
  if(el.id==='logoFic'){var lf=el.files&&el.files[0];if(!lf)return;var rd2=new FileReader();rd2.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,300/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.cfg.logo=cv.toDataURL('image/png');sauver();render();toast('Logo enregistré.');};im.onerror=function(){toast('Image illisible.');};im.src=rd2.result;};rd2.readAsDataURL(lf);el.value='';return;}
  if(el.dataset.snvis){S.cfg.snVis=el.checked;sauver();return;}
  if(el.dataset.titre){S.cfg.titre=el.value.trim()||'NATATION';sauver();return;}
  if(el.dataset.sm!==undefined){S.cfg.sm[+el.dataset.sm]=el.value.trim()||S.cfg.sm[+el.dataset.sm];sauver();return;}
  if(el.dataset.nn!==undefined){S.cfg.niv[+el.dataset.nn]=el.value.trim()||S.cfg.niv[+el.dataset.nn];sauver();return;}
  if(el.dataset.ct!==undefined){S.cfg.comp[+el.dataset.ct][el.dataset.k]=el.value;sauver();return;}
  if(el.dataset.cn!==undefined){S.cfg.comp[+el.dataset.cn].niv[+el.dataset.i][+el.dataset.k]=el.value;sauver();return;}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='addNom'){var b=$('[data-act=ajoutEleve]');if(b)b.click();}});
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){vue=b.dataset.v;render();});});
charger();if(!cl()&&S.classes.length)S.cur=S.classes[0].id;
PARAM.rerender=render;
render();
})();
</script>
