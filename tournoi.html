<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Tournoi de raquette</title>
<link rel="icon" type="image/png" sizes="192x192" href="icones/tournoi_192.png">
<link rel="apple-touch-icon" href="icones/tournoi_180.png">
<link rel="manifest" href="manifests/tournoi.webmanifest">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tournoi">
<meta name="robots" content="noindex,nofollow">

<style>
:root{--bg:#f3f5f8;--carte:#fff;--encre:#14213d;--muted:#5b6b80;--accent:#c0362c;--accent2:#1f6f8b;--ok:#2e8b57;--bord:#d9dee4;--tint:#eef1f4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--encre)}
button,input,select,textarea{font:inherit;color:inherit}
header#top{position:sticky;top:0;z-index:20;background:var(--encre);color:#fff;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 16px}
.titre-zone{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font:700 22px/1.2 Cambria,Georgia,serif;margin:0}
#selPoule{font-size:17px;padding:8px 10px;border-radius:8px;border:0;background:#fff;color:var(--encre);min-height:42px}
.droite-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#sync{font:inherit;font-size:13px;padding:4px 12px;min-height:34px;border:0;color:#fff;cursor:pointer;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
#sync.ok::before{content:"● ";color:#6ee7a0}#sync.ko::before{content:"● ";color:#ff8a80}#sync.loc::before{content:"● ";color:#ffd27a}
nav button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;min-height:42px}
nav button.on{background:#fff;color:var(--encre);border-color:#fff;font-weight:600}
#bandeau{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:#e6ebf1;border-bottom:1px solid var(--bord)}
#bandeau:empty{display:none}
.chip-p{border:1px solid var(--bord);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip-p.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.chip-p b{font-size:15px}
.badge-util{display:inline-block;background:#e3f5ea;color:#1b6e3b;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;margin:0 0 8px}
.bilan3{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start;margin-top:16px}
.mvt.up{color:#1b8a4b;font-weight:700}.mvt.down{color:#c0362c;font-weight:700}
.podgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pod{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:12px 14px;border-top:5px solid var(--accent2)}
.pod:nth-child(3n+2){border-top-color:var(--accent)}.pod:nth-child(3n){border-top-color:#e0a21e}
.podt{display:flex;gap:10px;align-items:center}.podi{font-size:34px}
.podt h3{margin:0;font:700 19px Cambria,Georgia,serif}.podt small{color:var(--muted);display:block;line-height:1.25}
.podl{list-style:none;margin:10px 0 0;padding:0}.podl li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--tint);margin-bottom:5px}
.podl li.r0{background:linear-gradient(90deg,#fff3c4,#ffe9a0);color:#4a3600}.podl li .m{font-size:22px}.podl li .v{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.podl li.r0 .v{color:#6b5200}
.hero .chip-p{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.5)}.hero .chip-p.on{background:#fff;color:var(--accent2);border-color:#fff;font-weight:700}
.chip-p.plus{background:var(--accent2);color:#fff;border-color:var(--accent2);font-weight:700;padding:6px 12px}
.phases{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.modal.grand{max-width:760px}
.eqzone{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
@media(max-width:640px){.eqzone{grid-template-columns:1fr}}
.eqzone h4{margin:0 0 6px;font-size:14px;color:var(--muted)}
.eqdispo,.eqcarte{border:2px dashed var(--bord);border-radius:12px;padding:8px;min-height:64px;margin-bottom:8px}
.eqdispo.sur,.eqcarte.sur{border-color:var(--accent2);background:#eef7fa}
.eqtit{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.eqj{display:inline-block;background:#fff;border:1px solid var(--bord);border-radius:99px;padding:8px 14px;margin:3px;font-weight:600;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.eqj.sel{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.eqghost{position:fixed;z-index:400;pointer-events:none;opacity:.92;box-shadow:0 6px 16px rgba(0,0,0,.3);margin:0}
.total{margin-left:auto;font-weight:600;background:var(--encre);color:#fff;padding:6px 14px;border-radius:99px;font-size:14px}
main{padding:16px;max-width:1400px;margin:0 auto}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media(max-width:820px){.duo{grid-template-columns:1fr}}
@media(max-width:820px) and (orientation:portrait){
  .duo>section:nth-child(2){order:-1;max-height:46vh;overflow:auto;padding-top:0}
  .duo>section:nth-child(2) .ent{position:sticky;top:0;background:var(--carte,#fff);z-index:2;padding-top:12px}
  .duo>section:nth-child(2) .clt thead th{position:sticky;top:46px;background:#fff;z-index:1}
  .duo>section:nth-child(2) .note{display:none}
}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.carte h2{margin:0 0 4px;font:700 19px/1.2 Cambria,Georgia,serif}
.carte h3{margin:14px 0 6px;font-size:16px}
.carte small,.muted{color:var(--muted)}
.ent{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.outils{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;margin-bottom:8px}
.outils input[type=search]{padding:8px 10px;border:1px solid var(--bord);border-radius:8px;min-width:160px}
.liste{max-height:calc(100vh - 270px);min-height:260px;overflow:auto;padding-right:4px}
.ronde{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent2);margin:12px 0 4px}
.match{display:flex;align-items:center;gap:10px;padding:10px 10px;border:1px solid var(--bord);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff;min-height:48px}
.match:active{background:var(--tint)}
.match .num{width:30px;text-align:right;color:var(--muted);font-size:13px;flex:none}
.match .vs{flex:1;min-width:0}
.match .vs i{color:var(--muted);font-style:normal;margin:0 6px;font-size:13px}
.match .gagne{color:var(--accent)}
.match .res{flex:none;font-size:14px;text-align:right;color:var(--muted)}
.match .res b{display:block;color:var(--encre);font-size:16px}
.match:not(.fini) .res{color:#fff;background:var(--accent2);padding:6px 12px;border-radius:8px;font-weight:600}
.match.fini{background:#f7f8fa}
.clt{width:100%;border-collapse:collapse;font-size:15px}
.clt th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:center;padding:6px 4px;border-bottom:2px solid var(--bord);vertical-align:bottom}
.clt td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--tint)}
.clt .nom{text-align:left;font-weight:600}
.clt td.rang{color:var(--muted);width:30px}
.clt td.pts{font-size:18px;font-weight:700;color:var(--accent)}
.clt small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.clt tr.retire td{color:#98a3b3;font-style:italic}
.clt tr:nth-child(1) td.rang{color:#b8860b;font-weight:700}
.diffp{color:var(--ok)}.diffn{color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.attente{text-align:center;padding:40px 20px}
.btn{border:1px solid var(--bord);background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:42px}
.btn:hover{background:var(--tint)}
.btn.primaire{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
.btn.danger{background:#fff;border-color:var(--accent);color:var(--accent)}
.btn.danger.plein{background:var(--accent);color:#fff}
.btn.petit{padding:5px 10px;min-height:34px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sous{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.sous button{padding:10px 16px;border-radius:99px;border:1px solid var(--bord);background:#fff;cursor:pointer;min-height:42px}
.sous button.on{background:var(--encre);color:#fff;border-color:var(--encre)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.champ label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.champ input,.champ select,textarea,.tj input,.tj select,.add input{padding:9px 10px;border:1px solid var(--bord);border-radius:8px;width:100%;background:#fff;min-height:42px}
.champ .aide{font-size:12px;color:var(--muted);margin-top:3px}
.champ.coche label{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--encre);min-height:42px}
.champ.coche input{width:22px;height:22px;min-height:0}
.lignebtn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.add{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:end;max-width:560px}
.tj{width:100%;border-collapse:collapse}
.tj td,.tj th{padding:4px;border-bottom:1px solid var(--tint);text-align:left;font-size:14px}
.tj th{font-size:12px;color:var(--muted);text-transform:uppercase}
.tj td.n{width:36px;color:var(--muted)}
.tj .nv{width:80px}.tj .pl{width:130px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.zone{background:#fff;border:2px dashed var(--bord);border-radius:12px;padding:8px;min-height:120px}
.zone.survol{border-color:var(--accent2);background:#eaf5f9}
.zone.nonaff{background:#fff7e6;border-color:#f0c77a}
.zone .zt{display:flex;justify-content:space-between;gap:6px;font-weight:700;margin:2px 4px 8px;font-size:15px}
.zone .zt small{font-weight:400}
.zone.trop .zt{color:var(--accent)}
.chip{display:flex;align-items:center;gap:6px;background:var(--tint);border:1px solid var(--bord);border-radius:8px;margin-bottom:5px;font-size:14px;min-height:40px;padding-right:8px;user-select:none;-webkit-user-select:none}
.chip .grip{width:38px;align-self:stretch;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:grab;touch-action:none;font-size:18px}
.chip .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--muted)}
.chip .prev{font-weight:700;white-space:nowrap}.chip .prev.up{color:var(--ok)}.chip .prev.down{color:var(--accent)}.chip .prev.stay{color:var(--muted)}
.chip.leve{opacity:.35}
.chip.fixe{padding-left:10px}
.fantome{position:fixed;z-index:200;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);background:#fff;opacity:.95}
.voile{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:#fff;border-radius:14px;padding:18px 20px;max-width:520px;width:100%;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch}
@media(max-height:560px){.voile{align-items:flex-start;padding:6px}.modal{max-height:100%;padding:10px 14px}.modal h3{font-size:17px;margin:0 0 4px}.setrow{margin:3px 0}.setrow input{padding:6px;font-size:20px}.noms{margin-bottom:4px;font-size:15px}.modal .regle{display:none}.modal .boutons{position:sticky;bottom:0;background:#fff;padding-top:6px;margin-top:6px}}
.modal h3{margin:0 0 10px;font:700 20px Cambria,Georgia,serif}
.modal .boutons{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.modal input[type=password],.modal input[type=text]{width:100%;padding:12px;border:1px solid var(--bord);border-radius:8px;font-size:20px;letter-spacing:.2em}
.err{color:var(--accent);font-size:14px;min-height:20px;margin:6px 0 0}
.noms{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:17px}
.noms span{color:var(--muted);font-size:13px}
.setrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.setrow span{width:56px;color:var(--muted)}
.setrow input{width:84px;text-align:center;font-size:24px;padding:10px;border:1px solid var(--bord);border-radius:8px}
.regle{font-size:13px;color:var(--muted);margin:10px 0 0}
.radio{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.radio input{margin-top:5px;width:20px;height:20px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--encre);color:#fff;padding:10px 18px;border-radius:10px;z-index:300;max-width:90vw;display:none}
.bandeau-local{background:#fff3cd;color:#664d03;padding:8px 16px;font-size:14px;border-bottom:1px solid #ffe69c}
details{border:1px solid var(--bord);border-radius:10px;padding:6px 10px;margin:8px 0;background:#fff}
summary{cursor:pointer;font-weight:600;min-height:34px;display:flex;align-items:center}
.pj{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--tint)}
.pj .nm{flex:1}.pj .st{color:var(--muted);font-size:13px}
.pj.ret .nm{color:#98a3b3;text-decoration:line-through}
table.mini{border-collapse:collapse;width:100%}
table.mini td,table.mini th{padding:6px 6px;border-bottom:1px solid var(--tint);text-align:left;font-size:14px}
table.mini input{width:70px;padding:7px;border:1px solid var(--bord);border-radius:8px;text-align:center;min-height:38px}
.warn{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 12px;font-size:14px;margin:8px 0}
.choix .grille{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.gros{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:left;background:#fff;border:1px solid var(--bord);border-radius:12px;padding:16px;font:inherit;color:inherit;min-height:160px}
button.gros{cursor:pointer}button.gros:hover{background:var(--tint)}
.gros b{font-size:18px}.gros span{color:var(--muted);font-size:14px}
.code-in{font:700 26px/1.2 system-ui,sans-serif;letter-spacing:.35em;text-align:center;text-transform:uppercase;padding:10px;border:1px solid var(--bord);border-radius:8px;width:100%}
.code-grand{font:700 60px/1.1 Cambria,Georgia,serif;letter-spacing:.2em;text-align:center;color:var(--accent);margin:8px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--tint);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:700 28px/1.1 Cambria,Georgia,serif;color:var(--encre)}
.kpi span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.forme{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.forme i{font-style:normal;font-weight:700;font-size:13px;width:24px;height:24px;line-height:24px;text-align:center;border-radius:6px;color:#fff}
.forme i.V{background:var(--ok)}.forme i.D{background:var(--accent)}
.zonechip{display:inline-block;padding:5px 12px;border-radius:99px;font-weight:700;font-size:14px;background:var(--tint)}
.zonechip.up{background:#d8f0e1;color:#1b6b3a}.zonechip.down{background:#f9dcd8;color:#a02a20}
.courbe{width:100%;height:auto;display:block}
.statliste{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip-nom{padding:10px 14px;border-radius:99px;border:1px solid var(--bord);background:#fff;cursor:pointer;font:inherit;min-height:44px}
.chip-nom:hover{background:var(--tint)}
input.grand{width:100%;padding:12px;border:1px solid var(--bord);border-radius:8px;font-size:20px}
.statgrand{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.statgrand h2{margin:0}
.tourn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 0;border-top:1px solid var(--tint)}
.tourn:first-of-type{border-top:0}
.tourn .inf{flex:1;min-width:200px}.tourn .inf b{font-size:17px}.tourn .inf div{color:var(--muted);font-size:14px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--accent2);color:#fff;margin-left:6px;vertical-align:middle}
.badge.gris{background:var(--tint);color:var(--muted)}
.deux{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.modal select{width:100%;padding:12px;border:1px solid var(--bord);border-radius:8px;font-size:17px}
.badge-svg{display:block;flex:none}
.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes briller{0%,100%{filter:drop-shadow(0 0 0 rgba(255,200,0,0))}50%{filter:drop-shadow(0 0 10px rgba(255,200,0,.9))}}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:18px;background:linear-gradient(135deg,#14213d,#1f6f8b);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:16px}
.hero .txt{flex:1;min-width:220px}.hero h2{color:#fff;margin:0 0 4px;font:700 26px Cambria,Georgia,serif}.hero p{margin:4px 0;opacity:.92}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center}
.sous button.grise{opacity:.5;background:var(--tint);cursor:not-allowed}
.hero .btn{background:#fff;color:var(--encre);border-color:#fff}
.hero .badge-svg{animation:briller 3s infinite}
.barre{height:16px;border-radius:99px;background:rgba(120,135,155,.25);position:relative;overflow:hidden;margin:6px 0}
.barre>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#2e8b57,#8bd450);transition:width .6s}
.barre.fin{height:22px;background:rgba(255,255,255,.2)}
.barre-lib{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.hero .barre-lib{color:rgba(255,255,255,.85)}
.rec{display:flex;flex-direction:column;gap:8px}
.rec .tete{display:flex;gap:12px;align-items:center}.rec .tete b{font-size:18px}.rec .tete small{display:block;color:var(--muted)}
.rec .saisie{display:grid;grid-template-columns:130px 1fr;gap:8px;margin-top:4px}
.rec .saisie select{padding:12px;border:1px solid var(--bord);border-radius:8px;font-size:18px;min-width:0;background:#fff}
.rec .saisie input{padding:12px;border:1px solid var(--bord);border-radius:8px;font-size:18px;min-width:0}
.rec .saisie input[type=number]{text-align:center;font-weight:700;font-size:22px}
.rec .btn{width:100%}
.palmini{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.palmini div{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);width:78px;text-align:center}
.palmini div.vide{opacity:.4}.palmini div b{color:var(--encre);font-size:13px}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;margin:6px 0}.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.marq{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--encre);border-radius:2px}
#verrou{position:fixed;inset:0;z-index:1000;background:#14213d;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
#verrou .boite{max-width:460px;width:100%;text-align:center}
#verrou h2{font:700 28px Cambria,Georgia,serif;margin:0 0 8px;color:#fff}
#verrou p{margin:6px 0;opacity:.9}
#verrou input{width:100%;padding:12px;border-radius:8px;border:1px solid #fff4;background:#fff;font-size:22px;text-align:center;letter-spacing:.3em;margin:6px 0}
#verrou .btn{width:100%;margin:6px 0;justify-content:center;display:flex;background:transparent;color:#fff;border:1px solid #fff6}
#verrou .btn.primaire{background:var(--accent2);border-color:var(--accent2)}
#verrou hr{border:0;border-top:1px solid #fff3;margin:16px 0}
#verrou .err{color:#ffb4ab;min-height:20px}
.pa-hid{display:none!important}
.pa-seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pa-seg button{border:1px solid var(--bord);background:var(--carte);color:var(--encre);border-radius:99px;padding:7px 13px;min-height:38px;cursor:pointer;font:inherit;font-size:15px}
.pa-seg button.on{background:var(--accent2);color:#fff;border-color:var(--accent2);font-weight:600}
.pa-seg button:disabled{opacity:.55;cursor:default}
td>.pa-seg{min-width:150px}
.pa-t{margin:16px 0 6px;font-size:15px;color:var(--muted);font-weight:600}
.pa-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pa-opt{border:2px solid var(--bord);background:var(--carte);color:var(--encre);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font:inherit}
.pa-opt.on{border-color:var(--accent2);background:var(--accent2);color:#fff;font-weight:600}
.pa-themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pa-th{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:2px solid var(--bord);background:var(--carte);color:var(--encre);border-radius:12px;padding:8px;cursor:pointer;font:inherit}
.pa-th.on{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2)}
.pa-sw{display:flex;gap:0;width:100%;height:30px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,0,0,.15)}
.pa-sw i{flex:1}
</style>
</head>
<body>
<header id="top">
  <div class="titre-zone"><h1 id="titre">Tournoi</h1><select id="selPoule" aria-label="Choisir la poule"></select></div>
  <div class="droite-top"><button id="sync" class="loc" type="button" data-act="connexion"></button><button id="fs" type="button" data-act="plein" class="loc" style="min-width:44px;font-size:18px"></button>
    <nav><button data-act="onglet" data-v="tournoi">🏸 Tournoi</button><button data-act="onglet" data-v="progres">🏆 Progressions</button><button data-act="onglet" data-v="podium">🏅 Podium</button><button data-act="onglet" data-v="stats">📊 Statistiques</button><button data-act="onglet" data-v="prof">🔒 Espace professeur</button></nav></div>
</header>
<div id="bandeau"></div>
<div id="avis"></div>
<main id="app"></main>
<div id="toast"></div>

  S.joueurs.filter(function(j){return j.poule===poule;}).forEach(function(j){st[j.id]={id:j.id,nom:j.nom,retire:!!j.retire,pts:0,j:0,v:0,d:0,sg:0,sp:0,pm:0,pe:0,h2h:0};});

    ids.forEach(function(u){var A=st[u];if(!A)return;A.j++;A.sg+=pour;A.sp+=contre;A.pm+=(k?q.pa:q.pb);A.pe+=(k?q.pb:q.pa);
      if(gagne){A.v++;A.pts+=R.ptsVictoire;}else{A.d++;A.pts+=R.ptsDefaite;}});
  }
  ph.matchs.filter(function(m){return m.s;}).forEach(function(m){
    var q=scoreSets(m),ua=ph.type==='double'?[m.ea]:m.a,ub=ph.type==='double'?[m.eb]:m.b;
    cote(ua,1,q,q.wa>q.wb,q.wa,q.wb);cote(ub,0,q,q.wb>q.wa,q.wb,q.wa);
  });
  var rows=Object.keys(st).map(function(k){var x=st[k];x.moy=x.j?x.pts/x.j:0;return x;}),tour=ph.type==='tournant';
  rows.sort(function(a,b){return (tour?(b.moy-a.moy):(b.pts-a.pts))||(b.sg-b.sp)-(a.sg-a.sp)||(b.pm-b.pe)-(a.pm-a.pe)||b.pm-a.pm||a.nom.localeCompare(b.nom,'fr');});
  return rows;
}
/* classement servant aux montées/descentes : aller + retours quand TOUS les retours de la poule sont terminés, sinon aller seul */
function classementSimple(S,p){
  var rs=phasesDe(S,p,'retour');
  if(!rs.length||!rs.every(phaseTerminee))return classement(S,p);
  var conv=[];rs.forEach(function(ph){ph.matchs.forEach(function(m){conv.push({p:p,r:m.r,a:m.a[0],b:m.b[0],s:m.s});});});
  return classement({regles:S.regles,joueurs:S.joueurs,matchs:S.matchs.concat(conv)},p);
}
function genererRetour(S,p){
  var J={};S.joueurs.forEach(function(j){J[j.id]=j;});
  return S.matchs.filter(function(m){return m.p===p&&J[m.a]&&J[m.b]&&!J[m.a].retire&&!J[m.b].retire;})
    .sort(function(x,y){return x.r-y.r;}).map(function(m){return {id:uid('m'),r:m.r,a:[m.b],b:[m.a],s:null,u:0};});
}
/* Double tournant : chacun joue avec chacun des autres (une fois) ; 2 contre 1 pour boucler si besoin */
function genererTournant(ids){
  var n=ids.length,pairs=[],i,j;
  for(i=0;i<n;i++)for(j=i+1;j<n;j++)pairs.push([ids[i],ids[j]]);
  var best=null;
  for(var t=0;t<400;t++){
    var arr=melanger(pairs),used={},ms=[],left=[];
    for(var x=0;x<arr.length;x++){
      if(used[x])continue;used[x]=1;var y=-1;
      for(var z=x+1;z<arr.length;z++){if(!used[z]&&arr[z][0]!==arr[x][0]&&arr[z][0]!==arr[x][1]&&arr[z][1]!==arr[x][0]&&arr[z][1]!==arr[x][1]){y=z;break;}}
      if(y<0)left.push(arr[x]);else{used[y]=1;ms.push({a:arr[x],b:arr[y]});}
    }
    if(!best||left.length<best.left.length){best={ms:ms,left:left};if(!left.length)break;}
  }
  var cnt={};ids.forEach(function(k){cnt[k]=0;});
  best.ms.forEach(function(m){m.a.concat(m.b).forEach(function(k){cnt[k]++;});});
  best.left.forEach(function(pr){
    var c=ids.filter(function(k){return pr.indexOf(k)<0;}).sort(function(a,b){return cnt[a]-cnt[b];}),s=c[0];
    cnt[s]++;cnt[pr[0]]++;cnt[pr[1]]++;best.ms.push({a:pr,b:[s]});
  });
  var rondes=[],out=[];
  melanger(best.ms).forEach(function(m){
    var pl=m.a.concat(m.b),r=0;
    while(true){if(!rondes[r])rondes[r]={};if(!pl.some(function(k){return rondes[r][k];}))break;r++;}
    pl.forEach(function(k){rondes[r][k]=1;});out.push({r:r+1,a:m.a,b:m.b});
  });
  out.sort(function(x,y){return x.r-y.r;});
  return out.map(function(x){return {id:uid('m'),r:x.r,a:x.a.slice(),b:x.b.slice(),s:null,u:0};});
}

/* ----- Doubles : classement des joueurs, classement combiné simple + double ----- */
function doublesDe(S,p){return phasesDe(S,p).filter(function(e){return e.type==='tournant'||e.type==='double';});}
function doublesTermines(S,p){var d=doublesDe(S,p);return d.length>0&&d.every(phaseTerminee);}
function doublesEnCours(S){var o={};(S.extras||[]).forEach(function(e){if((e.type==='tournant'||e.type==='double')&&!phaseTerminee(e))o[e.p]=1;});return Object.keys(o).length;}
function statsDouble(S,p){
  var st={},J={},R=S.regles;S.joueurs.forEach(function(j){J[j.id]=j;});
  doublesDe(S,p).forEach(function(ph){ph.matchs.forEach(function(m){
    m.a.concat(m.b).forEach(function(i){if(J[i]&&!st[i])st[i]={id:i,nom:J[i].nom,retire:!!J[i].retire,pts:0,j:0,v:0,d:0,sg:0,sp:0,pm:0,pe:0};});
    if(!m.s)return;
    var q=scoreSets(m);
    [[m.a,q.wa>q.wb,q.wa,q.wb,q.pa,q.pb],[m.b,q.wb>q.wa,q.wb,q.wa,q.pb,q.pa]].forEach(function(c){
      c[0].forEach(function(i){var A=st[i];if(!A)return;A.j++;A.sg+=c[2];A.sp+=c[3];A.pm+=c[4];A.pe+=c[5];if(c[1]){A.v++;A.pts+=R.ptsVictoire;}else{A.d++;A.pts+=R.ptsDefaite;}});
    });
  });});
  return st;
}
function triMoy(rows){
  rows.forEach(function(x){x.moy=x.j?x.pts/x.j:0;});
  rows.sort(function(a,b){return (b.moy-a.moy)||(b.pts-a.pts)||(b.sg-b.sp)-(a.sg-a.sp)||(b.pm-b.pe)-(a.pm-a.pe)||a.nom.localeCompare(b.nom,'fr');});
  return rows;
}
function classementDouble(S,p){var st=statsDouble(S,p);return triMoy(Object.keys(st).map(function(k){return st[k];}).filter(function(x){return x.j>0||!x.retire;}));}
function classementCombine(S,p){
  var sim=classementSimple(S,p),dbl=statsDouble(S,p),rows=[];
  sim.forEach(function(x){var o=Object.assign({},x),y=dbl[x.id];if(y)['pts','j','v','d','sg','sp','pm','pe'].forEach(function(k){o[k]+=y[k];});rows.push(o);});
  return triMoy(rows);
}
/* montées/descentes : simple (+ retours si tous terminés), et simple + double si TOUS les doubles de la poule sont terminés */
function classementMouv(S,p){return doublesTermines(S,p)?classementCombine(S,p):classementSimple(S,p);}

/* Répartition automatique */
function repartir(S,mode){
  var N=S.regles.nbPoules,J=S.joueurs,n=J.length;
  if(!n)return {err:'Aucun joueur à répartir.'};
  if(n>N*30)return {err:'Trop de joueurs pour '+N+' poules de 30 maximum (il en faut au moins '+Math.ceil(n/30)+').'};
  var fort=S.regles.niveauFort==='bas'?-1:1;
  var ordre=melanger(J);
  if(mode!=='alea')ordre.sort(function(a,b){return (b.niveau-a.niveau)*fort;});
  if(mode==='equilibre'){
    ordre.forEach(function(j,i){var row=Math.floor(i/N),col=i%N;j.poule=row%2===0?col+1:N-col;});
  }else{
    var base=Math.floor(n/N),extra=n%N,k=0;
    for(var p=1;p<=N;p++){var size=base+(p<=extra?1:0);for(var c=0;c<size;c++)ordre[k++].poule=p;}
  }
  return {ok:true};
}

/* Montées / descentes */
function promoVal(S,type,k){var v=S.promo&&S.promo[type]&&S.promo[type][k];return (v===undefined||v===null)?2:Number(v);}
function planMouvements(S){
  var N=S.regles.nbPoules,moves=[];
  for(var k=1;k<=N;k++){
    var rk=classementMouv(S,k).filter(function(x){return !x.retire;}).map(function(x){return x.id;});
    var up=k>1?Math.min(promoVal(S,'up',k),rk.length):0;
    var down=k<N?Math.min(promoVal(S,'down',k),rk.length-up):0;
    rk.slice(0,up).forEach(function(id){moves.push({id:id,from:k,to:k-1});});
    if(down>0)rk.slice(rk.length-down).forEach(function(id){moves.push({id:id,from:k,to:k+1});});
  }
  return moves;
}

/* Lecture de tableaux (CSV / Excel / texte collé) */
function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  var first=text.split(/\r?\n/).find(function(l){return l.trim();})||'';
  var cands=['\t',';',','],d=cands[0],best=-1;
  cands.forEach(function(c){var n=first.split(c).length-1;if(n>best){best=n;d=c;}});
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function lignesVersJoueurs(rows){
  rows=rows.filter(function(r){return r.some(function(c){return String(c==null?'':c).trim()!=='';});});
  if(!rows.length)return [];
  var norm=function(s){return String(s==null?'':s).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');};
  var head=rows[0].map(norm);
  var iNom=head.findIndex(function(h){return /^(noms?|names?|joueurs?|joueuses?|eleves?|nom et prenom|nom prenom)$/.test(h);});
  var iPre=head.findIndex(function(h){return /^(prenoms?|first ?names?)$/.test(h);});
  var iNiv=head.findIndex(function(h){return /^(niveaux?|levels?|classements?|notes?)$/.test(h);});
  var iPou=head.findIndex(function(h){return /^(poules?|pools?|groupes?)$/.test(h);});
  var iGen=head.findIndex(function(h){return /^(genres?|sexes?|filles? ?\/ ?garcons?|f ?\/ ?g|g ?\/ ?f)$/.test(h);});
  var data,hasHead=(iNom>=0||iPre>=0||iNiv>=0||iPou>=0||iGen>=0);
  var num=function(x){var n=parseFloat(String(x==null?'':x).replace(',','.'));return isNaN(n)?null:n;};
  if(hasHead){data=rows.slice(1);if(iNom<0)iNom=iPre>=0?iPre:0;}
  else{data=rows;iNom=0;iNiv=(rows[0].length>1&&num(rows[0][1])!==null)?1:-1;iPou=(rows[0].length>2&&num(rows[0][2])!==null)?2:-1;iGen=-1;for(var gi=1;gi<rows[0].length;gi++){if(gi!==iNiv&&gi!==iPou&&normGenre(rows[0][gi])){iGen=gi;break;}}}
  var out=[];
  data.forEach(function(r){
    var nom=String(r[iNom]==null?'':r[iNom]).trim();
    if(iPre>=0&&iPre!==iNom){var p=String(r[iPre]==null?'':r[iPre]).trim();nom=(p+' '+nom).trim();}
    if(!nom)return;
    var niv=iNiv>=0?num(r[iNiv]):null;
    var pou=iPou>=0?num(r[iPou]):null;
    out.push({nom:nom,niveau:niv===null?5:niv,poule:(pou&&pou>=1&&pou<=10)?Math.round(pou):0,genre:iGen>=0?normGenre(r[iGen]):''});
  });
  return out;
}

      out.push({membres:g.sort(function(a,b){return val(b)-val(a);}),moy:g.reduce(function(a,j){return a+val(j);},0)/(g.length||1)});}
    return out.sort(function(a,b){return b.moy-a.moy;});
  }
  var G=[],i,perm=melanger(Array.apply(null,Array(nbG)).map(function(_,x){return x;}));
  for(i=0;i<nbG;i++)G.push([]);
  tri.forEach(function(x,idx){
    var s=Math.floor(idx/nbG),r=idx%nbG,pos=(s%2===0)?r:nbG-1-r;
    G[perm[pos]].push(x.j);
  });
  return G.map(function(g){var m=g.reduce(function(a,j){return a+val(j);},0)/(g.length||1);return {membres:g.sort(function(a,b){return val(b)-val(a);}),moy:m};});
}
/* ----- L'addition des records : un record avec chaque partenaire, les frappes s'additionnent ----- */
function ajouterAddition(Sx,b){
  var j=Sx.joueurs.find(function(x){return x.id===b.j;}),p=Sx.joueurs.find(function(x){return x.id===b.p;});
  if(!j||!p)return 'Joueur introuvable.';
  if(b.j===b.p)return 'Choisissez un autre joueur que vous.';
  var n=b.n;if(typeof n!=='number'||!isFinite(n)||Math.floor(n)!==n||n<0||n>999)return 'Le nombre de frappes doit être un entier entre 0 et 999.';
  var s=Sx.tournoi.seance||1;
  if(Sx.addition.some(function(x){return x.j===b.j&&x.p===b.p&&x.s===s;}))return 'Déjà saisi : seul le professeur peut modifier ce record.';
  Sx.addition.push({id:uid('a'),j:b.j,p:b.p,s:s,n:n,t:Date.now()});return null;
}
function additionDe(Sx,id,s){
  s=s||Sx.tournoi.seance||1;var fait={},liste=[],total=0;
  Sx.addition.forEach(function(x){if(x.j===id&&x.s===s){fait[x.p]=1;total+=x.n;liste.push(x);}});
  var restants=Sx.joueurs.filter(function(x){return x.id!==id&&!x.retire&&!fait[x.id];});
  return {liste:liste,total:total,restants:restants,nbPartenaires:Sx.joueurs.filter(function(x){return x.id!==id&&!x.retire;}).length};
}
function ecartsAddition(Sx,s){ /* paires où les deux ont saisi, mais pas la même valeur ; paires où un seul a saisi */
  s=s||Sx.tournoi.seance||1;var M={},ecarts=[],attente=[];
  Sx.addition.forEach(function(x){if(x.s===s)M[x.j+'>'+x.p]=x;});
  Object.keys(M).forEach(function(k){
    var x=M[k],r=M[x.p+'>'+x.j];
    if(r){if(x.j<x.p&&r.n!==x.n)ecarts.push({a:x.j,b:x.p,na:x.n,nb:r.n,ida:x.id,idb:r.id});}
    else attente.push({de:x.j,vers:x.p,n:x.n,id:x.id});
  });
  return {ecarts:ecarts,attente:attente};
}

<script id="xlsx">
/* Lecture d'un .xlsx sans bibliothèque (zip + XML) */
async function lireXlsx(buf){
  var dv=new DataView(buf),u8=new Uint8Array(buf),e=buf.byteLength-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('Fichier .xlsx illisible');
  var n=dv.getUint16(e+10,true),p=dv.getUint32(e+16,true),files={};
  for(var i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    files[name]={method:method,csize:csize,lho:lho};p+=46+nl+el+cl;
  }
  async function get(name){
    var f=files[name];if(!f)return null;
    var lnl=dv.getUint16(f.lho+26,true),lel=dv.getUint16(f.lho+28,true),start=f.lho+30+lnl+lel;
    var data=u8.subarray(start,start+f.csize);
    if(f.method===0)return new TextDecoder().decode(data);
    if(typeof DecompressionStream==='undefined')throw new Error('Ce navigateur ne sait pas ouvrir .xlsx : enregistrez en .csv ou collez le texte.');
    var s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new TextDecoder().decode(await new Response(s).arrayBuffer());
  }
  var xml=function(t){return new DOMParser().parseFromString(t,'application/xml');};
  var shared=[];var ss=await get('xl/sharedStrings.xml');
  if(ss){xml(ss).querySelectorAll('si').forEach(function(si){var t='';si.querySelectorAll('t').forEach(function(x){t+=x.textContent;});shared.push(t);});}
  var sheets=Object.keys(files).filter(function(k){return /^xl\/worksheets\/sheet\d+\.xml$/.test(k);}).sort(function(a,b){return parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]);});
  if(!sheets.length)throw new Error('Aucune feuille trouvée dans le fichier');
  var doc=xml(await get(sheets[0])),rows=[];
  doc.querySelectorAll('row').forEach(function(rw){
    var r=[];
    rw.querySelectorAll('c').forEach(function(c){
      var ref=c.getAttribute('r')||'',m=ref.match(/^([A-Z]+)/),col=0;
      if(m){for(var k=0;k<m[1].length;k++)col=col*26+(m[1].charCodeAt(k)-64);col--;}else col=r.length;
      var t=c.getAttribute('t'),v=c.querySelector('v'),val='';
      if(t==='s'&&v)val=shared[parseInt(v.textContent)]||'';
      else if(t==='inlineStr'){var is=c.querySelector('is');val=is?is.textContent:'';}
      else if(v)val=v.textContent;
      r[col]=val;
    });
    for(var q=0;q<r.length;q++)if(r[q]===undefined)r[q]='';
    rows.push(r);
  });
  return rows;
}
</script>

  try{if(MODE==='slave'&&S.id===idAv&&S.historique&&S.historique.length>av)sauvegarderAuto('Copie reçue · fin de séance '+S.historique[S.historique.length-1].seance,true);}catch(e){}
}
function rechargerEtat(){

}
function connecter(){
  var es=new EventSource('/events');

    if(d.ver<=ver)return;

    if(m){m.s=d.s;m.u=d.u;}

}
function envoyerEnAttente(){

function mettreEnAttente(x){var q=[];try{q=JSON.parse(localStorage.getItem('tournoi_attente')||'[]');}catch(e){}q.push(x);localStorage.setItem('tournoi_attente',JSON.stringify(q));}

/* ---------- Mode maître / élève : tablettes reliées en direct (WebRTC via PeerJS), sans PC ---------- */
var peer=null,conns=[],lien=null,pending={},accepterProchain=false,lastPong=0,verrou=null,echecsP={};
var minuteurs={retry:null,ping:null,balai:null};
function peerOptions(){
  var o={debug:0};
  try{var c=JSON.parse(localStorage.getItem('tournoi_peer_cfg')||'null');if(c&&typeof c==='object')Object.keys(c).forEach(function(k){o[k]=c[k];});}catch(e){}
  return o;
}
function nouveauCode(){var s='';for(var i=0;i<4;i++)s+=CODE_ALPHA.charAt(Math.floor(Math.random()*CODE_ALPHA.length));return s;}
function normCode(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function fixerCode(c){pcode=c||'';try{if(pcode)localStorage.setItem('tournoi_pcode',pcode);else localStorage.removeItem('tournoi_pcode');}catch(e){}}
function nbConnectes(){return conns.filter(function(c){return c.open;}).length;}
function garderEveille(){try{if(navigator.wakeLock&&!verrou){navigator.wakeLock.request('screen').then(function(l){verrou=l;l.addEventListener('release',function(){verrou=null;});}).catch(function(){});}}catch(e){}}
function rejeterTout(){Object.keys(pending).forEach(function(k){var q=pending[k];clearTimeout(q.timer);delete pending[k];q.rej(new Error('Connexion perdue'));});}
function arreter(){
  clearTimeout(minuteurs.retry);clearInterval(minuteurs.ping);clearInterval(minuteurs.balai);
  rejeterTout();
  var cs=conns;conns=[];cs.forEach(function(c){try{c.close();}catch(e){}});
  if(lien){var l=lien;lien=null;try{l.close();}catch(e){}}
  if(peer){var p=peer;peer=null;try{p.destroy();}catch(e){}}
  lienOk=false;
}
function nouvellePeer(id){
  if(typeof Peer==='undefined'){toast('Bibliothèque de connexion directe absente.');return null;}
  try{return new Peer(id,peerOptions());}catch(e){toast('Cette tablette ne sait pas établir de connexion directe.');return null;}
}

/* --- Tablette maître : elle seule fait autorité (même rôle que server.js) --- */
function diffuser(msg){conns.forEach(function(c){if(c.open){try{c.send(msg);}catch(e){}}});}
function envoyerA(c,m){try{if(c.open)c.send(m);}catch(e){}}
function demarrerMaitre(code){
  arreter();MODE='master';ver=Math.max(ver,verCache);setSync(false);
  var essais=0;
  function creer(){
    if(MODE!=='master'||peer)return;
    var p=nouvellePeer(ID_PREFIX+code);if(!p)return;
    peer=p;
    p.on('open',function(){if(peer!==p)return;essais=0;setSync(true);garderEveille();});
    p.on('connection',function(c){if(peer!==p){try{c.close();}catch(x){}return;}accepterEleve(c);});
    p.on('disconnected',function(){if(peer!==p)return;setSync(false);setTimeout(function(){if(peer===p&&!p.destroyed){try{p.reconnect();}catch(x){}}},2000);});
    p.on('error',function(e){
      if(peer!==p)return;
      var pris=!!(e&&e.type==='unavailable-id');
      if(pris){essais++;setSync('reprise');if(essais===15)toast('Code déjà utilisé ailleurs ? Fermez l\'autre page maître ou prenez un nouveau code.');}
      else setSync(false);
      if(pris||p.destroyed){peer=null;try{p.destroy();}catch(x){}clearTimeout(minuteurs.retry);minuteurs.retry=setTimeout(creer,pris?3000:4000);}
    });
  }
  creer();
  minuteurs.balai=setInterval(balai,5000);
}
function accepterEleve(c){
  c._vu=Date.now();
  c.on('open',function(){c._vu=Date.now();if(conns.indexOf(c)<0)conns.push(c);setSync();envoyerA(c,{t:'state',ver:ver,state:S});});
  c.on('data',function(d){c._vu=Date.now();maitreRecevoir(c,d);});
  var fin=function(){conns=conns.filter(function(x){return x!==c;});setSync();};
  c.on('close',fin);c.on('error',fin);
}
function balai(){
  var now=Date.now();
  conns.slice().forEach(function(c){if(now-(c._vu||0)>20000){conns=conns.filter(function(x){return x!==c;});try{c.close();}catch(e){}}});
  if(peer&&!peer.destroyed&&peer.disconnected){try{peer.reconnect();}catch(e){}}
  setSync();
}
function maitreRecevoir(c,d){
  if(!d||typeof d!=='object')return;
  if(d.t==='ping'){envoyerA(c,{t:'pong'});return;}
  if(d.t==='get'){envoyerA(c,{t:'state',ver:ver,state:S});return;}
  if(d.t==='req'&&typeof d.id==='string'){
    maitreTraiter(String(d.p),d.b,d.c,String(c.peer||'x')).then(function(r){envoyerA(c,{t:'rep',id:d.id,ok:true,d:r});})
      .catch(function(e){envoyerA(c,{t:'rep',id:d.id,ok:false,status:e.status||500,erreur:e.message});});
  }
}
function maitreTraiter(p,b,c,qui){
  return new Promise(function(res,rej){
    function ko(status,msg){var e=new Error(msg);e.status=status;rej(e);}
    var distant=(qui!=='local');
    function trop(){var now=Date.now(),l=(echecsP[qui]||[]).filter(function(t){return now-t<60000;});echecsP[qui]=l;return l.length>=10;}
    function rater(){(echecsP[qui]=echecsP[qui]||[]).push(Date.now());}
    function codeOk(){
      if(c===undefined||c===null||c==='')return false;
      if(distant&&trop())return false;
      if(String(c)===CODE_LOCAL)return true;
      if(distant)rater();
      return false;
    }
    try{
      b=(b&&typeof b==='object')?b:{};
      if(p==='/api/auth'){
        if(distant&&trop())return ko(429,'Trop d\'essais, patientez une minute.');
        if(String(b.code)===CODE_LOCAL)return res({ok:true});
        if(distant)rater();
        return ko(401,'Code incorrect');
      }
      if(p==='/api/state'){
        if(!codeOk())return ko(401,'Code professeur requis');
        var inc=b.state;
        if(!inc||typeof inc!=='object'||!Array.isArray(inc.matchs)||!Array.isArray(inc.joueurs))return ko(400,'État invalide');
        var cur={};S.matchs.forEach(function(m){cur[m.id]=m;});
        inc.matchs=inc.matchs.map(function(m){var x=cur[m.id];return x?Object.assign({},m,{s:x.s,u:x.u}):m;});
        var curX={};(S.extras||[]).forEach(function(e){e.matchs.forEach(function(m){curX[m.id]=m;});});
        inc.extras=(inc.extras||[]).map(function(e){return Object.assign({},e,{matchs:(e.matchs||[]).map(function(m){var x=curX[m.id];return x?Object.assign({},m,{s:x.s,u:x.u}):m;})});});
        if(inc.id===S.id){inc.records=S.records;inc.addition=S.addition;inc.validations=S.validations;} /* les records saisis par les élèves ne sont jamais écrasés */
        S=normaliser(inc);ver++;cache();
        diffuser({t:'state',ver:ver,state:S});
        demanderRender();
        return res({ver:ver,state:S});
      }
      if(p==='/api/score'){
        if(S.tournoi.statut!=='en_cours')return ko(409,'Le tournoi n\'est pas en cours.');
        var tm=trouverMatch(S,b.id),m=tm&&tm.m;
        if(!m)return ko(404,'Match introuvable (joueur retiré ?).');
        if(b.s!==null){
          if(!Array.isArray(b.s)||!b.s.every(function(a){return Array.isArray(a)&&a.length===2;}))return ko(400,'Score invalide');
          var v=valideMatch(b.s,tm.R);if(!v.ok)return ko(400,v.err);
        }
        if(m.s&&!codeOk())return ko(403,'Ce match a déjà un score : code professeur requis pour le corriger.');
        m.s=b.s;m.u=Date.now();ver++;cache();
        diffuser({t:'score',ver:ver,id:m.id,s:m.s,u:m.u});
        demanderRender();
        return res({ver:ver});
      }
      if(p==='/api/record'){
        if(b.del){
          if(!codeOk())return ko(401,'Code professeur requis');
          S.records=S.records.filter(function(r){return r.id!==b.id;});
        }else{if(!exoDispo(S,'records'))return ko(403,'Cet exercice n\'est pas disponible pour le moment.');var er=upsertRecord(S,b);if(er)return ko(400,er);}
        ver++;cache();diffuser({t:'state',ver:ver,state:S});demanderRender();
        return res({ver:ver});
      }
      if(p==='/api/addition'){
        if(b.del){
          if(!codeOk())return ko(401,'Code professeur requis');
          S.addition=S.addition.filter(function(r){return r.id!==b.id;});
        }else{if(!exoDispo(S,'addition'))return ko(403,'Cet exercice n\'est pas disponible pour le moment.');var ea=ajouterAddition(S,b);if(ea)return ko(ea.indexOf('Déjà')===0?409:400,ea);}
        ver++;cache();diffuser({t:'state',ver:ver,state:S});demanderRender();
        return res({ver:ver});
      }
      if(p==='/api/valid'){
        var prof=(c!==undefined&&c!==null&&c!=='')&&codeOk();
        if(!prof&&(b.a==='ok'||b.a==='non'))return ko(401,'Code professeur requis');
        if(b.a==='val'&&!prof){
          if(!exoDispo(S,'defis')||!exoDispo(S,'t_'+String(b.x).split('|')[0]))return ko(403,'Cet exercice n\'est pas disponible pour le moment.');
        }
        var ev=traiterValid(S,b,prof);if(ev)return ko(/^Seul/.test(ev)?403:400,ev);
        ver++;cache();diffuser({t:'state',ver:ver,state:S});demanderRender();
        return res({ver:ver});
      }
      ko(404,'Inconnu');
    }catch(e){ko(400,'Requête invalide');}
  });
}

/* --- Tablette élève --- */
function demarrerEleve(code){
  arreter();MODE='slave';ver=0;accepterProchain=true;setSync(false);
  var p=nouvellePeer('tournoi-el-'+uid('').replace(/[^a-zA-Z0-9]/g,''));if(!p)return;
  peer=p;
  p.on('open',function(){if(peer===p&&!(lien&&lien.open))ouvrirLien(code);});
  p.on('disconnected',function(){if(peer!==p)return;setTimeout(function(){if(peer===p&&!p.destroyed){try{p.reconnect();}catch(x){}}},2000);});
  p.on('error',function(e){
    if(peer!==p)return;
    if(e&&e.type==='peer-unavailable'){if(lien){var l=lien;lien=null;try{l.close();}catch(x){}}setSync(false);}
    else if(p.destroyed){peer=null;}
  });
  minuteurs.ping=setInterval(function(){
    if(MODE!=='slave')return;
    if(!peer||peer.destroyed){demarrerEleve(code);return;}
    if(lien&&lien.open){
      if(Date.now()-lastPong>14000){var l=lien;lien=null;try{l.close();}catch(x){}setSync(false);rejeterTout();return;}
      try{lien.send({t:'ping'});}catch(x){}
    }else if(!lien){
      if(peer.disconnected){try{peer.reconnect();}catch(x){}}else ouvrirLien(code);
    }
  },4000);
  garderEveille();
}
function ouvrirLien(code){
  if(MODE!=='slave'||!peer||peer.destroyed||peer.disconnected)return;
  if(lien){var old=lien;lien=null;try{old.close();}catch(x){}}
  var c;
  try{c=peer.connect(ID_PREFIX+code,{reliable:true});}catch(e){return;}
  lien=c;var ouvert=false;
  var to=setTimeout(function(){if(!ouvert&&lien===c){lien=null;try{c.close();}catch(x){}}},9000);
  c.on('open',function(){
    if(lien!==c)return;
    ouvert=true;clearTimeout(to);lastPong=Date.now();accepterProchain=true;setSync(true);
    try{c.send({t:'get'});}catch(x){}
    envoyerEnAttente();
  });
  c.on('data',function(d){if(lien!==c)return;lastPong=Date.now();eleveRecevoir(d);});
  var perdu=function(){if(lien!==c)return;lien=null;clearTimeout(to);setSync(false);rejeterTout();};
  c.on('close',perdu);c.on('error',perdu);
}
function eleveRecevoir(d){
  if(!d||typeof d!=='object')return;
  if(d.t==='state'){if(accepterProchain||d.ver>=ver){accepterProchain=false;appliquerServeur(d.state,d.ver);}return;}
  if(d.t==='score'){
    if(d.ver<=ver)return;
    if(d.ver!==ver+1){rechargerEtat();return;}
    var m=(trouverMatch(S,d.id)||{}).m;
    if(m){m.s=d.s;m.u=d.u;}
    ver=d.ver;cache();demanderRender();return;
  }
  if(d.t==='rep'){
    var q=pending[d.id];if(!q)return;
    clearTimeout(q.timer);delete pending[d.id];
    if(d.ok)q.res(d.d);else{var e=new Error(d.erreur||'Erreur');e.status=d.status;q.rej(e);}
  }
}
function appelEleve(p,b,c){
  return new Promise(function(res,rej){
    if(!(lien&&lien.open)){rej(new Error('Maître injoignable'));return;}
    var id=uid('r');
    var timer=setTimeout(function(){delete pending[id];rej(new Error('Pas de réponse du maître'));},8000);
    pending[id]={res:res,rej:rej,timer:timer};
    try{lien.send({t:'req',id:id,p:p,b:b,c:c});}catch(e){clearTimeout(timer);delete pending[id];rej(e);}
  });
}

/* ---------- Boîtes de dialogue ---------- */
function dialogue(titre,corps,boutons){
  return new Promise(function(res){
    var v=document.createElement('div');v.className='voile';
    v.innerHTML='<div class="modal" role="dialog"><h3>'+titre+'</h3><div>'+corps+'</div><div class="boutons">'+boutons.map(function(b,i){return '<button class="btn '+(b.cls||'')+'" data-i="'+i+'">'+b.label+'</button>';}).join('')+'</div></div>';
    document.body.appendChild(v);
    /* le clavier tactile ne doit pas masquer la boîte : on la cale sur la zone réellement visible */
    var vvp=window.visualViewport;
    function caler(){if(!document.body.contains(v)){if(vvp){vvp.removeEventListener('resize',caler);vvp.removeEventListener('scroll',caler);}return;}
      if(!vvp)return;v.style.inset='auto';v.style.left='0';v.style.right='0';v.style.top=vvp.offsetTop+'px';v.style.height=vvp.height+'px';
      var fa=document.activeElement;if(fa&&v.contains(fa)&&fa.scrollIntoView){try{fa.scrollIntoView({block:'center'});}catch(e){}}}
    if(vvp){vvp.addEventListener('resize',caler);vvp.addEventListener('scroll',caler);}
    v.addEventListener('focusin',function(){setTimeout(caler,250);});
    var occupe=false;
    function clic(i){
      var b=boutons[i];if(occupe)return;occupe=true;
      Promise.resolve(b.check?b.check(v):true).then(function(ok){occupe=false;if(ok){v.remove();res({val:b.val,root:v});}});
    }
    v.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)clic(+b.dataset.i);else if(e.target===v&&boutons[0].val===false){v.remove();res({val:false,root:v});}});

function champsFormat(R){

function lireFormat(root){
  var R=Object.assign({},S.regles);

function titrePhase(p,base){var n=phasesDe(S,p).filter(function(e){return e.titre.indexOf(base)===0;}).length;return n?base+' '+(n+1):base;}
function creerPhaseAuto(p,type){
  var ids=S.joueurs.filter(function(j){return j.poule===p&&!j.retire;}).map(function(j){return j.id;});
  if(type==='tournant'&&ids.length<3){toast('Il faut au moins 3 joueurs dans la poule.');return;}

  dialogue(type==='retour'?'🔁 Matchs retours · format libre':'🤝 Double tournant · format des matchs',
    '<p>Choisissez le format des matchs'+(type==='retour'?' retours (il peut différer de l\'aller)':' de double')+' :</p>'+champsFormat(S.regles)+'<p class="err" id="errFmt"></p>',
    [{label:'Annuler',val:false},{label:'Créer',val:true,cls:'primaire',check:function(root){if(!lireFormat(root)){$('#errFmt',root).textContent='Points par set : un nombre entre 1 et 99.';return false;}return true;}}]).then(function(r){
    if(r.val!==true)return;

      ns.extras.push({id:id,p:p,type:type,titre:titre,R:R,matchs:ms});
    }).then(function(ok){if(ok){phaseSel=id;vue='tournoi';render();toast(titre+' créé.');}});
  });
}
function constructeurEquipes(p){
  var jou=S.joueurs.filter(function(j){return j.poule===p&&!j.retire;});
  if(jou.length<3){toast('Il faut au moins 3 joueurs dans la poule.');return;}
  var J=mapJ(),B={eq:[],sel:null,R:Object.assign({},S.regles)};
  for(var i=0;i<Math.ceil(jou.length/2);i++)B.eq.push({id:uid('e'),j:[]});
  var v=document.createElement('div');v.className='voile';document.body.appendChild(v);
  var dr=null,calme=false;
  function places(){var o={};B.eq.forEach(function(e){e.j.forEach(function(k){o[k]=1;});});return o;}
  function chip(id){return '<span class="eqj'+(B.sel===id?' sel':'')+'" data-j="'+id+'">'+esc(J[id].nom)+'</span>';}
  function dessiner(){
    var pl=places(),libre=jou.filter(function(j){return !pl[j.id];}),nEq=B.eq.filter(function(e){return e.j.length;}).length;
    v.innerHTML='<div class="modal grand" role="dialog"><h3>👥 Double classique · Poule '+p+'</h3>'
     +'<p class="muted" style="margin:0 0 8px">Glissez les joueurs dans les équipes (ou touchez un joueur, puis une équipe). Une équipe peut rester avec <b>un seul joueur</b> (poule impaire).</p>'
     +'<div class="eqzone"><div class="eqdispo" data-drop="pool"><h4>Joueurs sans équipe ('+libre.length+')</h4>'+libre.map(function(j){return chip(j.id);}).join('')+'</div>'
     +'<div><h4>Équipes ('+nEq+')</h4><div class="eqliste">'+B.eq.map(function(e,k){return '<div class="eqcarte" data-drop="eq" data-eq="'+e.id+'"><div class="eqtit"><b>Équipe '+(k+1)+'</b><button class="btn petit" data-x="delEq" data-eq="'+e.id+'" title="Supprimer cette équipe">✕</button></div>'
        +e.j.map(chip).join('')+(e.j.length===0?'<span class="muted">Déposez un joueur…</span>':e.j.length===1?'<span class="muted"> · seul(e)</span>':'')+'</div>';}).join('')+'</div>'
     +'<button class="btn petit" data-x="addEq">➕ Ajouter une équipe</button></div></div>'
     +'<div class="lignebtn" style="margin:10px 0"><button class="btn petit" data-x="hasard">🎲 Équipes au hasard</button><button class="btn petit" data-x="equil">⚖️ Fort + faible</button><button class="btn petit" data-x="vider">↺ Tout vider</button></div>'
     +champsFormat(B.R)+(libre.length?'<div class="warn" style="margin-top:8px">'+libre.length+' joueur'+(libre.length>1?'s':'')+' sans équipe ne jouer'+(libre.length>1?'ont':'a')+' pas.</div>':'')
     +'<p class="err" id="errEq"></p><div class="boutons"><button class="btn" data-x="annuler">Annuler</button><button class="btn primaire" data-x="creer">Créer les matchs</button></div></div>';
  }
  function deplacer(jid,zone){
    var kind=zone.dataset.drop;
    if(kind==='eq'){var t=B.eq.find(function(e){return e.id===zone.dataset.eq;});if(!t)return;
      if(t.j.indexOf(jid)<0&&t.j.length>=2){toast('Équipe complète : retirez d\'abord un joueur.');return;}
      B.eq.forEach(function(e){e.j=e.j.filter(function(k){return k!==jid;});});t.j.push(jid);
    }else B.eq.forEach(function(e){e.j=e.j.filter(function(k){return k!==jid;});});
    B.sel=null;
  }
  function paires(ordre){B.eq=[];for(var i=0;i<ordre.length;i+=2)B.eq.push({id:uid('e'),j:ordre.slice(i,i+2)});}
  v.addEventListener('click',function(e){
    if(calme)return;
    var x=e.target.closest('[data-x]');
    if(x){var a=x.dataset.x;
      if(a==='annuler'){v.remove();return;}

function saisirScore(id){

  var suite=(m.s&&!CODE)?demanderCode('Ce match a déjà un score. Code professeur requis pour le corriger :'):Promise.resolve(true);
  suite.then(function(ok){
    if(!ok)return;
    var rows='';

      rows+='<div class="setrow"><span>Set '+(i+1)+'</span><input inputmode="numeric" pattern="[0-9]*" data-set="'+i+'" data-side="0" value="'+(v?v[0]:'')+'"><b>–</b><input inputmode="numeric" pattern="[0-9]*" data-set="'+i+'" data-side="1" value="'+(v?v[1]:'')+'"></div>';}

    var lire=function(root){

        if(a===''&&b===''){vide=true;continue;}

        if(a===''||b==='')return {err:'Set '+(i+1)+' : renseignez les deux scores.'};
        sets.push([Number(a),Number(b)]);
      }
      var v=valideMatch(sets,R);return v.ok?{sets:sets}:{err:v.err.charAt(0).toUpperCase()+v.err.slice(1)+'.'};
    };
    dialogue('Score du match',corps,[{label:'Annuler',val:false}].concat(m.s?[{label:'Effacer le score',val:'del',cls:'danger'}]:[]).concat([{label:'Enregistrer',val:'ok',cls:'primaire',check:function(root){var r=lire(root);$('#errScore',root).textContent=r.err||'';return !r.err;}}])).then(function(r){
      if(r.val==='ok')enregistrerScore(id,lire(r.root).sets);

  });
}

function testerUrl(u){
  return new Promise(function(res){
    var done=false,fin=function(r){if(!done){done=true;clearTimeout(t);res(r);}},t=setTimeout(function(){fin('inc');},12000),m,el;
    if((m=u.match(/drive\.google\.com\/(?:open\?id=|file\/d\/)([\w-]+)/))){el=new Image();el.onload=function(){fin(el.naturalWidth>0?'ok':'ko');};el.onerror=function(){fin('ko');};el.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w120';}

    else if(/^https?:/.test(u)){el=document.createElement('video');el.preload='metadata';el.muted=true;el.onloadedmetadata=function(){fin('ok');};el.onerror=function(){fin('ko');};el.src=u;}

function lireOptsTirage(){

    var th=vidNorm(g.nom).split(' ').filter(function(w){return w.length>2;});if(!th.length)th=vidNorm(g.nom).split(' ');
    g.niveaux.forEach(function(n){var nv=vidNorm(NIVEAUX_NOMS[n.idx]||'');[0,1].forEach(function(sl){if(sl===1&&!n.video2)return;E.push({cle:n.x+'#'+sl,id:vidIdDrive(sl?n.video2:n.video),slot:sl,mots:th,niv:nv,lib:g.nom+' — '+(PALIERS[n.idx]?PALIERS[n.idx].nom:'')+(sl?' (vidéo 2)':'')});});});
    g.infos.forEach(function(n,k){var tt=n.titre?vidNorm(n.titre).split(' ').filter(function(w){return w.length>2;}):[];[0,1].forEach(function(sl){if(sl===1&&!n.video2)return;E.push({cle:g.k+'~'+k+'#'+sl,id:vidIdDrive(sl?n.video2:n.video),slot:sl,mots:th.concat(tt),niv:null,lib:g.nom+(n.titre?' — '+n.titre:'')+(sl?' (vidéo 2)':'')});});});});
  return E;
}
function vidAssocier(nom,E){
  var w=vidNorm(nom).split(' '),sl=(w.indexOf('2')>=0||w.indexOf('video2')>=0||w.indexOf('v2')>=0||w.indexOf('bis')>=0)?1:0,nivs=NIVEAUX_NOMS.map(vidNorm),best=null,sc=0;
  E.forEach(function(e){
    if(e.slot!==sl)return;if(!e.mots.every(function(m){return w.indexOf(m)>=0;}))return;
    if(e.niv){if(w.indexOf(e.niv)<0)return;}else if(nivs.some(function(N){return w.indexOf(N)>=0;}))return;
    if(e.mots.length>sc){sc=e.mots.length;best=e;}});
  return best;
}
function vidImporter(files){
  var E=vidEntrees(),F=[].slice.call(files).filter(function(f){return /^video\//.test(f.type)||/\.(mp4|m4v|mov|webm)$/i.test(f.name);});
  if(!F.length){toast('Aucun fichier vidéo sélectionné.');return;}
  if(navigator.storage&&navigator.storage.persist)try{navigator.storage.persist();}catch(e){}
  var ok=0,nok=0;
  vidStore('readwrite').then(function(st){
    return new Promise(function(res,rej){
      F.forEach(function(f){var P=vidParNom(f.name,E);if(!P.length){var e=vidAssocier(f.name,E);if(e)P=[e];}if(P.length){P.forEach(function(e){st.put({blob:f,nom:f.name},e.cle);});ok++;}else{st.put({blob:f,nom:f.name},'u:'+f.name);nok++;}});
      st.transaction.oncomplete=res;st.transaction.onerror=function(){rej(st.transaction.error);};st.transaction.onabort=function(){rej(st.transaction.error||new Error('Espace de stockage insuffisant.'));};});
  }).then(vidCharger).then(function(){toast(ok+' vidéo'+(ok>1?'s':'')+' associée'+(ok>1?'s':'')+(nok?' · '+nok+' à associer à la main':'')+'.');render();})
  .catch(function(e){toast('Import impossible : '+(e&&e.message?e.message:'espace insuffisant')+'.');});
}

function envoyerValid(x,a){
  var j=S.joueurs.find(function(y){return y.id===statId;});if(!j)return;
  var body={j:j.id,x:x,a:a},codeV=(a==='annul'&&CODE)?CODE:undefined,idx=+x.split('|')[1],g=groupesDe(S).find(function(k){return k.k===x.split('|')[0];});
  var fin=function(){
    var V=validesDe(S,j.id),v=V[x];
    if(a==='val'&&v&&v.e==='ok')dialogue('🎉 Niveau validé !','<div style="text-align:center"><div class="pop" style="display:inline-block">'+badgeSVG(PALIERS[idx],150)+'</div><p style="font-size:20px;margin:8px 0 2px"><b>Raquette de '+esc(PALIERS[idx].nom)+'</b></p><p class="muted" style="margin:0">'+esc(g?g.nom:'')+'</p></div>',[{label:'Super !',val:true,cls:'primaire'}]);
    else if(a==='val'&&v)toast('⏳ Demande envoyée au professeur.');
    render();
  };
  if(!reseau()){var er=null;commit(function(ns){er=traiterValid(ns,body,!!codeV);}).then(function(){if(er)toast(er);else fin();});return;}
  api('/api/valid',body,codeV).then(function(){
    var prof=!!codeV; /* applique localement si l'état diffusé n'est pas encore arrivé */
    var before=JSON.stringify(S.validations);traiterValid(S,body,prof);if(JSON.stringify(S.validations)!==before)cache();
    fin();
  }).catch(function(e){
    if(e.status===undefined||e.name==='TypeError'||/injoignable|Pas de réponse/.test(e.message)){traiterValid(S,body,false);cache();mettreEnAttente({val:1,j:body.j,x:x,a:a});toast('Hors ligne : gardé, envoi dès que le réseau revient.');render();}
    else{toast(e.message);rechargerEtat();}
  });
}

function enregistrerRecord(k){
  var j=S.joueurs.find(function(x){return x.id===statId;});if(!j)return;
  var nv=$('#recN_'+k).value.trim(),avec=$('#recA_'+k).value.trim();
  if(nv===''||isNaN(Number(nv))){toast('Entrez le nombre de frappes.');return;}
  var TRk=TYPES_REC.find(function(x){return x.k===k;}),avec2=TRk&&TRk.double&&$('#recA2_'+k)?$('#recA2_'+k).value.trim():'';
  if(TRk&&TRk.double){if(!avec||!avec2){toast('Indiquez les deux partenaires d\'en face.');($('#recA_'+k).value?$('#recA2_'+k):$('#recA_'+k)).focus();return;}if(avec===avec2){toast('Choisissez deux partenaires d\'en face différents.');return;}}
  else if(!avec){toast('Indiquez avec qui vous avez réalisé ce record.');$('#recA_'+k).focus();return;}
  var n=Number(nv);if(Math.floor(n)!==n||n<0||n>999){toast('Le nombre de frappes doit être un entier entre 0 et 999.');return;}
  var avant=palierIdx(meilleurGlobal(S,j.id)),avantK=(recordsDe(S,j.id)[k].best||{n:-1}).n;
  var body={j:j.id,k:k,n:n,avec:avec};if(avec2)body.avec2=avec2;
  var fin=function(){
    var apres=palierIdx(meilleurGlobal(S,j.id)),pal=PALIERS[apres],T=TYPES_REC.find(function(x){return x.k===k;});
    var rec=n>avantK;
    if(apres>avant){
      dialogue('🎉 Nouveau badge !','<div style="text-align:center"><div class="pop" style="display:inline-block">'+badgeSVG(pal,150)+'</div><p style="font-size:20px;margin:8px 0 2px"><b>Raquette de '+esc(pal.nom)+'</b></p><p class="muted" style="margin:0">'+n+' frappes · '+T.nom+'</p></div>',[{label:'Super !',val:true,cls:'primaire'}]);
    }else toast(rec?'🔥 Nouveau record personnel : '+n+' frappes !':'Score enregistré.');
    render();
  };
  if(!reseau()){var er=null;commit(function(ns){er=upsertRecord(ns,body);}).then(function(){if(er)toast(er);else fin();});return;}
  api('/api/record',body).then(function(){
    var r=S.records.find(function(x){return x.j===body.j&&x.k===k&&x.s===S.tournoi.seance;});
    if(!r||r.n!==n){ /* l'état diffusé n'est pas encore arrivé : on applique localement */ upsertRecord(S,body);cache();}
    fin();
  }).catch(function(e){
    if(e.status===undefined||e.name==='TypeError'||/injoignable|Pas de réponse/.test(e.message)){upsertRecord(S,body);cache();mettreEnAttente({rec:1,j:body.j,k:k,n:n,avec:avec,avec2:avec2||undefined});toast('Hors ligne : score gardé, envoi dès que le réseau revient.');render();}
    else toast(e.message);
  });
}

function courbeSVG(tout){
  var n=tout.length,W=640,H=40+Math.max(2,Math.max.apply(null,tout.map(function(s){return s.poule;})))*38,pm=Math.max.apply(null,tout.map(function(s){return s.poule;})),L=60,R=24,T=22,B=26;
  var step=n>1?(W-L-R)/(n-1):0,yH=function(p){return T+(pm>1?(p-1)*((H-T-B)/(pm-1)):(H-T-B)/2);};
  var s='<svg class="courbe" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution de la poule séance après séance">';
  for(var p=1;p<=pm;p++)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yH(p)+'" y2="'+yH(p)+'" stroke="#e3e7ec"/><text x="'+(L-8)+'" y="'+(yH(p)+4)+'" text-anchor="end" font-size="12" fill="#5b6b80">P'+p+'</text>';
  var pts=tout.map(function(x,i){return {x:L+i*step,y:yH(x.poule),s:x};});
  var path='';pts.forEach(function(q,i){if(i===0)path+='M'+q.x+','+q.y;else path+=' L'+q.x+','+pts[i-1].y+' L'+q.x+','+q.y;});
  s+='<path d="'+path+'" fill="none" stroke="#1f6f8b" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(q){
    var c=q.s.mouv==='up'?'#2e8b57':q.s.mouv==='down'?'#c0362c':'#5b6b80';
    s+='<circle cx="'+q.x+'" cy="'+q.y+'" r="7" fill="'+(q.s.enCours?'#fff':c)+'" stroke="'+c+'" stroke-width="3"/><text x="'+q.x+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="#5b6b80">'+(q.s.enCours?'S'+q.s.seance+'…':'S'+q.s.seance)+'</text>';
  });
  return s+'</svg>';
}

function lancer(){

  if(!P.length){toast('Aucun joueur n\'est affecté à une poule.');return;}
  var seuls=P.filter(function(p){return S.joueurs.filter(function(j){return j.poule===p;}).length<2;});
  if(seuls.length){toast('La poule '+seuls[0]+' n\'a qu\'un joueur : ajoutez-en ou supprimez-la.');return;}
  confirmer('Lancer la séance '+S.tournoi.seance+' ?',(sans?'<b>'+sans+' joueur(s) non affecté(s)</b> ne joueront pas.<br>':'')+'Les règles et les poules seront verrouillées.','Lancer').then(function(ok){
    if(!ok)return;
    commit(function(ns){
      ns.matchs=[];ns.extras=[];

        var ids=ns.joueurs.filter(function(j){return j.poule===p;}).map(function(j){return j.id;});
        genererMatchs(ids,ns.regles.rondes).forEach(function(x){ns.matchs.push({id:uid('m'),p:p,r:x.r,a:x.a,b:x.b,s:null,u:0});});

function retirer(id){
  var j=S.joueurs.find(function(x){return x.id===id;});if(!j)return;
  var nj=S.matchs.filter(function(m){return m.s&&(m.a===id||m.b===id);}).length;
  dialogue('Retirer '+esc(j.nom),'<p>Ses matchs restants sont supprimés : la poule continue avec les autres joueurs.</p>'
    +(nj?'<div class="radio"><input type="radio" name="gard" id="g1" value="1" checked><label for="g1"><b>Conserver</b> ses '+nj+' match'+(nj>1?'s':'')+' déjà joué'+(nj>1?'s':'')+' dans le classement des autres</label></div><div class="radio"><input type="radio" name="gard" id="g0" value="0"><label for="g0"><b>Annuler</b> tous ses matchs (comme s\'il n\'avait jamais joué)</label></div>':''),
    [{label:'Annuler',val:false},{label:'Retirer le joueur',val:true,cls:'danger plein'}]).then(function(r){
    if(r.val!==true)return;
    var garder=nj?r.root.querySelector('#g1').checked:false;
    commit(function(ns){
      var p=ns.joueurs.find(function(x){return x.id===id;});p.retire=true;
      ns.matchs=ns.matchs.filter(function(m){return !(m.a===id||m.b===id)||(garder&&m.s);});
    });
  });
}
function reintegrer(id){
  commit(function(ns){
    var j=ns.joueurs.find(function(x){return x.id===id;});j.retire=false;
    var mates=ns.joueurs.filter(function(x){return x.poule===j.poule&&!x.retire&&x.id!==id;});
    var rmax=ns.matchs.filter(function(m){return m.p===j.poule;}).reduce(function(a,m){return Math.max(a,m.r);},0)+1;
    mates.forEach(function(o){
      var existe=ns.matchs.some(function(m){return m.p===j.poule&&((m.a===id&&m.b===o.id)||(m.a===o.id&&m.b===id));});
      if(!existe)ns.matchs.push({id:uid('m'),p:j.poule,r:rmax,a:id,b:o.id,s:null,u:0});
    });
  }).then(function(ok){if(ok)toast('Joueur réintégré : ses matchs manquants sont ajoutés en fin de poule.');});
}

/* ---------- Glisser-déposer (souris et tactile) ---------- */
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('.grip');if(!g||enCours())return;
  var chip=g.closest('.chip');if(!chip)return;
  e.preventDefault();glisse=true;
  var ghost=chip.cloneNode(true);ghost.classList.add('fantome');ghost.style.width=chip.offsetWidth+'px';document.body.appendChild(ghost);chip.classList.add('leve');
  var cible=null;
  function pos(ev){
    ghost.style.left=(ev.clientX-24)+'px';ghost.style.top=(ev.clientY-20)+'px';
    ghost.style.display='none';var el=document.elementFromPoint(ev.clientX,ev.clientY);ghost.style.display='';
    var z=el&&el.closest?el.closest('[data-zone]'):null;
    if(cible!==z){if(cible)cible.classList.remove('survol');cible=z;if(cible)cible.classList.add('survol');}
    if(ev.clientY<90)window.scrollBy(0,-14);else if(ev.clientY>window.innerHeight-90)window.scrollBy(0,14);
  }
  function nettoyer(){window.removeEventListener('pointermove',pos);window.removeEventListener('pointerup',fin);window.removeEventListener('pointercancel',annule);ghost.remove();chip.classList.remove('leve');if(cible)cible.classList.remove('survol');glisse=false;}
  function fin(){var z=cible;nettoyer();
    if(z&&z.dataset.zone!==chip.dataset.from){var pid=chip.dataset.pid,to=+z.dataset.zone;commit(function(ns){ns.joueurs.find(function(j){return j.id===pid;}).poule=to;});}
    else render();}
  function annule(){nettoyer();render();}
  window.addEventListener('pointermove',pos);window.addEventListener('pointerup',fin);window.addEventListener('pointercancel',annule);
  pos(e);
});
