    var nom=$('#addNom').value.trim();if(!nom){toast('Entrez un nom.');return;}
    var niv=parseFloat($('#addNiv').value);if(isNaN(niv))niv=5;var gen=$('#addGenre')?$('#addGenre').value:'';
    commit(function(ns){ns.joueurs.push({id:uid('j'),nom:nom,niveau:niv,poule:0,genre:gen,retire:false});});
  }
  else if(a==='supprimerJoueur')commit(function(ns){ns.joueurs=ns.joueurs.filter(function(j){return j.id!==b.dataset.id;});});
  else if(a==='viderJoueurs')confirmer('Tout supprimer ?','La liste des '+S.joueurs.length+' joueurs sera vidée.','Tout supprimer',true).then(function(ok){if(ok)commit(function(ns){ns.joueurs=[];});});
  else if(a==='importerTexte'){var t=$('#collage').value;if(!t.trim()){toast('Collez d\'abord des lignes depuis Excel.');return;}ajouterDepuisLignes(parseCSV(t),$('#remplacer').checked);}
  else if(a==='repartir'){
    var mode=$('#modeRep').value,err=null;
    if(!S.joueurs.length){toast('Ajoutez d\'abord des joueurs.');return;}
    if(S.joueurs.length>S.regles.nbPoules*30){toast('Trop de joueurs pour '+S.regles.nbPoules+' poules de 30 maximum : il faut au moins '+Math.ceil(S.joueurs.length/30)+' poules.');return;}
    commit(function(ns){var r=repartir(ns,mode);if(r.err)err=r.err;}).then(function(ok){if(err)toast(err);else if(ok){sous='poules';render();}});
  }
  else if(a==='lancer')lancer();
  else if(a==='retirer')retirer(b.dataset.id);
  else if(a==='reintegrer')reintegrer(b.dataset.id);
  else if(a==='finSeance')finSeance();
  else if(a==='voirHisto')voirHisto(+b.dataset.i);
  else if(a==='exporter')exporterCSV();
  else if(a==='annulerLancement')confirmer('Revenir à la configuration ?','Tous les matchs et scores de cette séance seront <b>effacés</b>.','Effacer et revenir',true).then(function(ok){if(ok)commit(function(ns){ns.matchs=[];ns.extras=[];ns.tournoi.statut='config';ns.joueurs.forEach(function(j){j.retire=false;});});});
  else if(a==='nouveau')confirmer('Tout effacer ?','<b>Tous les tournois</b> (joueurs, poules, scores, historique) seront effacés.','Tout effacer',true).then(function(ok){if(ok){sauvegarderAuto('Avant effacement');}if(ok)commit(function(ns){var n=etatInitial();Object.keys(ns).forEach(function(k){delete ns[k];});Object.assign(ns,n);}).then(function(){sous='accueil';render();});});
  else if(a==='sauvMaint'){sauvegarderAuto('Sauvegarde manuelle');toast('Sauvegarde faite.');render();}
  else if(a==='sauvShare')sauvPartagerMaintenant(b.dataset.i);
  else if(a==='sauvDl'){var so=sauvLire()[+b.dataset.i];if(so)sauvTelecharger(so);}
  else if(a==='sauvRest'){var sr=sauvLire()[+b.dataset.i];if(sr)restaurerSauv(sr.etat,sauvDate(sr.t)+' · '+(sr.motif||''));}
  else if(a==='nouveauTournoi')nouveauTournoi();
  else if(a==='nouvelleSeance')nouvelleSeanceChoix();
  else if(a==='ouvrirTournoi')ouvrirTournoi(b.dataset.id);
  else if(a==='testVid')lancerTestVideos();
  else if(a==='vidVider'){if(confirm('Supprimer toutes les vidéos enregistrées sur cette tablette ?'))vidVider();}
  else if(a==='copierVid'){var tx=videoTest.mauvais.map(function(x){return x.lib+'\t'+x.url;}).join('\n');(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(tx):Promise.reject()).then(function(){toast('Liste copiée.');}).catch(function(){toast('Copie impossible : recopiez la liste affichée.');});}
  else if(a==='seanceTournoi')demarrerSeance(b.dataset.id);
  else if(a==='supprimerTournoi')supprimerTournoi(b.dataset.id);
  else if(a==='exoToggle'){var kx=b.dataset.k,nv2=!exoDispo(S,kx);commit(function(ns){ns.exercices[kx]=nv2;}).then(function(ok){if(ok)toast(nv2?'Exercice rendu disponible.':'Exercice grisé pour les élèves.');});}
  else if(a==='exoTous'){var on2=b.dataset.v==='1';commit(function(ns){EXERCICES.forEach(function(e){ns.exercices[e.k]=on2;});});}
  else if(a==='defTheme'){var gk=b.dataset.t;if(!exoDispo(S,'t_'+gk)){toast('Ce thème n\'est pas disponible pour le moment.');return;}defTheme=gk;render();window.scrollTo(0,0);}
  else if(a==='defRetour'){defTheme=null;render();window.scrollTo(0,0);}
  else if(a==='video'){videoOuv[b.dataset.key]=!videoOuv[b.dataset.key];render();}
  else if(a==='valSet')envoyerValid(b.dataset.x,b.dataset.a);
  else if(a==='valMode'){var vm=b.dataset.v;commit(function(ns){ns.regles.validation=vm;});}
  else if(a==='valProf'){var vb={j:b.dataset.j,x:b.dataset.x,a:b.dataset.a};apiProf('/api/valid',vb,function(ns){return traiterValid(ns,vb,true);}).then(function(){if(MODE&&reseau()){traiterValid(S,vb,true);cache();}render();}).catch(function(e){toast(e.message);});}
  else if(a==='catReset')confirmer('Revenir au catalogue de départ ?','Le catalogue importé sera remplacé. Les validations déjà faites restent enregistrées.','Revenir').then(function(ok){if(ok)commit(function(ns){ns.catalogue=null;});});
  else if(a==='tirer')tirer();
  else if(a==='tirReset'){lireOptsTirage();tir.deja=[];tir.dernier=[];render();}
  else if(a==='grpFaire')grpFaire();
  else if(a==='grpCopier')grpCopier();
  else if(a==='plein')basculerPleinEcran();
  else if(a==='progSous'){if(!exoDispo(S,b.dataset.v)){toast('Cet exercice n\'est pas disponible pour le moment.');return;}progSous=b.dataset.v;render();}
  else if(a==='addSave')enregistrerAddition();
  else if(a==='addDel')confirmer('Supprimer cette saisie ?','Le joueur pourra la saisir à nouveau.','Supprimer',true).then(function(ok){if(ok)apiProf('/api/addition',{id:b.dataset.id,del:true},function(ns){ns.addition=ns.addition.filter(function(r){return r.id!==b.dataset.id;});return null;}).then(function(){S.addition=S.addition.filter(function(r){return r.id!==b.dataset.id;});cache();render();}).catch(function(e){toast(e.message);});});
  else if(a==='recSave')enregistrerRecord(b.dataset.k);
  else if(a==='recDel')confirmer('Supprimer ce score ?','Ce record sera effacé.','Supprimer',true).then(function(ok){if(ok)apiProf('/api/record',{id:b.dataset.id,del:true},function(ns){ns.records=ns.records.filter(function(r){return r.id!==b.dataset.id;});return null;}).then(function(){S.records=S.records.filter(function(r){return r.id!==b.dataset.id;});cache();render();}).catch(function(e){toast(e.message);});});
  else if(a==='statChoisir'){statId=b.dataset.id;try{localStorage.setItem('tournoi_stat',statId);}catch(x){}statFiltre='';render();window.scrollTo(0,0);}
  else if(a==='statChanger'){statId=null;statFiltre='';try{localStorage.removeItem('tournoi_stat');}catch(x){}render();}
});
$('#selPoule').addEventListener('change',function(e){phaseSel=null;poolSel=+e.target.value;try{localStorage.setItem('tournoi_poule',poolSel);}catch(x){}render();});
document.addEventListener('input',function(e){if(e.target.id==='filtre'){filtre=e.target.value;appliquerFiltre();}else if(e.target.id==='statFiltre'){statFiltre=e.target.value;majListeStats();}});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='cacherFinis'){cacherFinis=el.checked;appliquerFiltre();return;}
  if(el.id==='sauvFic'){var fs=el.files&&el.files[0];if(!fs)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);restaurerSauv(d.etat||d,fs.name);}catch(x){toast('Fichier de sauvegarde illisible.');}};rd.readAsText(fs);el.value='';return;}
  if(el.dataset&&el.dataset.sauvopt){try{localStorage.setItem('tournoi_sauv_fichier',el.checked?'1':'0');}catch(x){}return;}
  if(el.id==='fichierVid'){if(el.files&&el.files.length)vidImporter(el.files);el.value='';return;}
  if(el.dataset&&el.dataset.vidassoc!==undefined){var vv=el.value;if(vv)vidAssocierMain(el.dataset.vidassoc,vv==='-'?null:vv);return;}
  if(el.id==='fichierCat'){
    var fc=el.files[0];if(!fc)return;
    fc.arrayBuffer().then(lireXlsx).then(function(rows){
      var g=groupesCatalogue(rows);if(!g.length){toast('Aucun exercice trouvé : vérifiez la colonne C (titre).');return;}
      commit(function(ns){ns.catalogue=rows.map(function(r){return (r||[]).slice(0,9).map(function(c){return c==null?'':String(c);});});}).then(function(ok){if(ok)toast(g.length+' thèmes importés.');});
    }).catch(function(err){toast(err.message||'Lecture impossible.');});
    el.value='';return;
  }
  if(el.id==='fichier'){
    var f=el.files[0];if(!f)return;var nom=f.name.toLowerCase();
    var p;
    if(/\.(xlsx|xlsm)$/.test(nom))p=f.arrayBuffer().then(lireXlsx);
    else if(/\.xls$/.test(nom))p=Promise.reject(new Error('Ancien format .xls non pris en charge : enregistrez le fichier en .xlsx ou .csv.'));
    else p=f.text().then(parseCSV);
    p.then(function(rows){ajouterDepuisLignes(rows,$('#remplacer')&&$('#remplacer').checked);}).catch(function(err){toast(err.message||'Lecture impossible.');});
    el.value='';return;
  }
  if(el.dataset.path){
    var v;
    if(el.type==='checkbox')v=el.checked;
    else if(el.dataset.type==='num'){v=Math.round(Number(el.value));if(isNaN(v))v=0;var mn=el.getAttribute('min'),mx=el.getAttribute('max');if(mn!==null&&mn!=='')v=Math.max(v,Number(mn));if(mx!==null&&mx!=='')v=Math.min(v,Number(mx));}
    else v=el.value;
    var path=el.dataset.path;
    if(path==='tournoi.titre'&&!String(v).trim())v='Tournoi de raquette';
    commit(function(ns){setPath(ns,path,v);if(path==='regles.nbPoules')ns.joueurs.forEach(function(j){if(j.poule>v)j.poule=0;});});
    return;
  }
  if(el.dataset.jid){
    var id=el.dataset.jid,c=el.dataset.champ,val=el.value;
    commit(function(ns){var j=ns.joueurs.find(function(x){return x.id===id;});if(!j)return;
      if(c==='nom'){val=val.trim();if(val)j.nom=val;}else if(c==='niveau'){var n=parseFloat(val);j.niveau=isNaN(n)?j.niveau:n;}else if(c==='genre')j.genre=(val==='F'||val==='G')?val:'';else j.poule=parseInt(val)||0;});
    return;
  }
  if(el.dataset.promo){
    var type=el.dataset.promo,pp=el.dataset.p,n=Math.max(0,Math.min(30,Math.round(Number(el.value))||0));
    commit(function(ns){ns.promo[type][pp]=n;});
  }
});
window.addEventListener('storage',function(e){if(MODE==='local'&&e.key==='tournoi_etat'&&e.newValue){try{S=normaliser(JSON.parse(e.newValue).state);demanderRender();}catch(x){}}});


/* ---------- Plein écran verrouillé ---------- */
var verrou=false;try{verrou=sessionStorage.getItem('tournoi_verrou')==='1';}catch(e){}
function enPleinEcran(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function pleinEcranPossible(){var el=document.documentElement;return !!(el.requestFullscreen||el.webkitRequestFullscreen);}
function demanderPleinEcran(){
  var el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!f)return Promise.reject(new Error('non pris en charge'));
  try{var r=f.call(el);return r&&r.then?r:Promise.resolve();}catch(e){return Promise.reject(e);}
}
function quitterPleinEcran(){try{var f=document.exitFullscreen||document.webkitExitFullscreen;if(f&&enPleinEcran())f.call(document);}catch(e){}}
function majBoutonFS(){var b=$('#fs');if(!b)return;b.textContent=verrou?'🔒':'⛶';b.title=verrou?'Plein écran verrouillé : le code professeur est demandé pour quitter':'Passer en plein écran (verrouillé)';b.setAttribute('aria-label',b.title);}
function setVerrou(v){verrou=v;try{if(v)sessionStorage.setItem('tournoi_verrou','1');else sessionStorage.removeItem('tournoi_verrou');}catch(e){}majBoutonFS();if(!v){var o=$('#verrou');if(o)o.remove();}}
function afficherVerrou(){
  if(!verrou||$('#verrou'))return;
  var v=document.createElement('div');v.id='verrou';
  var libre=enPleinEcran()||!pleinEcranPossible();
  v.innerHTML='<div class="boite" role="dialog" aria-modal="true"><div style="font-size:56px">🔒</div><h2>Mode plein écran</h2>'
   +'<p>'+(enPleinEcran()?'Le plein écran est actif.':'Tu as quitté le plein écran ou la page.')+' Reviens à l\'exercice !</p>'
   +'<button class="btn primaire" id="vReprendre">'+(enPleinEcran()?'↩ Continuer':'⛶ Reprendre le plein écran')+'</button><hr>'
   +'<p>Pour quitter ce mode : code professeur</p><input type="password" id="vCode" inputmode="numeric" autocomplete="off" placeholder="Code"><p class="err" id="vErr"></p>'
   +'<button class="btn" id="vQuitter">Quitter le mode plein écran</button></div>';
  document.body.appendChild(v);
  $('#vReprendre',v).onclick=function(){
    if(enPleinEcran()||!pleinEcranPossible()){v.remove();return;}
    demanderPleinEcran().then(function(){v.remove();}).catch(function(){v.remove();});
  };
  var tenter=function(){
    var c=$('#vCode',v).value.trim();if(!c)return;
    var fin=function(ok){if(ok){setVerrou(false);quitterPleinEcran();toast('Mode plein écran désactivé.');}else{$('#vErr',v).textContent='Code incorrect.';$('#vCode',v).value='';}};
    verifierCode(c).then(fin).catch(function(){fin(c===CODE_LOCAL);});
  };
  $('#vQuitter',v).onclick=tenter;
  $('#vCode',v).addEventListener('keydown',function(e){if(e.key==='Enter')tenter();});
}
function basculerPleinEcran(){
  if(verrou){afficherVerrou();return;}
  setVerrou(true);
  if(pleinEcranPossible())demanderPleinEcran().then(function(){toast('Plein écran verrouillé : le code professeur est demandé pour en sortir.');}).catch(function(){toast('Plein écran refusé par ce navigateur : le verrou reste actif et vous avertit si l\'élève quitte la page.');});
  else toast('Plein écran non pris en charge ici (astuce : « Ajouter à l\'écran d\'accueil »). Le verrou avertit si l\'élève quitte la page.');
}
['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){document.addEventListener(ev,function(){if(verrou&&!enPleinEcran())afficherVerrou();});});
document.addEventListener('visibilitychange',function(){if(verrou&&!document.hidden)afficherVerrou();});
window.addEventListener('beforeunload',function(e){if(verrou){e.preventDefault();e.returnValue='';}});
majBoutonFS();if(verrou)afficherVerrou();

/* ---------- Démarrage ---------- */
PARAM.rerender=render;
chargerCache();
vidCharger().then(function(){if(vidInfo.n&&typeof render==='function'&&MODE)render();});
setSync();
var saved=null;try{saved=localStorage.getItem('tournoi_mode');}catch(e){}
function sansServeur(){
  if((saved==='master'||saved==='slave')&&pcode)demarrerMode(saved);
  else if(saved==='local')demarrerMode('local');
  else MODE=null;
  setSync();render();
}
if(HTTP){
  /* ouverte depuis server.js ? sinon on propose maître / élève */
  app.innerHTML='<div class="carte attente"><p class="muted">Connexion…</p></div>';
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort();},2500);
  fetch('/api/state',{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){clearTimeout(tm);if(!r.ok)throw 0;return r.json();})
    .then(function(d){if(!d||typeof d.ver!=='number')throw 0;return d;})
    .then(function(){MODE='server';setSync(false);render();connecter();},function(){sansServeur();});
}else sansServeur();
})();
</script>
