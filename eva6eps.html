<body>
<header id="top">
  <div class="titre-zone"><h1 id="titre">Éval. 6e EPS</h1></div>
  <nav><button data-v="classes">🏠 Classes</button><button data-v="saisie">📝 Saisie des résultats</button><button data-v="bilan">🧾 Bilan et coupons</button><button data-v="bareme">📏 Barème officiel</button><button data-v="sauv">💾 Sauvegardes</button><button data-v="param">🎨 Paramètres application</button></nav>
</header>

<script id="core">
/* ----- Noyau : barème officiel des aptitudes physiques de début de sixième ----- */
var NIV_NOMS=['À besoins','Fragile','Satisfaisant'];
function uid(p){return (p||'i')+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);}
function cfgDefaut(){
  return {titre:'ÉVALUATION NATIONALE · APTITUDES PHYSIQUES',sm:['🔴','🟠','🟢'],niv:NIV_NOMS.slice(),imprCom:true,ll:{v0:8,inc:0.5,dur:60},
    lectures:['Niveau de maîtrise insuffisant : un accompagnement est nécessaire dès le début de l’année.','Aptitude à renforcer.','Les prérequis permettent de poursuivre sereinement les apprentissages.'],
    tests:[
     {id:'ll',vis:true,titre:'Endurance',nom:'Test Luc Léger',unit:'paliers',mode:'ge',s:[2,4],
      proto:'Allers-retours sur 20 m en suivant le rythme de signaux sonores. Départ à 8,5 km/h, la vitesse augmente de 0,5 km/h chaque minute ; on s’arrête quand on ne suit plus le rythme. Résultat : nombre de paliers réalisés.',
      note:'Paliers 0-1 : jusqu’à 4 min (vitesse finale 8 à 9 km/h) · paliers 2-3 : 4 à 6 min (9 à 10 km/h) · palier 4 et plus : plus de 6 min (plus de 10 km/h).'},
     {id:'saut',vis:true,titre:'Force musculaire',nom:'Saut en longueur sans élan',unit:'cm',mode:'gt',essais:2,s:[110,140],
      proto:'Sauter à pieds joints le plus loin possible, sans élan, en s’immobilisant à la réception. Mesure de la ligne de départ à l’arrière du pied le plus proche de la ligne.',note:''},
     {id:'v30',vis:true,titre:'Vitesse',nom:'30 m plat',unit:'s',mode:'le',essais:2,s:[6.8,6.0],
      proto:'Parcourir 30 m le plus vite possible, départ arrêté. Le chronomètre démarre quand le pied d’appui arrière quitte le sol.',note:''}
    ]};
}
function etatInitial(){return {v:1,classes:[],cur:null,cfg:cfgDefaut()};}
function numD(v){if(v==null)return null;var s=String(v).trim().replace(',','.');if(s===''||/^ne$/i.test(s))return null;var n=Number(s);return isFinite(n)?n:null;}
function estNE(v){return /^(ne|abs|nc)$/i.test(String(v==null?'':v).trim());}
/* niveau 0 À besoins · 1 Fragile · 2 Satisfaisant ; null si pas de mesure */
function nivTest(t,v){
  v=numD(v);if(v==null)return null;var a=t.s[0],b=t.s[1];
  if(t.mode==='ge')return v<a?0:v<b?1:2;
  if(t.mode==='gt')return v<=a?0:v<=b?1:2;
  return v>=a?0:v>=b?1:2; /* 'le' : plus c'est bas, mieux c'est */
}
function fmtN(x){return String(Math.round(x*100)/100).replace('.',',');}
function bandesTest(t){ /* libellés du barème, un par niveau */
  var a=fmtN(t.s[0]),b=fmtN(t.s[1]),u=t.unit==='paliers'?'':' '+t.unit;
  if(t.mode==='ge')return ['moins de '+a+' paliers','de '+a+' à moins de '+b+' paliers',b+' paliers ou plus'];
  if(t.mode==='gt')return ['≤ '+a+u,'> '+a+' et ≤ '+b+u,'> '+b+u];
  return ['≥ '+a+u,'≥ '+b+' et < '+a+u,'< '+b+u];
}
function valTxt(t,v){if(estNE(v))return 'NE';var n=numD(v);return n==null?'—':fmtN(n)+(t.unit==='paliers'?'':' '+t.unit);}
/* performance retenue : meilleure des 2 tentatives (saut : le plus long ; 30 m : le plus court) */
function perf(t,nt){
  if(!t.essais)return nt[t.id];
  var a=[nt[t.id+'1'],nt[t.id+'2']],nums=a.map(numD).filter(function(x){return x!=null;});
  if(nums.length)return t.mode==='le'?Math.min.apply(null,nums):Math.max.apply(null,nums);
  if(a.some(estNE))return 'NE';
  return nt[t.id]!=null?nt[t.id]:undefined;
}
function evalEleve(note,cfg){
  note=note||{};var o={};
  cfg.tests.forEach(function(t){var p=perf(t,note);o[t.id]=estNE(p)?-1:nivTest(t,p);});
  return o;
}
function triAlpha(L){return L.slice().sort(function(a,b){return String(a.nom).localeCompare(String(b.nom),'fr',{sensitivity:'base'});});}
function splitNom(nom){
  var t=String(nom||'').trim().split(/\s+/),i=0;
  while(i<t.length-1&&t[i]===t[i].toUpperCase()&&/[A-ZÀ-Ý]/.test(t[i]))i++;
  if(i===0&&t.length>1)i=1;
  return {nom:t.slice(0,i).join(' '),prenom:t.slice(i).join(' ')};
}
function statLib(s){return s==='absent'?'Absent':s==='inapte'?'Inapte / non évaluable':s==='infirmerie'?'Infirmerie':s==='vs'?'Vie scolaire':'';}
/* lignes d'un tableau (xlsx, csv, collage) → [{nom, vals:{ll,saut,v30}}] */
function essaiNo(s){var t=String(s).replace(/30/g,'');if(/(^|[^0-9])2([^0-9]|$)|deuxi|second/.test(t))return 2;if(/(^|[^0-9])1([^0-9]|$)|premi/.test(t))return 1;return 0;}
function lireTableau(rows){
  var hi=-1,col={};
  for(var i=0;i<Math.min(rows.length,8);i++){
    var r=rows[i]||[],tmp={};
    r.forEach(function(c,k){var s=String(c||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
      if(/^(nom|eleves?|identite)/.test(s)&&tmp.nom==null)tmp.nom=k;
      else if(/^prenom/.test(s))tmp.prenom=k;
      else if(/temps|\(s\)|secondes?/.test(s)&&/palier|luc|leger|endurance/.test(s)&&tmp.llt==null)tmp.llt=k;
      else if(/luc|leger|endurance|palier/.test(s)&&tmp.ll==null)tmp.ll=k;
      else if(/saut|longueur|force/.test(s)){var e1=essaiNo(s);if(e1===2&&tmp.saut2==null)tmp.saut2=k;else if(e1===1&&tmp.saut1==null)tmp.saut1=k;else if(tmp.saut1==null)tmp.saut1=k;else if(tmp.saut2==null)tmp.saut2=k;}
      else if(/30|vitesse|course/.test(s)){var e2=essaiNo(s);if(e2===2&&tmp.v302==null)tmp.v302=k;else if(e2===1&&tmp.v301==null)tmp.v301=k;else if(tmp.v301==null)tmp.v301=k;else if(tmp.v302==null)tmp.v302=k;}});
    if(tmp.ll!=null||tmp.saut1!=null||tmp.v301!=null){hi=i;col=tmp;break;}
  }
  if(hi<0)return [];
  if(col.nom==null)col.nom=0;
  var out=[];
  for(var q=hi+1;q<rows.length;q++){
    var r2=rows[q]||[],nom=String(r2[col.nom]||'').trim();if(col.prenom!=null)nom=(nom+' '+String(r2[col.prenom]||'').trim()).trim();
    if(!nom||/^[=#]/.test(nom))continue;
    var g=function(k){return k==null?null:r2[k];},vals={};
    ['ll','llt','saut1','saut2','v301','v302'].forEach(function(id){var v=g(col[id]);if(v==null||String(v).trim()==='')return;vals[id]=estNE(v)?'NE':numD(v);if(vals[id]==null)delete vals[id];});
    out.push({nom:nom,vals:vals});
  }
  return out;
}
function lireTexte(tx){
  var sep=tx.indexOf('\t')>=0?'\t':(tx.indexOf(';')>=0?';':',');
  return tx.split(/\r?\n/).filter(function(l){return l.trim();}).map(function(l){return l.split(sep).map(function(c){return c.trim();});});
}
function tsvBilan(cl,cfg){
  var L=triAlpha(cl.eleves),vis=cfg.tests.filter(function(t){return t.vis;}),H=['Élève'],hdr=[];
  vis.forEach(function(t){
    if(t.essais)H.push(t.nom+' essai 1 ('+t.unit+')',t.nom+' essai 2 ('+t.unit+')',t.nom+' meilleur ('+t.unit+')');
    else{H.push(t.nom+' ('+t.unit+')');if(t.id==='ll')H.push('Temps dans le palier (s)','VMA estimée (km/h)');}
    H.push(t.titre+' · groupe');});
  H.push('Commentaire');var lines=[H.join('\t')],cell=function(v){return v==null?'':estNE(v)?'NE':numD(v)==null?'':numD(v);};
  L.forEach(function(el){var nt=cl.notes[el.id]||{},e=evalEleve(nt,cfg),st=nt.st,r=[el.nom];
    vis.forEach(function(t){
      if(t.essais){var b=perf(t,nt);r.push(st?'':cell(nt[t.id+'1']),st?'':cell(nt[t.id+'2']),st?'':cell(b));}
      else{r.push(st?'':cell(nt[t.id]));if(t.id==='ll'){var v=vmaLL(nt.ll,nt.llt,cfg);r.push(st?'':cell(nt.llt),st?'':(v==null?'':v));}}
      var n=e[t.id];r.push(st?statLib(st):n==null?'':n<0?'Non évalué':cfg.niv[n]);});
    r.push(nt.com||'');lines.push(r.join('\t'));});
  return lines.join('\n');
}
/* ----- Estimation de la VMA à partir du test Luc Léger -----
   vitesse du palier p = v0 + inc × p (palier 0 = 8 km/h, palier 1 = 8,5 km/h… ; +0,5 km/h par palier de 60 s).
   Palier = dernier palier atteint ; t = secondes tenues dans ce palier.
   Sans temps saisi, le palier est considéré comme terminé. */
function vmaLL(p,t,cfg){
  p=numD(p);if(p==null||p<0)return null;
  var q=(cfg&&cfg.ll)||{v0:8,inc:0.5,dur:60},tt=numD(t),v;
  if(tt==null)v=q.v0+q.inc*p;
  else{tt=Math.max(0,Math.min(tt,q.dur));v=p<1?q.v0+q.inc*p*tt/q.dur:q.v0+q.inc*(p-1)+q.inc*tt/q.dur;}
  return Math.round(v*10)/10;
}
function vmaTxt(v){return v==null?'—':String(v).replace('.',',')+' km/h';}

async function lireXlsx(buf){

    files[name]={method:method,csize:csize,lho:lho};p+=46+nl+el+cl;
  }
  async function get(name){
    var f=files[name];if(!f)return null;
    var lnl=dv.getUint16(f.lho+26,true),lel=dv.getUint16(f.lho+28,true),start=f.lho+30+lnl+lel;
    var data=u8.subarray(start,start+f.csize);
    if(f.method===0)return new TextDecoder().decode(data);
    if(typeof DecompressionStream==='undefined')throw new Error('Ce navigateur ne sait pas ouvrir .xlsx : enregistrez en .csv ou collez le texte.');
    var s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new TextDecoder().decode(await new Response(s).arrayBuffer());

  var xml=function(t){return new DOMParser().parseFromString(t,'application/xml');};
  var shared=[];var ss=await get('xl/sharedStrings.xml');
  if(ss){xml(ss).querySelectorAll('si').forEach(function(si){var t='';si.querySelectorAll('t').forEach(function(x){t+=x.textContent;});shared.push(t);});}
  var sheets=Object.keys(files).filter(function(k){return /^xl\/worksheets\/sheet\d+\.xml$/.test(k);}).sort(function(a,b){return parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]);});
  if(!sheets.length)throw new Error('Aucune feuille trouvée dans le fichier');
  var wbx=await get('xl/workbook.xml'),rel=await get('xl/_rels/workbook.xml.rels'),noms=[];
  if(wbx){var rmap={};if(rel)xml(rel).querySelectorAll('Relationship').forEach(function(r){rmap[r.getAttribute('Id')]='xl/'+String(r.getAttribute('Target')).replace(/^\/?(xl\/)?/,'');});
    xml(wbx).querySelectorAll('sheet').forEach(function(s){var rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');noms.push({nom:s.getAttribute('name'),path:rmap[rid]});});}

  doc.querySelectorAll('row').forEach(function(rw){
    var r=[];
    rw.querySelectorAll('c').forEach(function(c){
      var ref=c.getAttribute('r')||'',m=ref.match(/^([A-Z]+)/),col=0;
      if(m){for(var k=0;k<m[1].length;k++)col=col*26+(m[1].charCodeAt(k)-64);col--;}else col=r.length;

function sauvTelecharger(o){
  try{var z=function(n){return (n<10?'0':'')+n;},d=new Date(o.t),nm='Eval-6e_sauvegarde_'+jourFic(d)+'_'+z(d.getHours())+'h'+z(d.getMinutes())+'.json';
    var bl=new Blob([JSON.stringify({eva6eps:1,t:o.t,motif:o.motif,etat:o.etat})],{type:'application/json'}),u=URL.createObjectURL(bl),a=document.createElement('a');
    a.href=u;a.download=nm;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u);},1500);}catch(e){}
}
function sauvPartager(o){
  var z=function(n){return (n<10?'0':'')+n;},d=new Date(o.t),nm='Eval-6e_sauvegarde_'+jourFic(d)+'_'+z(d.getHours())+'h'+z(d.getMinutes())+'.json',
    bl=new Blob([JSON.stringify({eva6eps:1,t:o.t,motif:o.motif,etat:o.etat})],{type:'application/json'});
  try{var f=new File([bl],nm,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:nm}).catch(function(err){if(err&&err.name==='AbortError')return;toast('Le partage a été refusé par ce navigateur : le fichier est téléchargé à la place.');sauvTelecharger(o);});return;}}catch(e){}
  sauvTelecharger(o);toast('Partage indisponible sur ce navigateur : le fichier a été téléchargé.');
}
function sauvPartagerMaintenant(i){
  var a=sauvLire(),o=(i==null||i==='')?null:a[+i];
  if(!o){if(!sauvegarderAuto('Partage de la sauvegarde',true)&&false)return;a=sauvLire();o=a[a.length-1];}
  if(o)sauvPartager(o);
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
function sauvegarderAuto(motif,sansFichier){
  var o={t:Date.now(),motif:motif,etat:JSON.parse(JSON.stringify(S))},a=sauvLire();a.push(o);a=a.slice(-6);
  var ok=false;while(a.length){try{localStorage.setItem('ev6_sauv',JSON.stringify(a));ok=true;break;}catch(e){a.shift();}}
  if(!sansFichier&&sauvFichierOn())sauvTelecharger(o);
  if(!ok)toast('Sauvegarde interne impossible (mémoire pleine) : utilisez le fichier téléchargé.');
}

  var L=triAlpha(c.eleves).filter(function(el){var nt=c.notes[el.id]||{};return !nt.st&&(!ids||ids.indexOf(el.id)>=0);});
  if(!L.length){toast('Aucun coupon à imprimer (élèves absents ou non sélectionnés).');return;}
  sauvegarderAuto('Impression des coupons · '+c.nom);
  var old=$('#impr');if(old)old.remove();
  var d=document.createElement('div');d.id='impr';d.className=fmtImpr;
  d.innerHTML=L.map(function(el){return pagesEleve(c,el);}).join('');
  document.body.appendChild(d);
  var fin=function(){window.removeEventListener('afterprint',fin);if(d.parentNode)d.remove();};
  window.addEventListener('afterprint',fin);setTimeout(function(){window.print();},80);
}
/* ---------- Import ---------- */
function cleNom(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]+/g,' ').trim();}
function setPerf(nt,f,v){var tv=String(v==null?'':v).trim();if(tv===''){delete nt[f];return true;}if(estNE(tv)){nt[f]='NE';return true;}var q=numD(tv);if(q==null)return false;nt[f]=q;return true;}
document.addEventListener('paste',function(e){ /* collage d'un bloc Excel dans le tableau de saisie */
  var el=e.target,c=cl();if(!c||!el||el.dataset.t===undefined)return;
  var tx=(e.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(tx.replace(/[\r\n]+$/,'')))return;
  e.preventDefault();
  var trs=[].slice.call(app.querySelectorAll('tbody tr[data-id]')),tr0=el.closest('tr'),r0=trs.indexOf(tr0);if(r0<0)return;
  var c0=[].slice.call(tr0.querySelectorAll('input[data-t]')).indexOf(el),lines=tx.replace(/[\r\n]+$/,'').split(/\r?\n/),n=0,bad=0;
  lines.forEach(function(l,i){var tr=trs[r0+i];if(!tr)return;var pe=c.eleves.find(function(x){return x.id===tr.dataset.id;}),ins=tr.querySelectorAll('input[data-t]'),nt=c.notes[pe.id]=c.notes[pe.id]||{};
    l.split('\t').forEach(function(v,j){var inp=ins[c0+j];if(!inp)return;if(setPerf(nt,inp.dataset.t,v)){inp.value=nt[inp.dataset.t]==null?'':nt[inp.dataset.t];n++;}else bad++;});
    majLigne(tr,c,pe);});
  sauver();toast(n+' valeur'+(n>1?'s':'')+' collée'+(n>1?'s':'')+(bad?' ('+bad+' ignorée'+(bad>1?'s':'')+')':'')+'.');
});
function appliquer(c,data){
  var n=0,nv=0;
  data.forEach(function(d){
    var el=c.eleves.find(function(x){return cleNom(x.nom)===cleNom(d.nom);});
    if(!el){el={id:uid('e'),nom:d.nom};c.eleves.push(el);nv++;}
    var nt=c.notes[el.id]=c.notes[el.id]||{};Object.keys(d.vals).forEach(function(k){nt[k]=d.vals[k];});n++;});
  return {n:n,nv:nv};
}
function importerRows(F,versClasse){
  F=F.filter(function(f){return f.data.length;});
  if(!F.length){toast('Aucune colonne reconnue (Nom, Luc Léger, Saut, 30 m).');return;}
  var corps='<p>Feuilles trouvées :</p>'+F.map(function(f,i){return '<label style="display:block;margin:4px 0"><input type="'+(versClasse?'radio':'checkbox')+'" name="fs" value="'+i+'"'+(versClasse?(i===0?' checked':''):' checked')+'> <b>'+esc(f.nom)+'</b> <small>('+f.data.length+' élèves)</small></label>';}).join('')
    +(versClasse?'<p class="note">Appliqué à la classe ouverte (élèves reconnus par leur nom, les autres sont ajoutés).</p>':'<p class="note">Une classe est créée par feuille cochée.</p>');
  dialogue('Importer',corps,[{label:'Annuler',val:false},{label:'Importer',val:true,cls:'primaire'}]).then(function(r){
    if(r.val!==true)return;
    var ch=[].slice.call(r.root.querySelectorAll('input[name=fs]:checked')).map(function(x){return F[+x.value];});
    if(!ch.length)return;
    if(versClasse){var a=appliquer(cl(),ch[0].data);sauver();render();toast(a.n+' élèves mis à jour'+(a.nv?' dont '+a.nv+' ajouté'+(a.nv>1?'s':''):'')+'.');return;}
    ch.forEach(function(f){var c={id:uid('c'),nom:f.nom,date:Date.now(),evalDate:Date.now(),eleves:[],notes:{}};appliquer(c,f.data);S.classes.push(c);S.cur=c.id;});
    sauver();vue='saisie';render();toast(ch.length+' classe'+(ch.length>1?'s':'')+' importée'+(ch.length>1?'s':'')+'.');
  });
}
function importerXlsx(file,versClasse){
  file.arrayBuffer().then(lireXlsx).then(function(feuilles){
    var F=feuilles.map(function(f){return {nom:f.nom,data:lireTableau(f.rows)};});
    /* le fichier de la DEPP a 3 onglets : on met en premier celui des performances */
    F.sort(function(a,b){return (/perf/i.test(b.nom)?1:0)-(/perf/i.test(a.nom)?1:0);});
    importerRows(F,versClasse);
  }).catch(function(e){toast(e&&e.message?e.message:'Fichier illisible.');});
}
function collage(versClasse){
  dialogue('Coller depuis Excel','<p class="muted">Collez un tableau avec une ligne d\'en-têtes (Nom, Prénom, Luc Léger, Saut, 30 m) puis les élèves.</p><textarea id="colTx" style="width:100%;height:200px"></textarea>',[{label:'Annuler',val:false},{label:'Lire',val:true,cls:'primaire'}]).then(function(r){
    if(r.val!==true)return;var d=lireTableau(lireTexte($('#colTx',r.root).value));
    importerRows([{nom:versClasse?'Collage':'Classe collée',data:d}],versClasse);});
}
/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,c=cl();
  if(a==='vue'){vue=b.dataset.v;render();}
  else if(a==='ouvrir'){S.cur=b.dataset.id;sauver();vue='saisie';render();}
  else if(a==='collage')collage(false);
  else if(a==='collageCl')collage(true);
  else if(a==='nouvelleClasse'){dialogue('Nouvelle classe','<div class="champ"><label>Nom de la classe</label><input type="text" id="nc" placeholder="6B 2026"></div>',[{label:'Annuler',val:false},{label:'Créer',val:true,cls:'primaire'}]).then(function(r){if(r.val!==true)return;var nm=($('#nc',r.root).value||'').trim()||'Nouvelle classe';var k={id:uid('c'),nom:nm,date:Date.now(),evalDate:Date.now(),eleves:[],notes:{}};S.classes.push(k);S.cur=k.id;sauver();render();});}
  else if(a==='renomme'){var k=S.classes.find(function(x){return x.id===b.dataset.id;});if(!k)return;dialogue('Renommer la classe','<div class="champ"><input type="text" id="nc" value="'+esc(k.nom)+'"></div>',[{label:'Annuler',val:false},{label:'Enregistrer',val:true,cls:'primaire'}]).then(function(r){if(r.val===true){k.nom=($('#nc',r.root).value||'').trim()||k.nom;sauver();render();}});}
  else if(a==='suppr'){var k2=S.classes.find(function(x){return x.id===b.dataset.id;});if(k2)confirmer('Supprimer « '+esc(k2.nom)+' » ?','La classe et toutes ses évaluations seront supprimées.','Supprimer',true).then(function(ok){if(ok){S.classes=S.classes.filter(function(x){return x!==k2;});if(S.cur===k2.id)S.cur=S.classes.length?S.classes[0].id:null;sauver();render();}});}
  else if(a==='ajoutEleve'&&c){var nm=($('#addNom').value||'').trim();if(!nm){toast('Saisissez un nom.');return;}c.eleves.push({id:uid('e'),nom:nm,vma:numD($('#addVma').value)||0});sauver();render();toast('Élève ajouté.');}
  else if(a==='imprTous'&&c)imprimer(c,null);
  else if(a==='imprUn'&&c)imprimer(c,[b.dataset.id]);
  else if(a==='copierTsv'&&c){var tx=tsvBilan(c,S.cfg);(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(tx):Promise.reject()).then(function(){toast('Bilan copié : collez-le dans un tableur.');}).catch(function(){dialogue('Bilan à copier','<textarea style="width:100%;height:240px" readonly>'+esc(tx)+'</textarea>',[{label:'Fermer',val:true,cls:'primaire'}]);});}
  else if(a==='razBareme'){confirmer('Remettre le barème officiel ?','Vos modifications de seuils et de textes seront perdues.','Remettre',true).then(function(ok){if(ok){S.cfg=cfgDefaut();sauver();render();}});}
  else if(a==='sauvMaint'){sauvegarderAuto('Sauvegarde manuelle');toast('Sauvegarde faite.');render();}
  else if(a==='sauvShare'){sauvPartagerMaintenant(b.dataset.i);}
  else if(a==='sauvDl'){var so=sauvLire()[+b.dataset.i];if(so)sauvTelecharger(so);}
  else if(a==='sauvRest'){var sr=sauvLire()[+b.dataset.i];if(sr)restaurer(sr.etat,dtJour(sr.t)+' · '+(sr.motif||''));}
});
function restaurer(etat,lib){
  confirmer('Restaurer cette sauvegarde ?','Tout l\'état actuel sera <b>remplacé</b> par « '+esc(lib)+' ». Une sauvegarde de l\'état actuel est faite avant.','Restaurer',true).then(function(ok){
    if(!ok)return;sauvegarderAuto('Avant restauration');
    if(!etat||!Array.isArray(etat.classes)){toast('Sauvegarde invalide.');return;}
    S=etat;normCfg();sauver();render();toast('Sauvegarde restaurée.');});
}
document.addEventListener('change',function(e){
  var el=e.target,c=cl();
  if(el.id==='fxlsx'){if(el.files[0])importerXlsx(el.files[0],false);el.value='';return;}
  if(el.id==='fxlsxCl'){if(el.files[0])importerXlsx(el.files[0],true);el.value='';return;}
  if(el.id==='fmtImpr'){fmtImpr=el.value;return;}
  if(el.id==='sauvFic'){var fs=el.files&&el.files[0];if(!fs)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);restaurer(d.etat||d,fs.name);}catch(x){toast('Fichier de sauvegarde illisible.');}};rd.readAsText(fs);el.value='';return;}
  if(el.dataset.sauvopt){try{localStorage.setItem('ev6_sauv_fichier',el.checked?'1':'0');}catch(x){}return;}
  if(el.dataset.f==='evalDate'&&c){var t=new Date(el.value+'T12:00:00').getTime();if(t>0){c.evalDate=t;sauver();}return;}
  var tr=el.closest&&el.closest('tr[data-id]');
  if(tr&&c&&(el.dataset.f||el.dataset.t)){
    var pe=c.eleves.find(function(x){return x.id===tr.dataset.id;});if(!pe)return;var nt=c.notes[pe.id]=c.notes[pe.id]||{},v=el.value;
    if(el.dataset.t){if(!setPerf(nt,el.dataset.t,v)){toast('Valeur non numérique : tapez un nombre ou NE.');el.value=nt[el.dataset.t]==null?'':nt[el.dataset.t];return;}}
    else if(el.dataset.f==='st'){if(v)nt.st=v;else delete nt.st;}
    else if(el.dataset.f==='com'){nt.com=v;}
    sauver();majLigne(tr,c,pe);return;
  }
  if(el.dataset.imprcom){S.cfg.imprCom=el.checked;sauver();return;}
  if(el.dataset.vis){var k=S.cfg.tests.find(function(x){return x.id===el.dataset.vis;});if(k){k.vis=el.checked;sauver();}return;}
  if(el.dataset.seuil!==undefined){var n=numD(el.value);if(n!=null){S.cfg.tests[+el.dataset.seuil].s[+el.dataset.i]=n;sauver();render();}return;}
  if(el.dataset.titre){S.cfg.titre=el.value.trim()||cfgDefaut().titre;sauver();return;}
  if(el.dataset.llp){var nq=numD(el.value);if(nq!=null&&nq>0){S.cfg.ll[el.dataset.llp]=nq;sauver();render();}return;}
  if(el.dataset.lect!==undefined){S.cfg.lectures[+el.dataset.lect]=el.value;sauver();return;}
  if(el.dataset.proto!==undefined){S.cfg.tests[+el.dataset.proto].proto=el.value;sauver();return;}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='addNom'){var b=$('[data-act=ajoutEleve]');if(b)b.click();}});
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){vue=b.dataset.v;render();});});
charger();if(!cl()&&S.classes.length)S.cur=S.classes[0].id;
PARAM.rerender=render;
render();
})();
</script>
