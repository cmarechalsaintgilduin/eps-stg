<style>
:root{--bg:#f3f5f8;--carte:#fff;--encre:#14213d;--muted:#5b6b80;--accent:#c0362c;--accent2:#1f6f8b;--ok:#2e8b57;--bord:#d9dee4;--tint:#eef1f4}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--encre)}
button,input,select,textarea{font:inherit;color:inherit}
header#top{position:sticky;top:0;z-index:20;background:var(--encre);color:#fff;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 16px}
#cr{flex:0 0 calc(100% + 32px);margin:-10px -16px 0;background:#0b1730;color:#e8eef9;font:600 12px/1.2 system-ui,Segoe UI,Arial,sans-serif;letter-spacing:.04em;text-align:center;padding:4px 8px;border-bottom:1px solid #243457;user-select:none;-webkit-user-select:none;pointer-events:none}
h1{font:700 22px/1.2 Cambria,Georgia,serif;margin:0}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;min-height:42px}
nav button.on{background:#fff;color:var(--encre);border-color:#fff;font-weight:600}
main{padding:16px;max-width:1500px;margin:0 auto}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.carte h2{margin:0 0 6px;font:700 19px/1.2 Cambria,Georgia,serif}.carte h3{margin:14px 0 6px;font-size:16px}
.muted,small{color:var(--muted)}
.btn{border:1px solid var(--bord);background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:42px}
.btn:hover{background:var(--tint)}.btn.primaire{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
.btn.danger{border-color:var(--accent);color:var(--accent)}.btn.petit{padding:5px 10px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.ligne{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.champ label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.champ input,.champ select,.champ textarea{width:100%;padding:8px 10px;border:1px solid var(--bord);border-radius:8px;background:#fff}
.warn{background:#fff6dc;border:1px solid #f0d58a;border-radius:10px;padding:8px 12px;margin:8px 0}
.note{background:var(--tint);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.niv{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.niv.n0{background:#f9dcd8;color:#a02a20}.niv.n1{background:#fde8c8;color:#8a5200}.niv.n2{background:#d6e9f7;color:#1c4f7a}.niv.n3{background:#d8f0e1;color:#1b6b3a}.niv.nx{background:var(--tint);color:var(--muted)}.niv.nj{background:#fff3a8;color:#6b5a00}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border:1px solid var(--bord);padding:5px 7px;text-align:center;vertical-align:middle}
table.t th{background:var(--tint);position:sticky;top:0;z-index:2;font-size:13px}
table.t td.nom,table.t th.nom{text-align:left;font-weight:600;white-space:nowrap}
table.t input[type=text],table.t input:not([type]),table.t select,table.t textarea{padding:5px 6px;border:1px solid var(--bord);border-radius:6px;background:#fff;max-width:100%}
table.t input.num{width:64px;text-align:center}
table.t td.com input{width:200px}
tr.gris-l td{background:repeating-linear-gradient(45deg,#f3f5f8,#f3f5f8 6px,#e9edf2 6px,#e9edf2 12px);color:var(--muted)}
tr.gris-l input,tr.gris-l select{opacity:.55}
select.sn0{background:#f9dcd8}select.sn1{background:#fde8c8}select.sn2{background:#d6e9f7}select.sn3{background:#d8f0e1}select.sn-1{background:#e4e7ec}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.kpi{background:var(--tint);border-radius:10px;padding:8px 14px;min-width:120px}.kpi b{display:block;font:700 22px/1.1 Cambria,Georgia,serif}.kpi span{font-size:12px;color:var(--muted)}
.barre{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--tint)}.barre i{display:block}
.b0{background:#e5877d}.b1{background:#f2b560}.b2{background:#6fb1e2}.b3{background:#5fbf86}

  <div class="titre-zone"><h1 id="titre">Demi-fond</h1></div>
  <nav><button data-v="classes">🏠 Classes</button><button data-v="saisie">📝 Saisie évaluation papier</button><button data-v="bilan">🧾 Bilan et coupons</button><button data-v="bareme">📏 Barèmes et textes</button><button data-v="sauv">💾 Sauvegardes</button><button data-v="param">🎨 Paramètres application</button></nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<script id="core">
/* ----- Noyau : calculs purs (testables) ----- */
var NIV_NOMS=['Insuffisant','Fragile','Satisfaisant','Très bonne maîtrise'];
function uid(p){return (p||'i')+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);}
function cfgDefaut(){
  return {plots:12,bareme:[-11.5,-7.5,-3.5,4,8,12],sm:['☹️','😐','🙂','😄'],niv:NIV_NOMS.slice(),titre:'DEMI–FOND',
    comp:[
     {id:'tech',titre:'Technique',vis:true,dom:'D1.d : Acquérir des techniques spécifiques',en:'Je suis capable de courir l’ensemble des créneaux sans m’arrêter.',niv:[
       ['Coureur intermittent','Je n\'arrive pas à adapter mon allure de course en fonction du temps à réaliser. Je fatigue vite et je m\'arrête souvent pour récupérer (- de 20 points carrosserie)'],
       ['Coureur pressé','Je pars souvent trop vite et ralentis ensuite sur les créneaux suivants. Je m\'arrête encore régulièrement (- de 29 points carrosserie)'],
       ['Coureur sérieux','Je pars à une allure qui me permet de tenir presque tous les créneaux (- de 34 points carrosserie)'],
       ['Coureur endurant','Je vais à une allure qui me permet de courir l\'ensemble des créneaux sans m\'arrêter (34 points carrosserie).']]},
     {id:'strat',titre:'Stratégie',vis:true,dom:'D1.3 : Mobiliser différentes ressources',en:'Je suis capable de courir à une allure adaptée en fonction du temps de course à effectuer : 3’ à 100%, 6’ à 90% et 9’ à 80% de sa VMA.',niv:[
       ['Coureur inadapté','Les allures de course sont inadaptées. Le coureur est trop lent ou trop rapide par rapport à sa VMA.'],
       ['Coureur alternatif','Le coureur a des difficultés à conserver une allure régulière et adaptée au temps de course en fonction de sa VMA.'],
       ['Coureur cohérent','Le coureur parvient à respecter des allures cohérentes par rapport à sa VMA, avec deux allures bien distinctes et une vitesse moyenne correspondant à au moins 87% de sa VMA.'],
       ['Coureur efficace','Le coureur parvient à courir à des allures adaptées et celles-ci sont supérieures aux allures de base. Trois allures distinctes. Allure moyenne supérieure à 100% de sa VMA.']]},
     {id:'proj',titre:'Projet',vis:true,auto:true,dom:'D2 : Élaborer un projet individuel',en:'Je suis capable de respecter mon projet de course entre 4 et 7 plots sur l’ensemble des créneaux (3’, 6’, 9’).',niv:[
       ['Projet incohérent','+ de 12 plots d’écart entre le projet annoncé et celui réalisé.'],
       ['Projet inadapté','Entre 8 et 11 plots d\'écart entre le projet annoncé et celui réalisé.'],
       ['Projet cohérent','Entre 4 et 7 plots d\'écart entre le projet annoncé et celui réalisé.'],
       ['Projet précis','3 plots ou moins d\'écart entre le projet annoncé et celui réalisé.']]},
     {id:'regles',titre:'Règles',vis:true,dom:'D3 : Être un bon sportif (fair play, construction et respect des règles, des autres et du matériel)',en:'J’ai ma tenue, je suis à l\'heure, je me mets en rang, je suis attentif lors des regroupements et applique les consignes données. Je suis investi et respecte bien le protocole et le matériel.',niv:[
       ['Le désinvesti','J’oublie souvent ma tenue, je sors souvent en retard des vestiaires, je bavarde souvent pendant les regroupements de classe et ne donne pas mon maximum. Je ne me mets jamais en rang et ne respecte pas le matériel.'],
       ['L’inconstant','Quelques fois j’oublie ma tenue, sors en retard des vestiaires, bavarde pendant les regroupements de classe et ne m\'investis pas à tous les cours. Je suis rarement en rang.'],
       ['L’impliqué','J’ai ma tenue, je suis à l\'heure, je me mets en rang, je suis attentif lors des regroupements et applique les consignes données. Je suis investi et respecte bien le protocole et le matériel.'],
       ['Le moteur','J’ai ma tenue, je suis à l’heure, je me mets en rang, je suis attentif lors des regroupements et applique les consignes données. Je suis investi et respecte bien le protocole et le matériel. Je suis moteur pour la classe et mon groupe.']]}
    ]};
}
function etatInitial(){return {v:1,classes:[],cur:null,cfg:cfgDefaut()};}
function numD(v){if(v==null)return null;var s=String(v).trim().replace(',','.');if(s==='')return null;var n=Number(s);return isFinite(n)?n:null;}
/* code du tableur (i, f, s, ts) ou texte → 0..3, -1 = non évalué, null = à saisir */
function codeNiv(v){
  var s=String(v==null?'':v).trim().toLowerCase();
  if(s==='')return null;
  if(s==='i'||/^insuff/.test(s)||s==='☹️'||s==='☹')return 0;
  if(s==='f'||/^fragile/.test(s)||s==='😐')return 1;
  if(s==='s'||/^satisf/.test(s)||s==='🙂')return 2;
  if(s==='ts'||/^tr[eè]s/.test(s)||s==='😄')return 3;
  if(/^(ne|non [eé]valu)/.test(s))return -1;
  return null;
}
function nivProjet(ecart,cfg){
  if(ecart==null)return null;var t=(cfg&&cfg.bareme)||cfgDefaut().bareme;
  if(ecart<t[0])return 0;if(ecart<t[1])return 1;if(ecart<t[2])return 2;if(ecart<t[3])return 3;if(ecart<t[4])return 2;if(ecart<t[5])return 1;return 0;
}
function pctVMA(el,note,cfg){var r=numD(note&&note.real),v=numD(el&&el.vma);if(r==null||!(v>0))return null;return r/((cfg&&cfg.plots)||12)/v*100;}
function evalEleve(el,note,cfg){
  note=note||{};var o={};
  o.vma=numD(el.vma);o.proj=numD(note.proj);o.real=numD(note.real);
  o.ecart=(o.proj!=null&&o.real!=null)?o.real-o.proj:null;
  o.pct=pctVMA(el,note,cfg);
  o.n={tech:note.tech==null?null:note.tech,strat:note.strat==null?null:note.strat,regles:note.regles==null?null:note.regles,proj:null};
  o.n.proj=(note.projOv!=null)?note.projOv:nivProjet(o.ecart,cfg);
  return o;
}
function triAlpha(L){return L.slice().sort(function(a,b){return String(a.nom).localeCompare(String(b.nom),'fr',{sensitivity:'base'});});}
function splitNom(nom){
  var t=String(nom||'').trim().split(/\s+/),i=0;
  while(i<t.length-1&&t[i]===t[i].toUpperCase()&&/[A-ZÀ-Ý]/.test(t[i]))i++;
  if(i===0&&t.length>1)i=1;
  return {nom:t.slice(0,i).join(' '),prenom:t.slice(i).join(' ')};
}
/* lignes d'un tableur (une feuille) → élèves + notes */
function lireFeuilleEval(rows){
  var hi=-1,col={};
  for(var i=0;i<Math.min(rows.length,6);i++){
    var r=rows[i]||[],tmp={};
    r.forEach(function(c,k){var s=String(c||'').trim().toLowerCase();
      if(s==='vma')tmp.vma=k;else if(/^commentaire/.test(s))tmp.com=k;else if(s==='technique')tmp.tech=k;
      else if(/^projet$/.test(s))tmp.proj=k;else if(/^plots/.test(s))tmp.real=k;else if(/^strat/.test(s))tmp.strat=k;else if(/^r[eè]gles?$/.test(s))tmp.regles=k;});
    if(tmp.vma!=null||tmp.tech!=null||tmp.real!=null){hi=i;col=tmp;break;}
  }
  if(hi<0)return [];
  var out=[];
  for(var q=hi+1;q<rows.length;q++){
    var r2=rows[q]||[],nom=String(r2[0]||'').trim();if(!nom||/^[=#]/.test(nom))continue;
    var g=function(k){return k==null?'':r2[k];};
    var n={tech:codeNiv(g(col.tech)),strat:codeNiv(g(col.strat)),regles:codeNiv(g(col.regles)),proj:numD(g(col.proj)),real:numD(g(col.real)),com:String(g(col.com)||'').trim()};
    out.push({nom:nom,vma:numD(g(col.vma))||0,note:n});
  }
  return out;
}
function tsvBilan(cl,cfg){
  var L=triAlpha(cl.eleves),vis=cfg.comp.filter(function(c){return c.vis;});
  var lines=[['Élève','% VMA'].concat(vis.map(function(c){return c.titre;}),['Commentaire']).join('\t')];
  L.forEach(function(el){var nt=cl.notes[el.id]||{},e=evalEleve(el,nt,cfg),st=nt.st;
    lines.push([el.nom,e.pct!=null?Math.round(e.pct):''].concat(vis.map(function(c){
      if(st)return statLib(st);var n=e.n[c.id];return n==null?'':n<0?'Non évalué':cfg.niv[n];}),[nt.com||'']).join('\t'));});
  return lines.join('\n');
}
function statLib(s){return s==='absent'?'Absent':s==='inapte'?'Inapte / blessé':s==='infirmerie'?'Infirmerie':s==='vs'?'Vie scolaire':'';}
</script>
<script id="param">
/* ---------- Paramètres de l'application : thèmes, tailles, menus… (mémorisés sur la tablette) ---------- */
var PARAM=(function(){
  var CLE='appli_param';
  var THEMES=[
    {id:'ocean',nom:'Océan',c:{encre:'#14213d',accent:'#c0362c',accent2:'#1f6f8b',ok:'#2e8b57',bg:'#f3f5f8',tint:'#eef1f4',bord:'#d9dee4',muted:'#5b6b80'}},
    {id:'foret',nom:'Forêt',c:{encre:'#12331f',accent:'#b5651d',accent2:'#2f7d4f',ok:'#2e8b57',bg:'#f1f6f1',tint:'#e6efe6',bord:'#d0dccf',muted:'#587060'}},
    {id:'prune',nom:'Prune',c:{encre:'#2a1740',accent:'#d6336c',accent2:'#7b3f9e',ok:'#2e8b57',bg:'#f6f2f9',tint:'#ece5f3',bord:'#dbd0e5',muted:'#6a5b80'}},
    {id:'sunset',nom:'Coucher de soleil',c:{encre:'#3b1f14',accent:'#b3261e',accent2:'#d9622b',ok:'#2e8b57',bg:'#fbf3ee',tint:'#f5e7dd',bord:'#e8d5c6',muted:'#806154'}},
    {id:'ardoise',nom:'Ardoise',c:{encre:'#1b263b',accent:'#ee6c4d',accent2:'#3d5a80',ok:'#2e8b57',bg:'#f0f2f6',tint:'#e5e9f0',bord:'#d3d9e3',muted:'#5a6578'}},
    {id:'rose',nom:'Rose',c:{encre:'#4a1d36',accent:'#1f6f8b',accent2:'#c2417a',ok:'#2e8b57',bg:'#fbf1f6',tint:'#f5e3ec',bord:'#e8d2de',muted:'#805468'}},
    {id:'sable',nom:'Sable',c:{encre:'#3a2f1a',accent:'#a23b2a',accent2:'#8a6d3b',ok:'#4f7d3a',bg:'#f7f3ea',tint:'#eee7d6',bord:'#ddd3bb',muted:'#7a6c4e'}},
    {id:'contraste',nom:'Contraste fort',c:{encre:'#000000',accent:'#b00020',accent2:'#003f8a',ok:'#1b6e1b',bg:'#ffffff',tint:'#eeeeee',bord:'#555555',muted:'#333333'}},
    {id:'nuit',nom:'Nuit',sombre:1,c:{encre:'#e8edf5',accent:'#ff7a6b',accent2:'#4aa3c7',ok:'#4cc38a',bg:'#0e1522',tint:'#1e2a45',bord:'#2f3e5c',muted:'#9fb0c6',carte:'#17213a',entete:'#0a101c'}},
    {id:'braise',nom:'Braise',sombre:1,c:{encre:'#f1e9e2',accent:'#ff6b4a',accent2:'#e08a1e',ok:'#6fcf97',bg:'#17120f',tint:'#2b211b',bord:'#45362c',muted:'#b7a498',carte:'#221a15',entete:'#0f0b09'}}
  ];
  var DEF={theme:'ocean',taille:100,densite:'normal',arrondi:'normal',police:'standard',menus:'liste',tactile:0};
  var P=Object.assign({},DEF);
  try{var d=JSON.parse(localStorage.getItem(CLE)||'null');if(d&&typeof d==='object')P=Object.assign(P,d);}catch(e){}
  var POLICES={standard:'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif',lisible:'Verdana,Geneva,"DejaVu Sans",sans-serif',arrondie:'"Trebuchet MS","Segoe UI",Arial Rounded MT Bold,sans-serif',classique:'Georgia,Cambria,"Times New Roman",serif'};
  function theme(){return THEMES.find(function(t){return t.id===P.theme;})||THEMES[0];}
  function sauver(){try{localStorage.setItem(CLE,JSON.stringify(P));}catch(e){}}
  function css(){
    var t=theme(),c=t.c,v='';
    Object.keys(c).forEach(function(k){if(k!=='entete')v+='--'+k+':'+c[k]+';';});
    var o='@media screen{:root{'+v+'}';
    var ent=c.entete||c.encre;
    o+='header#top{background:'+ent+'!important}';
    if(t.sombre){
      o+='body{color-scheme:dark}'
       +'input,select,textarea{background:#0f1726!important;color:var(--encre)!important;border-color:var(--bord)!important}'
       +'.btn:not(.primaire):not(.danger):not(.plein),.chip-p:not(.on),.sous button:not(.on),.eqj:not(.sel),.pa-seg button:not(.on){background:var(--tint)!important;color:var(--encre)!important;border-color:var(--bord)!important}'
       +'nav button.on{background:var(--accent2)!important;color:#fff!important;border-color:var(--accent2)!important}'
       +'.sous button.on,.total,#toast{background:var(--accent2)!important;color:#fff!important;border-color:var(--accent2)!important}'
       +'.modal,.carte,.match,.cl,.carte *:not(.btn):not(button):not(.niv):not(b):not(input):not(select):not(textarea):not(th){border-color:var(--bord)}'
       +'.modal{background:var(--carte)!important;color:var(--encre)}'
       +'.match,.cl,.eqcarte,.eqdispo,.clt td,.t td{background:transparent}'
       +'table.t th,.clt th,.mini th{background:var(--tint)!important;color:var(--muted)!important}'
       +'.warn,.note{background:var(--tint)!important;color:var(--encre)!important}';
    }
    var f=POLICES[P.police]||POLICES.standard;
    if(P.police!=='standard')o+='body,button,input,select,textarea{font-family:'+f+'!important}';
    if(P.taille!==100)o+='main,header#top{zoom:'+(P.taille/100)+'}';
    var R={carre:['3px','3px'],normal:null,rond:['20px','99px']}[P.arrondi];
    if(R)o+='.carte,.modal,.match,.cl,.eqcarte,.eqdispo{border-radius:'+R[0]+'!important}.btn,.chip-p,nav button,.sous button,input,select,textarea,.pa-seg button,.eqj{border-radius:'+R[1]+'!important}';
    if(P.densite==='compact')o+='.carte{padding:8px 11px!important;margin-bottom:10px!important}main{padding:10px!important}.btn,nav button,.sous button,input,select{min-height:34px!important}table td,table th{padding-top:3px!important;padding-bottom:3px!important}';
    if(P.densite==='aere')o+='.carte{padding:20px 22px!important;margin-bottom:22px!important}main{padding:22px!important}table td,table th{padding-top:11px!important;padding-bottom:11px!important}';
    if(P.tactile)o+='.btn,nav button,.sous button,.chip-p,input,select,.eqj,.pa-seg button{min-height:54px!important;font-size:17px!important}';
    return o+'}';
  }
  function appliquer(){
    var st=document.getElementById('pa-style');
    if(!st){st=document.createElement('style');st.id='pa-style';(document.head||document.documentElement).appendChild(st);}
    st.textContent=css();
    enrichir();
  }
  /* menus déroulants -> boutons étiquettes */
  function cap(){return P.menus==='petits'?6:P.menus==='boutons'?10:0;}
  function majSeg(w,sel){
    Array.prototype.forEach.call(w.children,function(b,i){var o=sel.options[i];b.classList.toggle('on',!!o&&o.selected);b.disabled=sel.disabled;});
  }
  function enrichir(){
    var n=cap();

async function lireXlsx(buf){

  if(ss){xml(ss).querySelectorAll('si').forEach(function(si){var t='';si.querySelectorAll('t').forEach(function(x){t+=x.textContent;});shared.push(t);});}
  var sheets=Object.keys(files).filter(function(k){return /^xl\/worksheets\/sheet\d+\.xml$/.test(k);}).sort(function(a,b){return parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]);});
  if(!sheets.length)throw new Error('Aucune feuille trouvée dans le fichier');
  var wbx=await get('xl/workbook.xml'),rel=await get('xl/_rels/workbook.xml.rels'),noms=[];
  if(wbx){var rmap={};if(rel)xml(rel).querySelectorAll('Relationship').forEach(function(r){rmap[r.getAttribute('Id')]='xl/'+String(r.getAttribute('Target')).replace(/^\/?(xl\/)?/,'');});

function imprimer(c,ids){
  var L=triAlpha(c.eleves).filter(function(el){var nt=c.notes[el.id]||{};return !nt.st&&(!ids||ids.indexOf(el.id)>=0);});
  if(!L.length){toast('Aucun coupon à imprimer (élèves absents ou non sélectionnés).');return;}
  sauvegarderAuto('Impression des coupons · '+c.nom);
  var old=$('#impr');if(old)old.remove();
  var d=document.createElement('div');d.id='impr';d.className=fmtImpr;
  d.innerHTML=L.map(function(el){return pagesEleve(c,el,fmtImpr==='a4r');}).join('');

}
/* ---------- Import ---------- */
function cleNom(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]+/g,' ').trim();}
function appliquerFeuille(c,data){
  var n=0,nv=0;
  data.forEach(function(d){
    var el=c.eleves.find(function(x){return cleNom(x.nom)===cleNom(d.nom);});
    if(!el){el={id:uid('e'),nom:d.nom,vma:d.vma||0};c.eleves.push(el);nv++;}else if(d.vma>0)el.vma=d.vma;
    var nt=c.notes[el.id]=c.notes[el.id]||{};
    ['tech','strat','regles','proj','real'].forEach(function(k){if(d.note[k]!=null)nt[k]=d.note[k];});
    if(d.note.com)nt.com=d.note.com;n++;});
  return {n:n,nv:nv};
}
function importerXlsx(file,versClasse){
  file.arrayBuffer().then(lireXlsx).then(function(feuilles){
    var F=feuilles.map(function(f){return {nom:f.nom,data:lireFeuilleEval(f.rows)};}).filter(function(f){return f.data.length;});
    if(!F.length){toast('Aucune feuille d\'évaluation reconnue (colonnes VMA, Technique, Projet…).');return;}
    var corps='<p>Feuilles trouvées :</p>'+F.map(function(f,i){return '<label style="display:block;margin:4px 0"><input type="'+(versClasse?'radio':'checkbox')+'" name="fs" value="'+i+'"'+(versClasse?(i===0?' checked':''):' checked')+'> <b>'+esc(f.nom)+'</b> <small>('+f.data.length+' élèves)</small></label>';}).join('')
      +(versClasse?'<p class="note">Les données sont appliquées à la classe ouverte (élèves reconnus par leur nom ; les absents de la liste sont ajoutés).</p>':'<p class="note">Une classe est créée par feuille cochée.</p>');
    dialogue(versClasse?'Importer dans « '+esc(cl().nom)+' »':'Importer le tableur',corps,[{label:'Annuler',val:false},{label:'Importer',val:true,cls:'primaire'}]).then(function(r){
      if(r.val!==true)return;
      var ch=[].slice.call(r.root.querySelectorAll('input[name=fs]:checked')).map(function(x){return F[+x.value];});
      if(!ch.length)return;
      if(versClasse){var a=appliquerFeuille(cl(),ch[0].data);sauver();render();toast(a.n+' élèves mis à jour'+(a.nv?' dont '+a.nv+' ajouté'+(a.nv>1?'s':''):'')+'.');return;}
      ch.forEach(function(f){var c={id:uid('c'),nom:f.nom,date:Date.now(),evalDate:Date.now(),eleves:[],notes:{}};appliquerFeuille(c,f.data);S.classes.push(c);S.cur=c.id;});
      sauver();vue='saisie';render();toast(ch.length+' classe'+(ch.length>1?'s':'')+' importée'+(ch.length>1?'s':'')+'. Vérifiez la saisie puis imprimez les coupons.');
    });
  }).catch(function(e){toast(e&&e.message?e.message:'Fichier illisible.');});
}

  else if(a==='copierTsv'&&c){var tx=tsvBilan(c,S.cfg);(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(tx):Promise.reject()).then(function(){toast('Bilan copié : collez-le dans un tableur.');}).catch(function(){dialogue('Bilan à copier','<textarea style="width:100%;height:240px" readonly>'+esc(tx)+'</textarea>',[{label:'Fermer',val:true,cls:'primaire'}]);});}
  else if(a==='razTextes'){confirmer('Remettre les textes et barèmes d\'origine ?','Vos modifications de textes, smileys et seuils seront perdues.','Remettre',true).then(function(ok){if(ok){S.cfg=cfgDefaut();sauver();render();}});}
  else if(a==='sauvMaint'){sauvegarderAuto('Sauvegarde manuelle');toast('Sauvegarde faite.');render();}
  else if(a==='sauvShare'){sauvPartagerMaintenant(b.dataset.i);}
  else if(a==='sauvDl'){var so=sauvLire()[+b.dataset.i];if(so)sauvTelecharger(so);}
  else if(a==='sauvRest'){var sr=sauvLire()[+b.dataset.i];if(sr)restaurer(sr.etat,dtJour(sr.t)+' · '+(sr.motif||''));}
});
function restaurer(etat,lib){
  confirmer('Restaurer cette sauvegarde ?','Tout l\'état actuel sera <b>remplacé</b> par « '+esc(lib)+' ». Une sauvegarde de l\'état actuel est faite avant.','Restaurer',true).then(function(ok){
    if(!ok)return;sauvegarderAuto('Avant restauration');
    if(!etat||!Array.isArray(etat.classes)){toast('Sauvegarde invalide.');return;}
    S=etat;S.cfg=Object.assign(cfgDefaut(),S.cfg||{});sauver();render();toast('Sauvegarde restaurée.');});
}
document.addEventListener('change',function(e){
  var el=e.target,c=cl();
  if(el.id==='fxlsx'){if(el.files[0])importerXlsx(el.files[0],false);el.value='';return;}
  if(el.id==='fxlsxCl'){if(el.files[0])importerXlsx(el.files[0],true);el.value='';return;}
  if(el.id==='fmtImpr'){fmtImpr=el.value;return;}
  if(el.id==='sauvFic'){var fs=el.files&&el.files[0];if(!fs)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);restaurer(d.etat||d,fs.name);}catch(x){toast('Fichier de sauvegarde illisible.');}};rd.readAsText(fs);el.value='';return;}
  if(el.dataset.sauvopt){try{localStorage.setItem('df_sauv_fichier',el.checked?'1':'0');}catch(x){}return;}
  if(el.dataset.f==='evalDate'&&c){var t=new Date(el.value+'T12:00:00').getTime();if(t>0){c.evalDate=t;sauver();}return;}
  var tr=el.closest&&el.closest('tr[data-id]');
  if(tr&&c&&el.dataset.f){
    var pe=c.eleves.find(function(x){return x.id===tr.dataset.id;});if(!pe)return;var nt=c.notes[pe.id]=c.notes[pe.id]||{},f=el.dataset.f,v=el.value;
    if(f==='vma'){pe.vma=numD(v)||0;}
    else if(f==='st'){if(v)nt.st=v;else delete nt.st;}
    else if(f==='com'){nt.com=v;}
    else if(f==='proj'||f==='real'){var q=numD(v);nt[f]=q;}
    else{nt[f]=v===''?null:Number(v);el.className='sn'+(v===''?'':v);}
    sauver();majLigne(tr,c,pe);return;
  }
  if(el.dataset.imprcom){S.cfg.imprCom=el.checked;sauver();return;}
  if(el.dataset.vis){var k=S.cfg.comp.find(function(x){return x.id===el.dataset.vis;});if(k){k.vis=el.checked;sauver();}return;}
  if(el.dataset.bar!==undefined){var n=numD(el.value);if(n!=null){S.cfg.bareme[+el.dataset.bar]=n;var b2=S.cfg.bareme.slice().sort(function(x,y){return x-y;});S.cfg.bareme=b2;sauver();render();}return;}
  if(el.dataset.plots){var p=numD(el.value);if(p>0){S.cfg.plots=p;sauver();}return;}
  if(el.dataset.titre){S.cfg.titre=el.value.trim()||'DEMI–FOND';sauver();return;}
  if(el.dataset.sm!==undefined){S.cfg.sm[+el.dataset.sm]=el.value.trim()||S.cfg.sm[+el.dataset.sm];sauver();return;}
  if(el.dataset.nn!==undefined){S.cfg.niv[+el.dataset.nn]=el.value.trim()||S.cfg.niv[+el.dataset.nn];sauver();return;}
  if(el.dataset.ct!==undefined){S.cfg.comp[+el.dataset.ct][el.dataset.k]=el.value;sauver();return;}
  if(el.dataset.cn!==undefined){S.cfg.comp[+el.dataset.cn].niv[+el.dataset.i][+el.dataset.k]=el.value;sauver();return;}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='addNom'){var b=$('[data-act=ajoutEleve]');if(b)b.click();}});
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){vue=b.dataset.v;render();});});
charger();if(!cl()&&S.classes.length)S.cur=S.classes[0].id;
PARAM.rerender=render;
render();
})();
</script>
